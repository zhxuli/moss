<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>时钟</title>
<style>
  html,body{height:100%;margin:0;background:#0b0b0d;color:#f5f5f7;
    font-family:system-ui,'Microsoft YaHei UI',sans-serif;
    display:grid;place-items:center;user-select:none}
  .wrap{text-align:center}
  #t{font-size:clamp(64px,16vw,200px);font-weight:600;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1}
  #d{margin-top:10px;font-size:clamp(14px,2vw,22px);color:#98989d}
  .bar{margin:26px auto 0;width:min(60vw,520px);height:4px;border-radius:2px;
    background:#2c2c2e;overflow:hidden}
  .bar > i{display:block;height:100%;background:#0a84ff;width:0}
  #p{margin-top:8px;font-size:13px;color:#6b6b70}
</style>
</head>
<body>
  <div class="wrap">
    <div id="t">--:--:--</div>
    <div id="d"></div>
    <div class="bar"><i id="b"></i></div>
    <div id="p"></div>
  </div>
<script>
  var W = '日一二三四五六';
  function tick() {
    var n = new Date();
    var p = function (x) { return String(x).padStart(2, '0'); };
    document.getElementById('t').textContent =
      p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
    document.getElementById('d').textContent =
      n.getFullYear() + ' 年 ' + (n.getMonth() + 1) + ' 月 ' + n.getDate() +
      ' 日  星期' + W[n.getDay()];
    var done = (n - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000;
    document.getElementById('b').style.width = (done * 100).toFixed(2) + '%';
    document.getElementById('p').textContent = '今天已过 ' + (done * 100).toFixed(1) + '%';
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
