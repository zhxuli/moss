<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片工具</title>
<!-- 主题：先用系统偏好顶上，避免首帧闪一下；boot 时再用后端读到的值覆盖 -->
<script>
  document.documentElement.dataset.theme =
    (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
</script>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">
</head>
<body>
<div id="app">
  <div class="window">

    <section class="detail">
      <div class="card">

        <!-- ── 上半：挑图。占满剩余高度 —— 这是唯一的主动作 ───────────── -->
        <div class="card-body">

          <!-- 第一行：历史 / 刷新 靠左（原来是"文件夹|文件清单"，和它们换了位置） -->
          <div class="srcbar">
            <select id="history" class="hist" title="最近使用过的文件夹"></select>
            <button class="btn ghost icon" id="btnRefresh" title="刷新（Ctrl+R）">⟳</button>
            <input type="text" id="src" class="mono" spellcheck="false" autocomplete="off"
                   placeholder="D:\图片">
            <button class="btn" id="btnPick">选择…</button>
            <button class="btn" id="btnAddFiles" hidden>加文件…</button>
            <button class="btn ghost" id="btnClearFiles" hidden>清空</button>
          </div>

          <!-- 第二行：文件夹 / 文件清单 这个模式开关，然后是类型快捷选择 -->
          <div class="typebar">
            <div class="seg mode-seg" id="segMode"></div>
            <span class="vsep"></span>
            <span class="types" id="types"></span>
            <span class="spacer"></span>
            <span class="count" id="selCount"></span>
            <button class="btn ghost" id="btnSelAll">全选</button>
            <button class="btn ghost" id="btnSelNone">清除</button>
          </div>

          <!-- 缩略图网格（≤100 张）或紧凑列表（>100 张）。高度自适应 -->
          <div class="picker" id="picker" tabindex="0">
            <div class="picker-empty" id="pickerEmpty">
              <b id="peTitle">把图片或文件夹拖进来</b>
              <span id="peSub">也可以点上面的「选择…」挑一个文件夹</span>
            </div>
            <div class="grid" id="grid" hidden></div>
            <div class="marquee" id="marquee" hidden></div>
          </div>

          <div class="field-note" id="srcNote"></div>
        </div>

        <!-- ── 下半：输出设置。全部摊平，不藏 —— 这些是常用项。
             两行装完：第一行 格式 / 宽度 / 质量(或 ico 尺寸)，第二行 保存模式 ── -->
        <div class="settings">
          <div class="setrow">
            <span class="settings-label">输出</span>
            <div class="seg fmt-seg" id="segFormat"></div>

            <span class="settings-label">宽度</span>
            <span class="width-wrap">
              <input type="text" id="width" class="mono" spellcheck="false" autocomplete="off"
                     placeholder="原尺寸" title="留空 = 保持原始尺寸；填数字 = 等比缩到这个宽度">
              <span class="lead">px</span>
            </span>

            <div class="slot" id="qualitySlot">
              <span class="settings-label">质量</span>
              <input type="range" id="quality" min="1" max="100" step="1">
              <span class="num" id="qualityNum">80%</span>
            </div>

            <div class="slot" id="icoSlot" hidden>
              <span class="settings-label">尺寸</span>
              <div class="checks" id="icoSizes"></div>
            </div>
          </div>

          <div class="setrow">
            <span class="settings-label">保存</span>
            <div class="seg save-seg" id="segSave"></div>
            <span class="hint" id="saveNote"></span>
          </div>
        </div>

        <!-- 危险模式常驻警告：藏起来的是**设置**，不是**警告** -->
        <div class="warnbar" id="warnBar" hidden></div>

        <!-- 日志折叠时**零高度**，展开才占地方 -->
        <div class="output boxed" id="logBox" hidden><pre id="log"></pre></div>

        <div class="actions">
          <button class="log-toggle" id="btnLogToggle" type="button" title="展开 / 收起日志">
            <span class="tri" id="logTri">▸</span>处理日志
          </button>
          <span class="spinner" id="spin" hidden></span>
          <span class="status" id="status">待命</span>
          <span class="hint" id="logHint"></span>
          <span class="spacer"></span>
          <button class="btn ghost" id="btnReveal">打开输出目录</button>
          <button class="btn ghost" id="btnReset">重置</button>
          <button class="btn primary" id="btnStart">开始处理</button>
        </div>

      </div>
    </section>
  </div>

  <div class="drop-veil" id="dropVeil" hidden>
    <div class="drop-card">
      松开就把它加到「源」里
      <span>文件夹 → 整个文件夹；文件 → 文件清单</span>
    </div>
  </div>

  <!-- 悬停某个图片时的详情卡片（跟着鼠标走） -->
  <div class="hovercard" id="hoverCard" hidden>
    <div class="hc-thumb" id="hcThumb"></div>
    <div class="hc-body">
      <div class="hc-name" id="hcName"></div>
      <div class="hc-path" id="hcPath"></div>
      <div class="hc-meta" id="hcMeta"></div>
      <div class="hc-time" id="hcTime"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
