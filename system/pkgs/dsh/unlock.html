<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程 DSH · 本机解锁</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--dim:#94a3b8;
        --acc:#10b981;--ok:#34d399;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
        border-radius:16px;padding:24px 22px}
  h1{font-size:1.2rem;margin:0 0 4px}
  .sub{color:var(--dim);font-size:.82rem;margin-bottom:18px}
  label{display:block;font-size:.85rem;color:var(--dim);margin-bottom:6px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
        background:#0b1526;color:var(--txt);font-size:1rem;outline:none}
  input:focus{border-color:#10b981}
  button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;
         background:var(--acc);color:#fff;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.5}
  .msg{margin-top:12px;font-size:.85rem;min-height:1.2em;text-align:center}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
  .foot{margin-top:16px;text-align:center;color:var(--dim);font-size:.75rem}
</style>
</head>
<body>
<div class="card">
  <h1>远程 DSH</h1>
  <div class="sub">本机电脑已在线 · 请输入本机密码解锁</div>
  <label for="pw">本机密码</label>
  <input type="password" id="pw" placeholder="输入家里电脑设置的密码">
  <button id="go">解锁并进入</button>
  <div class="msg" id="msg"></div>
  <div class="foot">密码仅由本机验证，不经过任何中转</div>
</div>
<script>
(function(){
  var pw=document.getElementById('pw'),btn=document.getElementById('go'),
      msg=document.getElementById('msg');
  btn.addEventListener('click',function(){
    if(!pw.value){msg.className='msg err';msg.textContent='请输入密码';return}
    btn.disabled=true;msg.className='msg';msg.textContent='验证中…';
    fetch('/__dsh_auth__',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({password:pw.value})})
      .then(function(r){return r.json()})
      .then(function(s){
        if(s.ok){msg.className='msg ok';msg.textContent='解锁成功，正在进入…';
          location.href='/dsh-ui/';}
        else{msg.className='msg err';msg.textContent=s.message||'解锁失败';
          btn.disabled=false;pw.select();}
      }).catch(function(){msg.className='msg err';msg.textContent='网络错误';btn.disabled=false;});
  });
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click()});
})();
</script>
</body>
</html>
