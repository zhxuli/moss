<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] },
                    colors: { brand: { emerald: '#10B981', teal: '#14B8A6', amber: '#F59E0B', rose: '#F43F5E' } }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #F0FDF4 0%, #ECFDF5 50%, #F8FAFC 100%); overflow: hidden; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #A7F3D0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #34D399; }
        .glass-card { background-color: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 20px -2px rgba(16, 185, 129, 0.1); }
        .glass-nav { background-color: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); }
        .text-gradient { background: linear-gradient(to right, #10B981, #14B8A6, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        table { table-layout: fixed; width: 100%; border-collapse: collapse; }
        th, td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 10px 12px; }
        thead th { position: sticky; top: 0; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); z-index: 10; text-align: left; border-bottom: 1px solid rgba(16, 185, 129, 0.2); user-select: none; }
        /* 表头悬停交互 */
        th.sortable:hover { background-color: rgba(16, 185, 129, 0.1); cursor: pointer; transition: background-color 0.2s; }
        tbody tr { border-bottom: 1px solid rgba(209, 213, 219, 0.4); transition: background-color 0.2s; }
        tbody tr:hover { background-color: rgba(255, 255, 255, 0.8); }
        .sort-icon { display: inline-block; width: 12px; opacity: 0.3; transition: all 0.2s; }
        .sort-active { opacity: 1; color: #10B981; }
    </style>
</head>
<body class="text-gray-600 relative">
    <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-brand-emerald rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse pointer-events-none z-[-1]"></div>

    <div class="glass-nav px-6 py-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-gradient tracking-tight mr-4">Task Manager Pro</h1>
            <div class="flex bg-white/50 p-1 rounded-2xl border border-white/60 shadow-sm">
                <button class="tab-btn px-4 py-1.5 rounded-xl text-sm font-medium transition-all duration-300 bg-brand-emerald text-white shadow-md" onclick="showTab('processes', this)">进程</button>
                <button class="tab-btn px-4 py-1.5 rounded-xl text-sm font-medium transition-all duration-300 text-gray-500 hover:bg-white/60" onclick="showTab('performance', this)">性能</button>
                <button class="tab-btn px-4 py-1.5 rounded-xl text-sm font-medium transition-all duration-300 text-gray-500 hover:bg-white/60" onclick="showTab('network', this)">网络</button>
                <button class="tab-btn px-4 py-1.5 rounded-xl text-sm font-medium transition-all duration-300 text-gray-500 hover:bg-white/60 flex items-center gap-1" onclick="showTab('guardian', this)">
                    <svg class="w-4 h-4 text-brand-rose" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"></path></svg>守护
                </button>
            </div>
        </div>

        <div class="relative group">
            <input type="text" id="searchInput" placeholder="搜索名称、PID..." 
                   class="w-56 pr-10 pl-10 py-2 rounded-2xl bg-white/70 border border-brand-emerald/30 focus:outline-none focus:ring-2 focus:ring-brand-teal/50 focus:w-64 transition-all duration-300 text-sm shadow-sm">
            <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <button id="clearSearchBtn" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-700 hidden focus:outline-none" onclick="clearSearch()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <div class="flex-1 p-6 overflow-hidden">
        
        <div id="processes" class="tab-content h-full">
            <div class="glass-card rounded-3xl h-full overflow-y-auto">
                <table>
                    <thead>
                        <tr class="text-gray-900 text-sm font-semibold">
                            <th style="width: 8%;" class="sortable rounded-tl-xl" onclick="handleSort('pid')">PID <span id="icon-pid" class="sort-icon">↕</span></th>
                            <th style="width: 32%;" class="sortable" onclick="handleSort('name')">进程信息 (名称 & 路径) <span id="icon-name" class="sort-icon">↕</span></th>
                            <th style="width: 8%;" class="sortable" onclick="handleSort('cpu')">CPU% <span id="icon-cpu" class="sort-icon">↕</span></th>
                            <th style="width: 8%;" class="sortable" onclick="handleSort('mem')">内存% <span id="icon-mem" class="sort-icon">↕</span></th>
                            <th style="width: 14%;" class="sortable" onclick="handleSort('user')">用户 <span id="icon-user" class="sort-icon">↕</span></th>
                            <th style="width: 12%;" class="sortable" onclick="handleSort('status')">状态 <span id="icon-status" class="sort-icon">↕</span></th>
                            <th style="width: 18%; text-align: center;" class="rounded-tr-xl">操作</th>
                        </tr>
                    </thead>
                    <tbody id="process-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <div id="performance" class="tab-content h-full hidden flex-col gap-6">
            <div class="glass-card rounded-3xl p-4 flex-1 relative flex flex-col"><h3 class="text-brand-teal font-bold mb-2 ml-2">CPU (%)</h3><div class="flex-1 w-full relative"><canvas id="cpuChart"></canvas></div></div>
            <div class="glass-card rounded-3xl p-4 flex-1 relative flex flex-col"><h3 class="text-brand-amber font-bold mb-2 ml-2">内存 (%)</h3><div class="flex-1 w-full relative"><canvas id="memChart"></canvas></div></div>
        </div>

        <div id="network" class="tab-content h-full hidden">
            <div class="glass-card rounded-3xl h-full overflow-y-auto">
                <table>
                    <thead>
                        <tr class="text-gray-900 text-sm font-semibold">
                            <th style="width: 10%;">PID</th>
                            <th style="width: 20%;">进程名称</th>
                            <th style="width: 25%;">本地地址</th>
                            <th style="width: 20%;">远程地址</th>
                            <th style="width: 10%;">状态</th>
                            <th style="width: 15%; text-align: center;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="network-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <div id="guardian" class="tab-content h-full hidden">
            <div class="glass-card rounded-3xl h-full p-6 flex flex-col">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-2">进程黑名单拦截</h2>
                    <p class="text-sm text-gray-500 mb-4">加入此列表的进程，如果在后台被检测到运行，将会被系统瞬间自动结束。</p>
                    <div class="flex gap-3">
                        <input type="text" id="blacklistInput" placeholder="例如: notepad.exe" class="flex-1 px-4 py-2 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-rose focus:outline-none">
                        <button onclick="addToBlacklist()" class="bg-brand-rose hover:bg-rose-600 text-white px-6 py-2 rounded-xl font-medium shadow-md hover:shadow-lg transition">添加拦截</button>
                    </div>
                </div>
                <div class="flex-1 border border-gray-100 rounded-2xl bg-white/50 p-4 overflow-y-auto">
                    <h3 class="text-sm font-semibold text-gray-600 mb-3">当前拦截名单：</h3>
                    <div id="blacklistContainer" class="flex flex-wrap gap-2">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let processTableBody = document.getElementById('process-table-body');
        let networkTableBody = document.getElementById('network-table-body');
        let searchInput = document.getElementById('searchInput');
        let clearSearchBtn = document.getElementById('clearSearchBtn');
        
        let processRowCache = {}; 
        let networkRowCache = {}; 

        // --- 【新增】排序核心变量 ---
        let latestProcessData = []; // 缓存最新一帧数据，用于瞬间排序
        let currentSort = { key: 'cpu', dir: 'desc' }; // 默认按CPU倒序排

        function showTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(c => { c.classList.add('hidden'); c.classList.remove('flex'); });
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.className = "tab-btn px-4 py-1.5 rounded-xl text-sm font-medium transition-all duration-300 text-gray-500 hover:bg-white/60"; });
            
            const target = document.getElementById(tabId);
            if(tabId === 'performance' || tabId === 'guardian') { target.classList.remove('hidden'); target.classList.add('flex'); } 
            else { target.classList.remove('hidden'); }
            
            if(tabId === 'guardian') {
                btnElement.className = "tab-btn px-4 py-1.5 rounded-xl text-sm font-medium transition-all duration-300 bg-brand-rose text-white shadow-md flex items-center gap-1";
                refreshBlacklistUI();
            } else {
                btnElement.className = "tab-btn px-4 py-1.5 rounded-xl text-sm font-medium transition-all duration-300 bg-brand-emerald text-white shadow-md";
            }
        }

        searchInput.addEventListener('input', () => {
            clearSearchBtn.style.display = searchInput.value.length > 0 ? 'block' : 'none';
            applySearchFilter();
        });

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            applySearchFilter();
        }

        function applySearchFilter() {
            const term = searchInput.value.toLowerCase().trim();
            for (const pid in processRowCache) {
                const row = processRowCache[pid];
                row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
            }
            for (const key in networkRowCache) {
                const row = networkRowCache[key];
                row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
            }
        }

        function killProcess(pid) {
            window.pywebview.api.kill_process(pid).then(response => {
                if (response.status === 'success') {
                    if (processRowCache[pid]) { processRowCache[pid].remove(); delete processRowCache[pid]; }
                } else {
                    alert(response.message); 
                }
            });
        }

        function openLocation(path) {
            if (!path) return;
            window.pywebview.api.open_file_location(path).then(res => {
                if (res.status === 'error') alert(res.message);
            });
        }

        function quickBlacklist(name) {
            if (confirm(`确定要将进程 [${name}] 加入黑名单吗？\n一旦加入，系统将在后台自动秒杀该进程。`)) {
                window.pywebview.api.add_blacklist(name).then(() => {
                    refreshBlacklistUI(); 
                });
            }
        }

        // --- 【新增】排序触发器与 UI 更新 ---
        function handleSort(key) {
            if (currentSort.key === key) {
                // 点击同一列，反转方向
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                // 点击新列，赋予智能默认值
                currentSort.key = key;
                currentSort.dir = ['cpu', 'mem', 'pid'].includes(key) ? 'desc' : 'asc';
            }
            
            // 更新箭头UI
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.innerHTML = '↕';
                icon.classList.remove('sort-active');
            });
            const activeIcon = document.getElementById(`icon-${key}`);
            if(activeIcon) {
                activeIcon.innerHTML = currentSort.dir === 'asc' ? '↑' : '↓';
                activeIcon.classList.add('sort-active');
            }

            // 立即渲染排序后的数据
            if(latestProcessData.length > 0) {
                renderProcessTable(latestProcessData);
            }
        }

        // --- 【重构】拆分接收数据和渲染逻辑 ---
        function updateProcessTable(data) {
            latestProcessData = data; // 保存最新数据
            renderProcessTable(data); // 调用渲染
        }

        function renderProcessTable(data) {
            // 1. 根据当前设置对数据进行排序
            let sortedData = [...data].sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];

                // 数值类型转换
                if (['pid', 'cpu', 'mem'].includes(currentSort.key)) {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                } else {
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                }

                if (valA < valB) return currentSort.dir === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.dir === 'asc' ? 1 : -1;
                return 0;
            });

            const incomingPids = new Set();
            
            // 2. 更新或创建 DOM 元素
            sortedData.forEach(proc => {
                incomingPids.add(proc.pid);
                const row = processRowCache[proc.pid];
                
                const displayUser = proc.user.includes('\\') ? proc.user.split('\\').pop() : proc.user;
                let statusColor = proc.status === 'running' ? 'text-brand-emerald' : 'text-gray-500';

                if (row) { 
                    row.cells[2].textContent = proc.cpu;
                    row.cells[3].textContent = proc.mem;
                } else { 
                    const newRow = document.createElement('tr');
                    const escapedPath = proc.exe ? proc.exe.replace(/\\/g, '\\\\') : '';
                    const pathHtml = proc.exe ? `<span class="block text-[11px] text-gray-400 font-normal mt-0.5 truncate max-w-[300px] cursor-pointer hover:text-brand-teal hover:underline transition-colors" title="点击打开文件位置: ${proc.exe}" onclick="openLocation('${escapedPath}')">${proc.exe}</span>` : '';
                    
                    newRow.innerHTML = `
                        <td class="font-medium text-gray-700">${proc.pid}</td>
                        <td class="text-gray-900 font-medium leading-tight">${proc.name}${pathHtml}</td>
                        <td>${proc.cpu}</td>
                        <td>${proc.mem}</td>
                        <td title="${proc.user}">${displayUser}</td>
                        <td><span class="${statusColor}">${proc.status}</span></td>
                        <td style="text-align: center;">
                            <div class="flex items-center justify-center gap-2">
                                <button class="bg-red-50 hover:bg-red-500 text-red-500 hover:text-white border border-red-200 hover:border-transparent px-3 py-1 rounded-lg text-xs font-medium transition-all" onclick="killProcess(${proc.pid})">结束</button>
                                <button class="bg-gray-50 hover:bg-brand-rose text-gray-500 hover:text-white border border-gray-200 hover:border-transparent px-3 py-1 rounded-lg text-xs font-medium transition-all" title="加入黑名单自动结束" onclick="quickBlacklist('${proc.name}')">拉黑</button>
                            </div>
                        </td>
                    `;
                    processRowCache[proc.pid] = newRow;
                }
                
                // 3. 【核心排序魔法】利用 appendChild 的特性，将元素按照排序后的顺序移动到队尾
                processTableBody.appendChild(processRowCache[proc.pid]);
            });

            // 4. 清理死掉的进程
            for (const pid in processRowCache) {
                if (!incomingPids.has(parseInt(pid))) { 
                    processRowCache[pid].remove(); 
                    delete processRowCache[pid]; 
                }
            }
            
            applySearchFilter();
        }
        
        function updateNetworkTable(data) {
            if (typeof data === 'string') return;
            const incomingConnKeys = new Set();

            data.forEach(conn => {
                const connKey = `${conn.pid}-${conn.laddr}-${conn.raddr}`;
                incomingConnKeys.add(connKey);
                
                if (!networkRowCache[connKey]) {
                    const newRow = networkTableBody.insertRow();
                    newRow.innerHTML = `
                        <td class="font-medium text-gray-700">${conn.pid}</td>
                        <td class="text-gray-900 font-medium">${conn.name}</td>
                        <td class="text-gray-500 text-xs">${conn.laddr}</td>
                        <td class="text-gray-500 text-xs">${conn.raddr}</td>
                        <td><span class="px-2 py-1 bg-brand-teal/10 text-brand-teal rounded-lg text-xs font-medium">${conn.status}</span></td>
                        <td style="text-align: center;">
                            <button class="bg-red-50 hover:bg-red-500 text-red-500 hover:text-white border border-red-200 hover:border-transparent px-3 py-1 rounded-lg text-xs font-medium transition-all" onclick="killProcess(${conn.pid})">结束</button>
                        </td>
                    `;
                    networkRowCache[connKey] = newRow;
                }
            });

            for (const key in networkRowCache) {
                if (!incomingConnKeys.has(key)) { networkRowCache[key].remove(); delete networkRowCache[key]; }
            }
            applySearchFilter();
        }

        function addToBlacklist() {
            const input = document.getElementById('blacklistInput');
            const val = input.value.trim();
            if(!val) return;
            
            window.pywebview.api.add_blacklist(val).then(() => {
                input.value = '';
                refreshBlacklistUI();
            });
        }

        function removeBlacklist(name) {
            window.pywebview.api.remove_blacklist(name).then(() => {
                refreshBlacklistUI();
            });
        }

        function refreshBlacklistUI() {
            window.pywebview.api.get_blacklist().then(list => {
                const container = document.getElementById('blacklistContainer');
                container.innerHTML = '';
                if(list.length === 0) {
                    container.innerHTML = '<span class="text-gray-400 text-sm">暂无拦截规则，您的系统很自由。</span>';
                    return;
                }
                list.forEach(name => {
                    const tag = document.createElement('div');
                    tag.className = 'flex items-center gap-2 px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-lg text-sm font-medium shadow-sm transition-all hover:shadow-md';
                    tag.innerHTML = `
                        <span>${name}</span>
                        <button onclick="removeBlacklist('${name}')" class="text-rose-400 hover:text-rose-600 focus:outline-none hover:scale-110 transition-transform">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    container.appendChild(tag);
                });
            });
        }

        let cpuChart, memChart;
        function updatePerformanceCharts(data) {
            if(!cpuChart) return;
            cpuChart.data.labels.push(''); cpuChart.data.datasets[0].data.push(data.cpu);
            if (cpuChart.data.labels.length > 60) { cpuChart.data.labels.shift(); cpuChart.data.datasets[0].data.shift(); }
            cpuChart.update('none');

            memChart.data.labels.push(''); memChart.data.datasets[0].data.push(data.mem);
            if (memChart.data.labels.length > 60) { memChart.data.labels.shift(); memChart.data.datasets[0].data.shift(); }
            memChart.update('none');
        }

        window.onload = function() {
            // 初始化默认箭头UI
            handleSort('cpu'); 

            const chartOpts = { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100, grid: { color: 'rgba(209,213,219,0.3)'}, ticks: { color: '#6B7280'}}, x: { display: false }}, plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } }, elements: { point: { radius: 0 }, line: { borderWidth: 2 } } };
            const cpuCtx = document.getElementById('cpuChart').getContext('2d');
            cpuChart = new Chart(cpuCtx, { type: 'line', data: { labels: [], datasets: [{ label: 'CPU', data: [], borderColor: '#14B8A6', tension: 0.4 }] }, options: chartOpts });
            const memCtx = document.getElementById('memChart').getContext('2d');
            memChart = new Chart(memCtx, { type: 'line', data: { labels: [], datasets: [{ label: 'MEM', data: [], borderColor: '#F59E0B', tension: 0.4 }] }, options: chartOpts });
        };
    </script>
</body>
</html>
