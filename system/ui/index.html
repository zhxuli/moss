<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moss</title>
<style>
:root{
  --bg:#f5f5f7; --panel:#fff; --panel2:#fbfbfd; --line:#e2e2e8; --line2:#eeeef3;
  --fg:#1c1c1e; --dim:#6b6b73; --accent:#0a84ff; --accent-fg:#fff;
  --hover:#f0f0f4; --sel:#e8f1ff; --out-bg:#14161a; --out-fg:#d7dae0;
  --code-bg:#fbfbfd; --field-focus:rgba(10,132,255,.20);
  --mono: ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace;
  /* 语法配色照抄 exec（GitHub 那套浅/深色） */
  --syn-comment:#6e7781; --syn-keyword:#cf222e; --syn-string:#0a3069;
  --syn-number:#0550ae;  --syn-title:#8250df;   --syn-builtin:#953800;
  --syn-attr:#0550ae;    --syn-meta:#6e7781;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181d; --panel:#1d2026; --panel2:#22252c; --line:#2c3038; --line2:#262a31;
         --fg:#e8eaed; --dim:#9aa0aa; --hover:#262a31; --sel:#1f2c3d; --out-bg:#0f1114;
         --out-fg:#c9ced6; --code-bg:#1b1e24; --field-focus:rgba(10,132,255,.28);
         --syn-comment:#8b949e; --syn-keyword:#ff7b72; --syn-string:#a5d6ff;
         --syn-number:#79c0ff;  --syn-title:#d2a8ff;   --syn-builtin:#ffa657;
         --syn-attr:#79c0ff;    --syn-meta:#8b949e; }
}
*{box-sizing:border-box}
/* ★ 必须有这条兜底：`display:flex` 之类会压过浏览器默认的 `[hidden]{display:none}`，
   于是 `el.hidden = true` 看起来毫无反应（实测坑）。 */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--fg);background:var(--bg)}
svg.i{width:16px;height:16px;flex:none;display:block}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 8px;min-width:32px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer;font:inherit}
.iconbtn:hover{background:var(--hover)}
.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn.warn:hover{border-color:#d64545;color:#d64545}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
#q{width:230px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.meta{flex:1;color:var(--dim);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:right}
main{flex:1;display:flex;min-height:0}
aside{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#list{flex:1;overflow:auto;min-height:0}
.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);
  cursor:pointer;align-items:center}
.item:hover{background:var(--hover)}
.item.sel{background:var(--sel)}
.ico{width:24px;height:24px;flex:none;display:flex;align-items:center;
  justify-content:center;color:var(--dim)}
.ico svg,.ico img{width:24px;height:24px}
.ico img{object-fit:contain}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds,.sub{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-family:var(--mono);font-size:11px}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:4px;align-items:center;padding:7px 12px;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel)}
.tab{padding:5px 13px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--dim);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--panel2);border-color:var(--line);color:var(--fg);font-weight:500}
#tabcmd{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
/* ★ 别写 `#pane-x{display:none}`：ID 选择器优先级高于 `.pane.on`，面板会永远 0×0 */
#pane-detail{overflow:auto;padding:18px 22px}
#pane-detail.on{display:block}
#pane-console.on{display:flex;flex-direction:column}
#pane-file.on{display:flex;flex-direction:column}
.outbar{display:flex;gap:6px;align-items:center;padding:6px 12px;flex:none;
  border-bottom:1px solid var(--line2);background:var(--panel);color:var(--dim);font-size:12px}
.outbar .iconbtn{padding:4px 6px;min-width:28px}
#out{flex:1;overflow:auto;margin:0;padding:12px 14px;background:var(--out-bg);
  color:var(--out-fg);font-family:var(--mono);font-size:13px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;user-select:text;cursor:text}
#out::selection{background:#3a5a8c;color:#fff}
/* ---- 状态灯 ---- */
.lamp{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;
  box-sizing:border-box;background:transparent;border:1.5px solid #bfc0c9;vertical-align:middle}
.lamp[data-state=running]{border-color:transparent;background:#1f9d55;
  animation:lamp-pulse 1.15s ease-in-out infinite}
.lamp[data-state=ok]{border-color:transparent;background:#8e8e93;
  box-shadow:0 0 0 2px rgba(142,142,147,.16)}
.lamp[data-state=fail]{border-color:transparent;background:#d64545;box-shadow:0 0 7px rgba(214,69,69,.6)}
.lamp[data-state=warn]{border-color:transparent;background:#dfa100;box-shadow:0 0 7px rgba(223,161,0,.6)}
.lamp.big{width:11px;height:11px}
.lamp.tiny{width:7px;height:7px}
@keyframes lamp-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(31,157,85,.55);opacity:1}
  50%{box-shadow:0 0 0 5px rgba(31,157,85,0);opacity:.55}
}
.item[data-state=running]{box-shadow:inset 3px 0 0 #1f9d55}
.item .lamp{margin-left:6px}
.status{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--dim);margin-top:9px}
.spin{width:11px;height:11px;border-radius:50%;flex:none;display:none;
  border:1.6px solid rgba(127,127,127,.35);border-top-color:#1f9d55;
  animation:spin .7s linear infinite}
.spin.on{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* ================= 文件管理：**属于某一个包**的一套界面 =================
   结构是"文件管理"这个大选项卡 -> 里面的子选项卡：
     ① 「文件」固定在最左、**不能关闭**（目录浏览，资源管理器那套操作）
     ② 每打开一个文件 = 新增一个子选项卡（可关闭、带未保存黄点）
   子选项卡是**文件管理内部的**，不和顶层的 详情/命令行/文件管理 平级。 */
#fm-bar{display:flex;gap:4px;align-items:flex-end;padding:6px 10px 0;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;overflow-y:hidden}
.fmtab{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px 8px 0 0;
  border:1px solid transparent;border-bottom:none;background:transparent;color:var(--dim);
  cursor:pointer;font-size:13px;white-space:nowrap;max-width:240px}
.fmtab:hover{background:var(--hover)}
.fmtab.on{background:var(--bg);border-color:var(--line);color:var(--fg);font-weight:500}
.fmtab .fname{overflow:hidden;text-overflow:ellipsis}
.fmtab .x{margin-left:2px;color:var(--dim);border-radius:4px;padding:0 3px;line-height:1}
.fmtab .x:hover{background:#d64545;color:#fff}
.fmtab .fdot{width:7px;height:7px;border-radius:50%;background:#dfa100;flex:none}
#fm-home{margin-left:auto;align-self:center;padding-bottom:4px}
.fmwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.fmpage{flex:1;min-height:0;display:none;flex-direction:column}
.fmpage.on{display:flex}
.fbnav{display:flex;gap:4px;align-items:center;padding:6px 10px;flex:none;
  border-bottom:1px solid var(--line2);background:var(--panel)}
.crumbs{flex:1;display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;
  padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  font-size:12.5px;white-space:nowrap}
.crumbs span.seg{padding:1px 5px;border-radius:5px;cursor:pointer}
.crumbs span.seg:hover{background:var(--hover)}
.crumbs span.sep{color:var(--dim)}
.crumbs span.here{color:var(--dim);cursor:default}
.fbtools{display:flex;gap:4px;align-items:center;padding:5px 10px;flex:none;flex-wrap:wrap;
  border-bottom:1px solid var(--line2);background:var(--panel)}
.fbtools .iconbtn{padding:4px 6px;min-width:28px}
.fbtools .gap{width:8px}
.layers{display:flex;gap:4px;align-items:center;flex:none}
.layers .iconbtn{padding:3px 9px;min-width:0;font-size:12px}
.layers .iconbtn.on{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.fbwrap{flex:1;overflow:auto;min-height:0}
table.fb{width:100%;border-collapse:collapse;font-size:13px;user-select:none}
table.fb th{position:sticky;top:0;z-index:1;text-align:left;font-weight:500;color:var(--dim);
  background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;cursor:pointer;
  white-space:nowrap}
table.fb th .arrow{color:var(--accent);margin-left:4px}
table.fb td{padding:4px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
table.fb td.nmcell{display:flex;align-items:center;gap:8px;max-width:420px}
table.fb tr.row:hover{background:var(--hover)}
table.fb tr.row.sel{background:var(--sel)}
table.fb td.num{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
table.fb td.dim{color:var(--dim)}
.fbstatus{padding:5px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--line2);
  background:var(--panel);flex:none;display:flex;gap:12px;align-items:center}
/* ---- 编辑器（子选项卡里的那页）---- */
.editor{position:relative;flex:1;min-height:0;margin:10px 12px 12px;overflow:hidden;
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.editor > pre,.editor > textarea{
  position:absolute;inset:0;margin:0;border:0;padding:10px 12px;
  font:13px/1.55 var(--mono);letter-spacing:0;tab-size:4;white-space:pre;
  overflow:auto;overflow-wrap:normal;word-break:normal}
.editor > pre{pointer-events:none;color:var(--fg);background:transparent}
.editor > textarea{background:transparent;color:transparent;caret-color:var(--fg);
  resize:none;outline:none;user-select:text}
.editor > textarea::selection{background:rgba(10,132,255,.30)}
.hljs-comment,.hljs-quote{color:var(--syn-comment);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,
.hljs-doctag,.hljs-type,.hljs-name,.hljs-tag{color:var(--syn-keyword)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,
.hljs-meta .hljs-string{color:var(--syn-string)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-variable,
.hljs-template-variable,.hljs-link,.hljs-selector-attr,
.hljs-selector-pseudo{color:var(--syn-number)}
.hljs-title,.hljs-title.class_,.hljs-title.function_{color:var(--syn-title)}
.hljs-built_in,.hljs-builtin-name{color:var(--syn-builtin)}
.hljs-attr,.hljs-property,.hljs-params,.hljs-selector-class,
.hljs-selector-id{color:var(--syn-attr)}
.hljs-meta,.hljs-deletion{color:var(--syn-meta)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:600}
.note{padding:6px 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line2);
  background:var(--panel2);display:flex;align-items:center;gap:7px}
.dirtydot{width:7px;height:7px;border-radius:50%;background:#dfa100;flex:none}
/* ---- 右键菜单 ---- */
#ctxmenu{position:fixed;z-index:70;min-width:200px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:5px;
  box-shadow:0 14px 40px rgba(0,0,0,.28)}
#ctxmenu .mi{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--fg)}
#ctxmenu .mi:hover{background:var(--hover)}
#ctxmenu .mi.dis{opacity:.4;cursor:default}
#ctxmenu .mi.dis:hover{background:transparent}
#ctxmenu .sep{height:1px;background:var(--line2);margin:4px 6px}
/* ---- 详情 ---- */
h1{font-size:19px;margin:0 0 4px}
.hd{display:flex;gap:14px;align-items:flex-start}
.hd .actions{margin-left:auto;display:flex;gap:6px;flex:none}
.bigico{width:44px;height:44px;flex:none;color:var(--dim)}
.bigico svg,.bigico img{width:44px;height:44px}
.chip{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);font-size:12px;color:var(--dim);margin:0 6px 6px 0}
.chip.click{cursor:pointer;font-family:var(--mono)}
.chip.click:hover{border-color:var(--accent);color:var(--accent)}
table.p{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:13px}
table.p th,table.p td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.p th{color:var(--dim);font-weight:500}
code,.mono{font-family:var(--mono);font-size:12.5px}
.sec{margin-top:16px}
.sec h2{font-size:11.5px;letter-spacing:.06em;color:var(--dim);margin:0 0 6px;
  font-weight:600;text-transform:uppercase}
.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#args{flex:1;min-width:180px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);outline:none}
#args:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.empty{color:var(--dim);text-align:center;margin-top:70px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
  align-items:center;justify-content:center;z-index:80}
#modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;min-width:340px;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.card h3{margin:0 0 10px;font-size:15px}
.card p{margin:0 0 12px;color:var(--dim);font-size:13px;line-height:1.6;word-break:break-all}
.card input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);outline:none}
.card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.card .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.card .btns button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer;font:inherit}
.card .btns button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card .btns button.danger{background:#d64545;border-color:#d64545;color:#fff}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;align-items:center;z-index:90;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.22);
  max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.bad{border-color:#d64545;color:#d64545}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>moss</div>
  <input id="q" placeholder="搜索包名 / 说明 / 标签…">
  <div class="meta" id="meta"></div>
  <button id="btn-selfcheck" class="iconbtn" title="自检（moss --selfcheck）"></button>
  <button id="btn-refresh" class="iconbtn" title="刷新包列表"></button>
  <button id="btn-quit" class="iconbtn" title="退出"></button>
</header>

<main>
  <aside><div id="list"></div></aside>
  <div id="right">
    <div id="tabs">
      <button class="tab active" data-tab="detail">详情</button>
      <button class="tab" data-tab="console">命令行<span class="lamp tiny" id="tablamp" data-state="idle"></span></button>
      <button class="tab" data-tab="file">文件管理</button>
      <span id="tabcmd"></span>
    </div>

    <section class="pane on" id="pane-detail"><div class="empty">左边选一个包</div></section>

    <section class="pane" id="pane-console">
      <div class="outbar">
        <span class="lamp" id="outlamp" data-state="idle"></span>
        <span class="spin" id="outspin"></span>
        <span id="outinfo">还没跑过</span>
        <span style="flex:1"></span>
        <button id="btn-copy" class="iconbtn" title="复制全部输出"></button>
        <button id="btn-rerun" class="iconbtn" title="再跑一次刚才那条命令"></button>
        <button id="btn-clear" class="iconbtn" title="清空输出"></button>
      </div>
      <pre id="out">就绪。选一个包，填参数，点「运行」。</pre>
    </section>

    <section class="pane" id="pane-file">
      <div id="fm-bar"></div>
      <div class="fmwrap" id="fm-body"></div>
    </section>
  </div>
</main>

<div id="ctxmenu" hidden></div>
<div id="modal"><div class="card">
  <h3 id="m-title">标题</h3>
  <p id="m-text"></p>
  <input id="m-input" autocomplete="off" spellcheck="false">
  <div class="btns">
    <button id="m-cancel">取消</button>
    <button id="m-ok" class="primary">确定</button>
  </div>
</div></div>
<div id="toasts"></div>

<script src="vendor/highlight.min.js"></script>
<script src="vendor/powershell.min.js"></script>
<script src="vendor/dos.min.js"></script>
<script src="vendor/lucide.js"></script>
<script>
/* ============================================================================
   moss 界面：详情 / 命令行 / **文件管理**
   文件管理是**每个包自己的一套**（上下文按包 id 分），里面的子选项卡：
       「文件」固定不可关（目录浏览，资源管理器那套操作）
       + 每打开一个文件一个子选项卡（可关、带未保存黄点）
   高亮与编辑器结构照抄 exec；图标用 Lucide。
   ========================================================================== */

let DATA = null, cur = null, busy = false, tab = "detail";
let lastRun = null;
const $ = s => document.querySelector(s);

/* ---------------------------------------------------------------- 后缀 → 图标/颜色/语言 */
const EXT = {
  py:{i:"file-code",c:"#3572A5",l:"python"}, pyw:{i:"file-code",c:"#3572A5",l:"python"},
  js:{i:"file-code",c:"#c9a227",l:"javascript"}, mjs:{i:"file-code",c:"#c9a227",l:"javascript"},
  ts:{i:"file-code",c:"#2b7489",l:"typescript"}, go:{i:"file-code",c:"#00ADD8",l:"go"},
  rs:{i:"file-code",c:"#dea584",l:"rust"}, c:{i:"file-code",c:"#7a7a7a",l:"c"},
  h:{i:"file-code",c:"#7a7a7a",l:"c"}, cpp:{i:"file-code",c:"#f34b7d",l:"cpp"},
  java:{i:"file-code",c:"#b07219",l:"java"}, cs:{i:"file-code",c:"#178600",l:"csharp"},
  php:{i:"file-code",c:"#7a86b8",l:"php"}, rb:{i:"file-code",c:"#cc342d",l:"ruby"},
  lua:{i:"file-code",c:"#000080",l:"lua"}, sql:{i:"database",c:"#e38c00",l:"sql"},
  html:{i:"globe",c:"#e34c26",l:"xml"}, htm:{i:"globe",c:"#e34c26",l:"xml"},
  xml:{i:"code",c:"#8a8a8a",l:"xml"}, svg:{i:"palette",c:"#ffb13b",l:"xml"},
  css:{i:"palette",c:"#563d7c",l:"css"}, scss:{i:"palette",c:"#c6538c",l:"scss"},
  less:{i:"palette",c:"#1d365d",l:"less"},
  json:{i:"braces",c:"#c9a227",l:"json"}, jsonc:{i:"braces",c:"#c9a227",l:"json"},
  md:{i:"book-open",c:"#6e7781",l:"markdown"}, markdown:{i:"book-open",c:"#6e7781",l:"markdown"},
  txt:{i:"file-text",c:"#6e7781",l:"plaintext"}, log:{i:"file-text",c:"#6e7781",l:"plaintext"},

function extOf(entry){
  const name = (entry.name || "").toLowerCase();
  if (NO_EXT[name]) return Object.assign({ext:""}, NO_EXT[name]);
  return Object.assign({ext: entry.ext || ""}, EXT[entry.ext] || {i:"file", c:"#8a8a8a"});

function typeLabel(entry){
  if (entry.dir) return "文件夹";
  const e = entry.ext || "";
  return e ? (e.toUpperCase() + " 文件") : "文件";
}
function humanSize(n){
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function fmtTime(sec){
  if (!sec) return "";
  const d = new Date(sec * 1000), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes());
}
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
}

/* ---------------------------------------------------------------- 状态灯 */
const STATE = {};
let consoleWho = null;
function stateOf(id){ return STATE[id] || {state:"idle"}; }
function setState(id, st, extra){
  STATE[id] = Object.assign({state:st, ts:Date.now()}, extra || {});
  consoleWho = id; paintStates();
}
function stateLabel(s){
  if (s.state === "running") return "运行中";
  if (s.state === "ok") return "已完成 · 退出码 " + (s.code === undefined ? 0 : s.code) +
      (s.ms ? " · " + (s.ms / 1000).toFixed(2) + " 秒" : "");
  if (s.state === "fail") return "故障 · 退出码 " + (s.code === undefined ? "?" : s.code) +
      (s.ms ? " · " + (s.ms / 1000).toFixed(2) + " 秒" : "");
  if (s.state === "warn") return s.note || "有情况（结果未知）";
  return "还没跑过";
}
function paintStates(){
  document.querySelectorAll(".item").forEach(el => {
    const st = stateOf(el.dataset.id).state;
    el.dataset.state = st;
    const lamp = el.querySelector(".lamp");
    if (lamp) lamp.dataset.state = st;
  });
  const s = consoleWho ? stateOf(consoleWho) : {state:"idle"};
  [$("#tablamp"), $("#outlamp")].forEach(l => { if (l) l.dataset.state = s.state; });
  const sp = $("#outspin");
  if (sp) sp.classList.toggle("on", s.state === "running");
  const info = $("#outinfo");
  if (info && consoleWho) info.textContent = stateLabel(s);
  const pill = $("#statuspill");
  if (pill && cur){
    const cs = stateOf(cur.id);
    pill.querySelector(".lamp").dataset.state = cs.state;
    const t = $("#statustext");
    if (t) t.textContent = stateLabel(cs);
  }
}
function clearConsoleState(){

  const sp = $("#outspin");
  if (sp) sp.classList.remove("on");

/* ---------------------------------------------------------------- 面板 */

    b.classList.toggle("active", b.dataset.tab === name));

function stripAnsi(s){
  return String(s == null ? "" : s)
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "")
    .replace(/[\x1b][()][A-Za-z0-9]/g, "")
    .replace(/[\r\f]/g, "");
}
function out(text, info){
  const el = $("#out");
  el.textContent = stripAnsi(text);
  el.scrollTop = el.scrollHeight;
  if (info !== undefined && info !== null) $("#outinfo").textContent = info;
}
async function copyOut(){
  const text = $("#out").textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ ok = false; }
  if (!ok){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
  }
  $("#outinfo").textContent = ok ? ("已复制 " + text.length + " 个字符")
                                 : "复制失败（可以手动选中后 Ctrl+C）";
}
function setCmd(t){ $("#tabcmd").textContent = t || ""; }

/* ---------------------------------------------------------------- 运行 / 停止
   跑包不再是"一个阻塞调用"（那样跑起来就停不了，长驻的东西会把界面卡住）。
   走宿主的 `run_start` / `run_poll` / `run_stop`：200ms 轮询一次，
   输出**流式**刷进「命令行」，随时能按停止（连子孙进程一起杀）。

   ★ 但"这个包在不在跑"**不能只看我这份 RUN**：包可能是从终端开的、
   或者它的父进程 fork 出界面后自己退了、或者 moss 界面重启过。
   所以按钮状态一律问宿主 `pkg_state`（它按进程环境里的 `MOSS_PKG_ID` 认，
   不管是谁拉起来的）。本地的 RUN 只用来决定"输出还能不能流式看"。 */
let RUN = null;                 // {id, rid, cmd, timer}
const PST = {};                 // 包 id -> {running, pids, windows, visible, titles}
let pstTimer = null;

async function refreshPkgState(p){
  if (!p) return;
  try{ PST[p.id] = await pywebview.api.pkg_state(p.id); }
  catch(e){ PST[p.id] = {running: false, windows: 0, visible: false}; }
  paintActions(p);
}

function paintActions(p){
  if (!cur || cur.id !== p.id) return;
  const st = PST[p.id] || {running: false, windows: 0, visible: false};
  const mine = !!(RUN && RUN.id === p.id);
  const running = mine || !!st.running;
  const b = $("#btn-run");
  if (b){
    b.innerHTML = running ? (ico("square", "i") + "<span>停止</span>")
                          : (ico("play", "i") + "<span>运行</span>");
    b.title = running
      ? (mine ? "停掉这次运行（连同它拉起的子进程）"
              : "停掉这个包正在跑的进程（它是从别处启动的）")
      : "运行这个包（输出进「命令行」；参数留空 = 通常开界面）";
    b.classList.toggle("warn", running);
  }
  const v = $("#btn-vis");
  if (v){
    v.innerHTML = ico(st.visible ? "eye-off" : "eye", "i");
    v.disabled = !st.windows;
    v.title = !st.windows
      ? "这个包现在没有开着的窗口（先「运行」或「打开界面」）"
      : (st.visible ? "隐藏它的窗口（不关掉，随时能再显示出来）"
                    : "把它的窗口显示出来并叫到前面");
  }
}

async function clickRun(p){
  const mine = !!(RUN && RUN.id === p.id);
  const st = PST[p.id] || {};
  if (mine){ await stopRun(); return; }
  if (st.running){                       // 别处启动的：直接停掉它的进程
    const r = await pywebview.api.pkg_stop(p.id);
    toast(r.msg, !r.ok);
    setTimeout(() => refreshPkgState(p), 500);
    return;
  }
  startRun(p, $("#args").value);
}

async function startRun(p, args){
  if (RUN){
    if (RUN.id !== p.id){ toast("先停掉正在跑的 :" + RUN.id, true); return; }
    return;
  }
  const cmd = "moss :" + p.id + ((args || "").trim() ? " " + args.trim() : "");
  lastRun = {id: p.id, args: args, label: cmd};
  setTab("console"); setCmd(cmd);
  setState(p.id, "running");
  out("$ " + cmd);
  const r = await pywebview.api.run_start(p.id, args || "");
  if (!r.ok){ toast("✗ " + (r.msg || "启动失败"), true); setState(p.id, "fail", {code: -1}); return; }
  RUN = {id: p.id, rid: r.run_id, cmd: cmd, timer: null};
  refreshPkgState(p);                    // 让按钮立刻变成「停止」
  pollRun();
}

function pollRun(){
  if (!RUN) return;
  RUN.timer = setTimeout(async () => {
    if (!RUN) return;
    const r = await pywebview.api.run_poll(RUN.rid);
    if (!r.ok){ finishRun(-1, ""); return; }
    out("$ " + RUN.cmd + "\n\n" + (r.out || "（还没有输出）"));
    if (r.running) pollRun();
    else finishRun(r.code, r.out);
  }, 200);
}

function finishRun(code, text){
  if (!RUN) return;
  const id = RUN.id, cmd = RUN.cmd, p = cur;
  clearTimeout(RUN.timer);
  RUN = null;
  out("$ " + cmd + "\n\n" + (text || "(这个包没有输出)") + "\n[退出码] " + code);
  setState(id, code === 0 ? "ok" : "fail", {code: code});
  renderDetail();
  // ★ 退出码回来了不等于"它没在跑" —— 有的包 fork 出界面自己就退了。
  //   所以状态以宿主那份为准（800ms 后再问一次）。
  if (p && p.id === id) setTimeout(() => refreshPkgState(p), 800);
}

async function stopRun(){
  if (!RUN) return;
  const r = await pywebview.api.run_stop(RUN.rid);
  toast(r.msg, !r.ok);
}

/* ---------------------------------------------------------------- 显示 / 隐藏
   管的是**这个包自己的界面窗口**（GUI 包跑起来那扇窗）：藏起来 ≠ 关掉，
   还能再叫出来。窗口归属由宿主认（进程树 ∪ 进程环境里的 MOSS_PKG_ID），
   所以从终端开的也认得出来。 */
async function toggleVis(p){
  const st = PST[p.id] || {windows: 0, visible: false};
  const r = st.visible ? await pywebview.api.pkg_hide(p.id)
                       : await pywebview.api.pkg_show(p.id);
  toast(r.msg, !r.ok);
  setTimeout(() => refreshPkgState(p), 400);
}

/* 详情页开着的时候，每 2.5 秒对一次状态（包可能是从别处启动/关掉的） */
function pkgPollStart(){
  if (pstTimer) return;
  pstTimer = setInterval(() => { if (tab === "detail" && cur) refreshPkgState(cur); }, 2500);
}

/* ---------------------------------------------------------------- 包列表 */

function safeSvg(text){
  try{
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    if (doc.querySelector("parsererror")) return "";
    doc.querySelectorAll("script,foreignObject,iframe").forEach(n => n.remove());
    doc.querySelectorAll("*").forEach(n => {
      [...n.attributes].forEach(a => {
        if (/^on/i.test(a.name) || /^(href|xlink:href)$/i.test(a.name)) n.removeAttribute(a.name);
      });
    });
    const svg = doc.documentElement;
    svg.removeAttribute("width"); svg.removeAttribute("height");
    return svg.outerHTML;
  }catch(e){ return ""; }
}
function iconHTML(p, cls){
  if (p.icon_svg){ const s = safeSvg(p.icon_svg); if (s) return '<span class="' + cls + '">' + s + '</span>'; }
  if (p.icon) return '<span class="' + cls + '"><img src="' + p.icon + '" alt=""></span>';
  return '<span class="' + cls + '"></span>';
}
function pkgRel(p){
  const norm = s => String(s || "").replace(/\\/g, "/").replace(/\/+$/, "");
  const d = norm(p.dir), userd = norm(DATA.user_data), sysroot = norm(DATA.home) + "/system";
  if (d === userd || d.startsWith(userd + "/")) return "user" + d.slice(userd.length);
  if (d === sysroot || d.startsWith(sysroot + "/")) return "system" + d.slice(sysroot.length);
  return null;
}
function select(id){
  cur = DATA.packages.find(p => p.id === id) || null;
  renderList(); renderDetail(); setTab("detail");
  // 换了包 → 文件管理跟着换到"这个包的那一套"（每个包一份上下文，互不干扰）
  if (cur) fmSelect(cur.id, /*keepTab*/ true);
}
function renderDetail(){

  if (params.length){

        esc(pa.desc || "") + (pa.placeholder ? '<div class="sub">例：' + esc(pa.placeholder) + '</div>' : "") +
        '</td></tr>').join("") + '</table></div>';

  //   还留在下面，正好把这一行覆盖掉 —— 表现就是"停止按钮是灰的、点了没反应"。
  paintActions(p);

  $("#btn-vis").onclick = () => toggleVis(p);
  refreshPkgState(p);
  $("#btn-openui").onclick = async () => {
    const r = await pywebview.api.open_ui(p.id, $("#args").value);

    out(r.msg || "");
    // 界面窗口要几秒才出来，等一会儿再问"它有没有窗口 / 在不在跑"
    setTimeout(() => refreshPkgState(p), 1500);
    setTimeout(() => refreshPkgState(p), 3500);
  };
}

/* ================================================================ 文件管理
   上下文按"包 id"分（外加一个 `__all__` 给"没有选包时"用）：
   每个上下文记自己的当前目录、历史、选中、剪贴板、排序，以及**打开的文件子选项卡**。
   切到别的包 = 换一套上下文，互不干扰；切回来还在原处。 */
const FM = { ctx: null, st: {} };

function fmState(key){
  if (!key) key = "__all__";
  if (!FM.st[key]){
    FM.st[key] = {rel:null, hist:[], hpos:-1, entries:[], sel:new Set(), clip:null,
                  sort:{key:"name", dir:1}, tabs:[], active:"__browse__",
                  pkgId: key === "__all__" ? null : key,
                  layers: {user:false, system:false}};
  }
  return FM.st[key];
}
/* 这个包在两层里的候选目录（`system/pkgs/<id>` / `user/pkgs/<id>`）。
   ★ 切换按钮要跳的是**同一个包在另一层的目录**，不是总目录 ——
     哪一层没有这个目录，那个按钮就不显示（你要求的）。 */
function fmLayerRels(key){
  return {user: "user/pkgs/" + key, system: "system/pkgs/" + key};
}
async function fmProbeLayers(key){
  if (!key || key === "__all__") return {user:true, system:true};
  const cand = fmLayerRels(key);
  const r = await pywebview.api.fs_exists([cand.user, cand.system]);
  const has = (r && r.has) || {};
  return {user: !!has[cand.user], system: !!has[cand.system]};
}
function fmDefaultRel(key){
  if (key === "__all__") return "user";
  const p = DATA.packages.find(x => x.id === key);
  return (p && pkgRel(p)) || "user";
}
function fmLabel(key){
  if (key === "__all__") return "全部文件";
  const p = DATA.packages.find(x => x.id === key);
  return p ? (p.name + "（:" + p.id + "）") : key;
}
function isDirty(t){ return t && !t.binary && t.text !== t.original; }
function fmActiveTab(){
  const s = fmState(FM.ctx);
  return s.tabs.find(t => t.rel === s.active) || null;
}

async function fmSelect(key, keepTab){
  FM.ctx = key;
  const s = fmState(key);
  s.layers = await fmProbeLayers(key);          // 哪一层有"这个包的目录"
  if (!s.rel) await fmGoto(fmDefaultRel(key), true, true);   // quiet: 不切顶层选项卡
  else fmRender();
  if (!keepTab) setTab("file");
}
async function fmGoto(rel, push, quiet){
  const s = fmState(FM.ctx);
  const r = await pywebview.api.fs_list(rel);
  if (!r.ok){ toast("✗ " + r.msg, true); return; }
  s.rel = r.rel || rel;
  s.entries = r.entries || [];
  s.sel.clear();
  if (push !== false){
    s.hist = s.hist.slice(0, s.hpos + 1);
    s.hist.push(s.rel);
    s.hpos = s.hist.length - 1;
  }
  s.active = "__browse__";
  if (!quiet) setTab("file");
  fmRender();
}
function fmHome(){ fmGoto(fmDefaultRel(FM.ctx)); }        // ★ 一键回到默认
function fmRefresh(){
  const s = fmState(FM.ctx);
  if (!s.rel) return;
  // 手动刷新时顺便重问一遍"另一层有没有这个包的目录"（比如刚复制过去）
  fmProbeLayers(FM.ctx).then(layers => { s.layers = layers; });
  fmGoto(s.rel, false);
}
function fmUp(){
  const parts = (fmState(FM.ctx).rel || "").split("/");
  if (parts.length > 1) fmGoto(parts.slice(0, -1).join("/"));
}
function fmBack(){ const s = fmState(FM.ctx); if (s.hpos > 0){ s.hpos--; fmGoto(s.hist[s.hpos], false); } }
function fmFwd(){ const s = fmState(FM.ctx); if (s.hpos < s.hist.length - 1){ s.hpos++; fmGoto(s.hist[s.hpos], false); } }

/* ---- 打开 / 关闭文件子选项卡 ---- */
async function fmOpenPage(rel){
  const s = fmState(FM.ctx);
  let t = s.tabs.find(x => x.rel === rel);
  if (!t){
    const r = await pywebview.api.fs_read(rel);
    if (!r.ok){ toast("✗ " + r.msg, true); return; }
    const name = rel.split("/").pop();
    const meta = extOf({name: name, ext: (name.split(".").pop() || "").toLowerCase()});
    t = {rel: rel, name: name, lang: meta.l || "plaintext",
         text: r.text || "", original: r.text || "",
         binary: !!(r.binary || r.too_big),
         note: r.binary ? "binary" : (r.too_big ? r.msg : ""),
         factory: rel.split("/")[0] === "system"};
    s.tabs.push(t);
  }
  s.active = rel;
  setTab("file");
  fmRender();
  const page = pageOf(rel);
  const ta = page && page.querySelector("textarea");
  if (ta && !t.binary) ta.focus();          // 打开就把光标放进编辑器，直接能打字
}
function fmClosePage(rel){
  const s = fmState(FM.ctx);
  const t = s.tabs.find(x => x.rel === rel);
  if (!t) return;
  const doClose = () => {
    s.tabs = s.tabs.filter(x => x.rel !== rel);
    if (s.active === rel) s.active = s.tabs.length ? s.tabs[s.tabs.length - 1].rel : "__browse__";
    fmRender();
  };
  if (isDirty(t)) askConfirm("有未保存的改动", "“" + t.name + "” 改过但没保存，关掉就丢了。确定关吗？", doClose);
  else doClose();
}
function fmSave(t){
  if (!t || t.binary) return;
  pywebview.api.fs_write(t.rel, t.text).then(r => {
    toast(r.ok ? ("已保存 " + t.rel + (r.factory ? "（出厂件）" : "")) : ("✗ " + r.msg), !r.ok);
    if (r.ok){ t.original = t.text; fmPaintBar(); fmPaintDirty(t); }
  });
}

/* ---- 渲染：子选项卡条 + 各页 ---- */
function fmRender(){
  const s = fmState(FM.ctx);
  const bar = $("#fm-bar");
  bar.innerHTML =
    '<button class="fmtab' + (s.active === "__browse__" ? " on" : "") + '" data-fm="__browse__" ' +
      'title="目录浏览（这一页不能关）">' + ico("folder", "i") +
      '<span class="fname">' + esc(fmLabel(FM.ctx)) + '</span></button>' +
    s.tabs.map(t =>
      '<button class="fmtab' + (s.active === t.rel ? " on" : "") + '" data-fm="' + esc(t.rel) + '" ' +
        'title="' + esc(t.rel) + '">' + fileIconHTML({name:t.name, ext:(t.name.split(".").pop()||"").toLowerCase()}) +
        '<span class="fname">' + esc(t.name) + '</span>' +
        (isDirty(t) ? '<span class="fdot" title="有未保存的改动"></span>' : "") +
        '<span class="x" data-close="' + esc(t.rel) + '" title="关闭">×</span></button>').join("") +
    '<button class="iconbtn" id="fm-home" title="回到默认目录">' + ico("home", "i") + '</button>';

  bar.querySelectorAll(".fmtab").forEach(b => {
    b.onclick = (ev) => {
      if (ev.target.dataset.close !== undefined) return;
      s.active = b.dataset.fm;
      fmRender();
    };
  });
  bar.querySelectorAll(".x").forEach(x => {
    x.onclick = (ev) => { ev.stopPropagation(); fmClosePage(x.dataset.close); };
  });
  $("#fm-home").onclick = fmHome;

  const body = $("#fm-body");
  body.innerHTML = browsePageHTML(s) + s.tabs.map(filePageHTML).join("");
  body.querySelectorAll(".fmpage").forEach(p =>
    p.classList.toggle("on", p.dataset.page === s.active));
  bindBrowse(s);
  s.tabs.forEach(t => bindFilePage(t));
}

function browsePageHTML(s){
  const rows = fmSorted(s);
  const arrow = k => s.sort.key === k
    ? '<span class="arrow">' + (s.sort.dir === 1 ? "▲" : "▼") + '</span>' : '';
  let html = '<div class="fmpage" data-page="__browse__">' +
    '<div class="fbnav">' +
      '<button class="iconbtn b-back" title="后退"></button>' +
      '<button class="iconbtn b-fwd" title="前进"></button>' +
      '<button class="iconbtn b-up" title="向上一级（Backspace）"></button>' +
      '<button class="iconbtn b-reload" title="刷新（F5）"></button>' +
      '<div class="crumbs"></div>' +
      '<div class="layers"></div>' +
    '</div>' +
    '<div class="fbtools">' +
      '<button class="iconbtn b-newdir" title="新建文件夹"></button>' +
      '<button class="iconbtn b-newfile" title="新建文件"></button>' +
      '<button class="iconbtn b-rename" title="重命名（F2）"></button>' +
      '<button class="iconbtn warn b-del" title="删除（Delete）→ 挪进回收站"></button>' +
      '<span class="gap"></span>' +
      '<button class="iconbtn b-copy" title="复制（Ctrl+C）"></button>' +
      '<button class="iconbtn b-cut" title="剪切（Ctrl+X）"></button>' +
      '<button class="iconbtn b-paste" title="粘贴（Ctrl+V）"></button>' +
      '<span class="gap"></span>' +
      '<button class="iconbtn b-default" title="用默认程序打开选中的东西"></button>' +
      '<button class="iconbtn b-opendir" title="用 Windows 资源管理器打开这个文件夹"></button>' +
    '</div>' +
    '<div class="fbwrap"><table class="fb"><thead><tr>' +
      '<th data-sort="name">名称' + arrow("name") + '</th>' +
      '<th data-sort="mtime" style="width:150px">修改日期' + arrow("mtime") + '</th>' +
      '<th data-sort="type" style="width:110px">类型' + arrow("type") + '</th>' +
      '<th data-sort="size" style="width:100px">大小' + arrow("size") + '</th>' +
    '</tr></thead><tbody>';
  if (!rows.length){
    html += '<tr><td colspan="4" class="dim" style="padding:22px;text-align:center">' +
            '这个文件夹是空的</td></tr>';
  }
  for (const e of rows){
    html += '<tr class="row' + (s.sel.has(e.rel) ? " sel" : "") + '" data-rel="' + esc(e.rel) +
      '" data-dir="' + (e.dir ? 1 : 0) + '">' +
      '<td class="nmcell">' + fileIconHTML(e, false) + '<span>' + esc(e.name) + '</span></td>' +
      '<td class="dim">' + fmtTime(e.mtime) + '</td>' +
      '<td class="dim">' + typeLabel(e) + '</td>' +
      '<td class="num">' + (e.dir ? "" : humanSize(e.size)) + '</td></tr>';
  }
  html += '</tbody></table></div><div class="fbstatus"><span class="info">—</span>' +
          '<span class="clipinfo"></span></div></div>';
  return html;
}

function filePageHTML(t){
  const meta = extOf({name: t.name, ext: (t.name.split(".").pop() || "").toLowerCase()});
  let note = "";
  if (t.binary) note = ico("binary", "i") + " 二进制文件，编辑不了；要看就用「默认程序打开」";
  else if (t.note) note = ico("alert-triangle", "i") + " " + t.note;
  else if (t.factory) note = ico("alert-triangle", "i") +
      " 这是出厂件（system/）—— 能改，但将来升级时会被整体替换";
  return '<div class="fmpage" data-page="' + esc(t.rel) + '">' +
    '<div class="outbar">' +
      '<span style="color:' + meta.c + ';display:flex">' + ico(meta.i, "i") + '</span>' +
      '<span class="mono">' + esc(t.rel) + '</span>' +
      '<span class="dirtydot"' + (isDirty(t) ? "" : " hidden") + ' title="有未保存的改动"></span>' +
      '<span style="flex:1"></span>' +
      '<button class="iconbtn b-save" title="保存（Ctrl+S）"' + (isDirty(t) ? "" : " disabled") + '></button>' +
      '<button class="iconbtn b-revert" title="放弃改动，重新读一遍"></button>' +
      '<button class="iconbtn b-default" title="用系统默认程序打开"></button>' +
      '<button class="iconbtn b-reveal" title="在资源管理器里显示"></button>' +
      '<button class="iconbtn b-close" title="关闭这个选项卡"></button>' +
    '</div>' +
    (note ? '<div class="note">' + note + '</div>' : '') +
    '<div class="editor"><pre aria-hidden="true"><code class="hljs"></code></pre>' +
      '<textarea spellcheck="false" wrap="off"' + (t.binary ? " readonly" : "") + '></textarea></div>' +
  '</div>';
}

/* ---- 浏览页的事件 ---- */
function fmSorted(s){
  const {key, dir} = s.sort;
  return s.entries.slice().sort((a, b) => {
    if (a.dir !== b.dir) return a.dir ? -1 : 1;
    let x, y;
    if (key === "name"){ x = a.name.toLowerCase(); y = b.name.toLowerCase(); }
    else if (key === "mtime"){ x = a.mtime || 0; y = b.mtime || 0; }
    else if (key === "size"){ x = a.size || 0; y = b.size || 0; }
    else { x = typeLabel(a).toLowerCase(); y = typeLabel(b).toLowerCase(); }
    return x < y ? -1 * dir : (x > y ? 1 * dir : 0);
  });
}
function fmPaintInfo(s, page){
  const rows = fmSorted(s), n = s.sel.size;
  const bytes = rows.filter(e => s.sel.has(e.rel) && !e.dir).reduce((a, e) => a + (e.size || 0), 0);
  page.querySelector(".info").textContent = rows.length + " 项" +
    (n ? " · 选中 " + n + " 项" + (bytes ? "（" + humanSize(bytes) + "）" : "") : "") +
    " · " + s.rel;
  page.querySelector(".clipinfo").textContent = s.clip
    ? ("剪贴板：" + s.clip.rels.length + " 项" + (s.clip.cut ? "（剪切）" : "（复制）")) : "";
  const dis = (sel, need) => { const b = page.querySelector(sel); if (b) b.disabled = !need; };
  dis(".b-rename", n === 1); dis(".b-del", n > 0); dis(".b-copy", n > 0); dis(".b-cut", n > 0);
  dis(".b-default", n > 0); dis(".b-reveal", n > 0); dis(".b-paste", !!s.clip);
}

function bindBrowse(s){
  const page = $('#fm-body .fmpage[data-page="__browse__"]');
  if (!page) return;
  const rows = fmSorted(s);
  const setIcon = (sel, name) => { const b = page.querySelector(sel); if (b) b.innerHTML = ico(name, "i"); };
  setIcon(".b-back", "corner-up-left"); setIcon(".b-fwd", "corner-up-right");
  setIcon(".b-up", "arrow-up"); setIcon(".b-reload", "refresh-cw");
  setIcon(".b-newdir", "folder-plus"); setIcon(".b-newfile", "file-plus");
  setIcon(".b-rename", "pencil"); setIcon(".b-del", "trash-2");
  setIcon(".b-copy", "copy"); setIcon(".b-cut", "scissors"); setIcon(".b-paste", "clipboard-paste");
  setIcon(".b-default", "external-link"); setIcon(".b-opendir", "folder-open");

  // 面包屑
  const segs = (s.rel || "").split("/");
  let acc = "", crumb = "";
  segs.forEach((seg, i) => {
    acc = i === 0 ? seg : acc + "/" + seg;
    const label = i === 0 ? (seg === "user" ? "user_data" : "system") : seg;
    if (i) crumb += '<span class="sep">›</span>';
    crumb += (i === segs.length - 1)
      ? '<span class="here">' + esc(label) + '</span>'
      : '<span class="seg" data-rel="' + esc(acc) + '">' + esc(label) + '</span>';
  });
  page.querySelector(".crumbs").innerHTML = crumb;
  page.querySelectorAll(".crumbs .seg").forEach(el => { el.onclick = () => fmGoto(el.dataset.rel); });

  page.querySelector(".b-back").onclick = fmBack;
  page.querySelector(".b-fwd").onclick = fmFwd;
  page.querySelector(".b-up").onclick = fmUp;
  page.querySelector(".b-reload").onclick = fmRefresh;

  /* 切换按钮：**跳到同一个包在另一层的目录**；那一层没有这个目录就不显示。
     （`__all__` 上下文没有"这个包"，那时才是切到两个总根。） */
  const layersBox = page.querySelector(".layers");
  const hereLayer = (s.rel || "").split("/")[0];
  let lhtml = "";
  if (!s.pkgId){
    lhtml = '<button class="iconbtn' + (hereLayer === "user" ? " on" : "") +
              '" data-go="user" title="user_data 根目录">user_data</button>' +
            '<button class="iconbtn' + (hereLayer === "system" ? " on" : "") +
              '" data-go="system" title="system 根目录">system</button>';
  } else {
    const cand = fmLayerRels(s.pkgId);
    if (s.layers.user)
      lhtml += '<button class="iconbtn' + (hereLayer === "user" ? " on" : "") +
        '" data-go="' + esc(cand.user) + '" title="user_data 里这个包的目录（' +
        esc(cand.user) + '）">user_data</button>';
    if (s.layers.system)
      lhtml += '<button class="iconbtn' + (hereLayer === "system" ? " on" : "") +
        '" data-go="' + esc(cand.system) + '" title="system 里这个包的目录（' +
        esc(cand.system) + '）">system</button>';
    if (!s.layers.user && !s.layers.system)
      lhtml += '<span class="sub" style="align-self:center">这个包只在当前目录里</span>';
  }
  layersBox.innerHTML = lhtml;
  layersBox.querySelectorAll("button").forEach(b => {
    b.onclick = () => fmGoto(b.dataset.go);
  });
  page.querySelector(".b-newdir").onclick = () => fmCmd("newdir");
  page.querySelector(".b-newfile").onclick = () => fmCmd("newfile");
  page.querySelector(".b-rename").onclick = () => fmCmd("rename");
  page.querySelector(".b-del").onclick = () => fmCmd("del");
  page.querySelector(".b-copy").onclick = () => fmCmd("copy");
  page.querySelector(".b-cut").onclick = () => fmCmd("cut");
  page.querySelector(".b-paste").onclick = () => fmCmd("paste");
  page.querySelector(".b-default").onclick = () => fmCmd("default");
  page.querySelector(".b-opendir").onclick = () => fmCmd("opendir");

  page.querySelectorAll("th[data-sort]").forEach(th => {
    th.onclick = () => {
      const k = th.dataset.sort;
      s.sort = {key: k, dir: (s.sort.key === k ? -s.sort.dir : 1)};
      fmRender();
    };
  });
  page.querySelectorAll("tr.row").forEach((tr, idx) => {
    const rel = tr.dataset.rel;
    tr.onclick = (ev) => {
      if (ev.ctrlKey || ev.metaKey){
        s.sel.has(rel) ? s.sel.delete(rel) : s.sel.add(rel);
        s.lastIdx = idx;
      } else if (ev.shiftKey && s.lastIdx >= 0){
        const a = Math.min(s.lastIdx, idx), b = Math.max(s.lastIdx, idx);
        s.sel.clear();
        for (let i = a; i <= b; i++) s.sel.add(rows[i].rel);
      } else {
        s.sel.clear(); s.sel.add(rel); s.lastIdx = idx;
      }
      page.querySelectorAll("tr.row").forEach(r2 =>
        r2.classList.toggle("sel", s.sel.has(r2.dataset.rel)));
      fmPaintInfo(s, page);
    };
    tr.ondblclick = () => (tr.dataset.dir === "1" ? fmGoto(rel) : fmOpenPage(rel));
    tr.oncontextmenu = (ev) => {
      ev.preventDefault();
      if (!s.sel.has(rel)){
        s.sel.clear(); s.sel.add(rel); s.lastIdx = idx;
        page.querySelectorAll("tr.row").forEach(r2 =>
          r2.classList.toggle("sel", s.sel.has(r2.dataset.rel)));
        fmPaintInfo(s, page);
      }
      showCtx(ev.clientX, ev.clientY, rel);
    };
  });
  page.querySelector(".fbwrap").oncontextmenu = (ev) => {
    if (ev.target.closest("tr.row")) return;
    ev.preventDefault();
    s.sel.clear();
    page.querySelectorAll("tr.row").forEach(r2 => r2.classList.remove("sel"));
    fmPaintInfo(s, page);
    showCtx(ev.clientX, ev.clientY, null);
  };
  page.querySelector(".b-back").disabled = s.hpos <= 0;
  page.querySelector(".b-fwd").disabled = s.hpos >= s.hist.length - 1;
  page.querySelector(".b-up").disabled = segs.length <= 1;
  fmPaintInfo(s, page);
}

/* ---- 文件页（子选项卡）的事件 ---- */
function hlInto(t, code){
  const text = t.text || "";
  if (text.length > 300000){ code.textContent = text + "\n"; return; }
  if (window.hljs && t.lang && hljs.getLanguage(t.lang)){
    try{
      code.innerHTML = hljs.highlight(text, {language: t.lang, ignoreIllegals: true}).value + "\n";
      return;
    }catch(e){}
  }
  code.textContent = text + "\n";
}
function pageOf(rel){
  // ★ 不用 `[data-page="…"]` 选择器去找：文件名里可能有引号/反斜杠，
  //   拼进选择器会炸（也不安全）。直接遍历比对 dataset。
  const pages = document.querySelectorAll("#fm-body .fmpage");
  for (const p of pages) if (p.dataset.page === rel) return p;
  return null;
}
function fmPaintDirty(t){
  const page = pageOf(t.rel);
  if (page){
    const dot = page.querySelector(".dirtydot");
    if (dot) dot.hidden = !isDirty(t);
    const save = page.querySelector(".b-save");
    if (save) save.disabled = !isDirty(t);
  }
  fmPaintBar();
}
function fmPaintBar(){
  const s = fmState(FM.ctx);
  const bar = $("#fm-bar");
  bar.querySelectorAll(".fmtab").forEach(b => {
    const rel = b.dataset.fm;
    if (rel === "__browse__") return;
    const t = s.tabs.find(x => x.rel === rel);
    const has = b.querySelector(".fdot");
    if (t && isDirty(t) && !has){
      const sp = document.createElement("span");
      sp.className = "fdot"; sp.title = "有未保存的改动";
      b.insertBefore(sp, b.querySelector(".x"));
    } else if ((!t || !isDirty(t)) && has){
      has.remove();
    }
  });
}
function bindFilePage(t){
  const page = pageOf(t.rel);
  if (!page) return;
  const ta = page.querySelector("textarea"), code = page.querySelector("code");
  ta.value = t.text || "";
  hlInto(t, code);
  const setIcon = (sel, name) => { const b = page.querySelector(sel); if (b) b.innerHTML = ico(name, "i"); };
  setIcon(".b-save", "save"); setIcon(".b-revert", "undo-2");
  setIcon(".b-default", "external-link"); setIcon(".b-reveal", "folder-open");
  setIcon(".b-close", "x");

  let timer = null;
  ta.addEventListener("input", () => {
    t.text = ta.value;
    clearTimeout(timer);
    timer = setTimeout(() => hlInto(t, code), 120);
    fmPaintDirty(t);
  });
  ta.addEventListener("scroll", () => {
    const pre = code.parentElement;
    pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
  });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Tab"){
      e.preventDefault();
      const p = ta.selectionStart;
      ta.value = ta.value.slice(0, p) + "    " + ta.value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = p + 4;
      t.text = ta.value; hlInto(t, code); fmPaintDirty(t);
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); fmSave(t); }
  });
  page.querySelector(".b-save").onclick = () => fmSave(t);
  page.querySelector(".b-revert").onclick = () => {
    askConfirm("放弃改动", "“" + t.name + "” 重新从磁盘读一遍，没保存的改动会丢。确定吗？", async () => {
      const r = await pywebview.api.fs_read(t.rel);
      if (!r.ok){ toast("✗ " + r.msg, true); return; }
      t.text = r.text || ""; t.original = r.text || "";
      ta.value = t.text; hlInto(t, code); fmPaintDirty(t);
    });
  };
  page.querySelector(".b-default").onclick = async () => {
    const r = await pywebview.api.fs_open_default(t.rel); toast(r.msg, !r.ok);
  };
  page.querySelector(".b-reveal").onclick = async () => {
    const r = await pywebview.api.fs_reveal(t.rel); toast(r.msg, !r.ok);
  };
  page.querySelector(".b-close").onclick = () => fmClosePage(t.rel);
}

/* ---- 文件操作（浏览页的按钮 / 右键菜单 / 键盘）---- */
function showCtx(x, y, rel){
  const s = fmState(FM.ctx);
  const has = !!rel, one = s.sel.size === 1;
  const items = has
    ? [["folder-open", "打开", "open"],
       ["external-link", "用默认程序打开", "default"],
       ["app-window", "在资源管理器里显示", "reveal"],
       ["sep"],
       ["copy", "复制", "copy"], ["scissors", "剪切", "cut"],
       ["sep"],
       ["pencil", "重命名", "rename", one],
       ["trash-2", "删除（进回收站）", "del"]]
    : [["file-plus", "新建文件", "newfile"], ["folder-plus", "新建文件夹", "newdir"],
       ["sep"], ["clipboard-paste", "粘贴", "paste", !!s.clip],
       ["refresh-cw", "刷新", "reload"]];
  const menu = $("#ctxmenu");
  menu.innerHTML = items.map(it => {
    if (it[0] === "sep") return '<div class="sep"></div>';
    const dis = it[3] === false;
    return '<div class="mi' + (dis ? " dis" : "") + '" data-act="' + it[2] + '">' +
      ico(it[0], "i") + '<span>' + esc(it[1]) + '</span></div>';
  }).join("");
  menu.hidden = false;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  menu.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
  menu.querySelectorAll(".mi").forEach(mi => {
    if (mi.classList.contains("dis")) return;
    mi.onclick = () => { hideCtx(); fmCmd(mi.dataset.act); };
  });
}
function hideCtx(){ $("#ctxmenu").hidden = true; }

function fmTargetDir(){
  const s = fmState(FM.ctx);
  const selArr = [...s.sel];
  if (selArr.length === 1){
    const e = s.entries.find(x => x.rel === selArr[0]);
    if (e && e.dir) return e.rel;
  }
  return s.rel;
}
async function fmCmd(act){
  const s = fmState(FM.ctx);
  const selArr = [...s.sel];
  if (act === "open"){
    if (selArr.length === 1){
      const e = s.entries.find(x => x.rel === selArr[0]);
      if (e && e.dir) fmGoto(e.rel); else if (e) fmOpenPage(e.rel);
    }
    return;
  }
  if (act === "default" || act === "reveal"){
    if (!selArr.length) return;
    const r = act === "default" ? await pywebview.api.fs_open_default(selArr[0])
                                : await pywebview.api.fs_reveal(selArr[0]);
    toast(r.msg, !r.ok);
    return;
  }
  if (act === "opendir"){
    // 对目录调 startfile 就是"用 Windows 资源管理器打开它"
    const r = await pywebview.api.fs_open_default(s.rel);
    toast(r.msg, !r.ok);
    return;
  }
  if (act === "copy" || act === "cut"){
    if (!selArr.length) return;
    s.clip = {rels: selArr, cut: act === "cut"};
    fmRender();
    toast((act === "cut" ? "已剪切 " : "已复制 ") + selArr.length + " 项");
    return;
  }
  if (act === "paste"){
    if (!s.clip) return;
    const r = await pywebview.api.fs_copy(s.clip.rels, s.rel, s.clip.cut);
    toast(r.msg, !r.ok);
    if (r.ok && s.clip.cut) s.clip = null;
    fmRefresh();
    return;
  }
  if (act === "newfile" || act === "newdir"){
    const dir = fmTargetDir(), isDir = act === "newdir";
    askText(isDir ? "新建文件夹" : "新建文件", isDir ? "新建文件夹" : "untitled.py", async (name) => {
      const r = isDir ? await pywebview.api.fs_mkdir(dir, name)
                      : await pywebview.api.fs_touch(dir, name);
      toast(r.msg, !r.ok);
      if (r.ok){
        if (dir !== s.rel) await fmGoto(dir, true); else await fmRefresh();
        const s2 = fmState(FM.ctx);
        s2.sel.clear(); s2.sel.add(r.rel);
        if (!isDir) fmOpenPage(r.rel); else fmRender();
      }
    });
    return;
  }
  if (act === "rename"){
    if (selArr.length !== 1){ toast("重命名一次只能一个", true); return; }
    const e = s.entries.find(x => x.rel === selArr[0]);
    askText("重命名", e ? e.name : "", async (name) => {
      const r = await pywebview.api.fs_rename(selArr[0], name);
      toast(r.msg, !r.ok);
      if (r.ok){
        const s2 = fmState(FM.ctx);
        const t = s2.tabs.find(x => x.rel === r.old);
        if (t){ t.rel = r.rel; t.name = r.rel.split("/").pop(); }
        s2.sel.clear(); s2.sel.add(r.rel);
        fmRefresh();
      }
    });
    return;
  }
  if (act === "del"){
    if (!selArr.length) return;
    const names = s.entries.filter(e => s.sel.has(e.rel)).map(e => e.name);
    askConfirm("删除", "把 " + (names.length === 1 ? "“" + names[0] + "”" : names.length + " 项") +
      " 挪进 user_data/trash/（**不是真删**，能拿回来）。确定吗？", async () => {
        const r = await pywebview.api.fs_delete(selArr);
        toast(r.msg, !r.ok);
        if (r.ok){
          const s2 = fmState(FM.ctx);
          s2.tabs = s2.tabs.filter(t => !selArr.some(x => t.rel === x || t.rel.startsWith(x + "/")));
          if (!s2.tabs.some(t => t.rel === s2.active)) s2.active = "__browse__";
          s2.sel.clear();
          fmRefresh();
        }
      });
    return;
  }
  if (act === "reload") fmRefresh();
}

/* ---- 键盘 ---- */
document.addEventListener("keydown", (e) => {
  if ($("#modal").classList.contains("on")) return;
  const typing = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || "").toUpperCase());
  if (tab === "file" && !typing){
    const s = fmState(FM.ctx), k = e.key;
    if (k === "Enter"){ e.preventDefault(); fmCmd("open"); return; }
    if (k === "F2"){ e.preventDefault(); fmCmd("rename"); return; }
    if (k === "Delete"){ e.preventDefault(); fmCmd("del"); return; }
    if (k === "Backspace"){ e.preventDefault(); fmUp(); return; }
    if (k === "F5"){ e.preventDefault(); fmRefresh(); return; }
    if (k === "Escape"){ hideCtx(); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "c"){ e.preventDefault(); fmCmd("copy"); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "x"){ e.preventDefault(); fmCmd("cut"); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "v"){ e.preventDefault(); fmCmd("paste"); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "w"){
      e.preventDefault();
      if (s.active !== "__browse__") fmClosePage(s.active);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "a"){
      e.preventDefault();
      s.entries.forEach(x => s.sel.add(x.rel));
      fmRender();
      return;
    }
  }
  if (e.key === "Escape" && $("#modal").classList.contains("on")) closeModal();
});
document.addEventListener("click", (e) => { if (!e.target.closest("#ctxmenu")) hideCtx(); });
window.addEventListener("blur", hideCtx);

/* ---------------------------------------------------------------- 模态 / 提示 */
let modalCb = null;
function askText(title, value, cb){
  $("#m-title").textContent = title;
  $("#m-text").textContent = "";
  const inp = $("#m-input");
  inp.hidden = false; inp.value = value || "";
  $("#m-ok").className = "primary";
  $("#modal").classList.add("on");
  setTimeout(() => { inp.focus(); inp.select(); }, 30);
  modalCb = () => cb(inp.value.trim());
}
function askConfirm(title, text, cb){
  $("#m-title").textContent = title;
  $("#m-text").textContent = text.replace(/\*\*/g, "");
  $("#m-input").hidden = true;
  $("#m-ok").className = "danger";
  $("#modal").classList.add("on");
  setTimeout(() => $("#m-ok").focus(), 30);
  modalCb = () => cb();
}
function closeModal(){ $("#modal").classList.remove("on"); modalCb = null; }
function toast(text, bad){
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* ---------------------------------------------------------------- 启动 */
async function init(){
  DATA = await pywebview.api.state();
  $("#meta").textContent =
    DATA.packages.length + " 个包 · 启动方式：" + DATA.launch_kind + " · " + DATA.home;
  renderList(); paintStates();
  pkgPollStart();          // 详情页开着时每 2.5 秒对一次"在不在跑 / 有没有窗口"
  // 默认上下文：不选包时给一个"全部文件"（根 = user_data），能自己往上走到 system
  FM.ctx = "__all__";
  const s = fmState("__all__");
  const r = await pywebview.api.fs_list("user");
  if (r.ok){ s.rel = r.rel; s.entries = r.entries || []; s.hist = [s.rel]; s.hpos = 0; }
  fmRender();
}
function paintStaticIcons(){
  $("#btn-selfcheck").innerHTML = ico("activity", "i");
  $("#btn-refresh").innerHTML   = ico("refresh-cw", "i");
  $("#btn-quit").innerHTML      = ico("x", "i");
  $("#btn-copy").innerHTML      = ico("copy", "i");
  $("#btn-rerun").innerHTML     = ico("rotate-cw", "i");
  $("#btn-clear").innerHTML     = ico("eraser", "i");
}
$("#q").addEventListener("input", renderList);
$("#btn-refresh").onclick = init;
$("#btn-quit").onclick = () => pywebview.api.quit();
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  if (b.dataset.tab === "file") fmSelect(cur ? cur.id : "__all__");
  else setTab(b.dataset.tab);
});
$("#btn-copy").onclick = copyOut;
$("#btn-clear").onclick = () => { out(""); setCmd(""); clearConsoleState(); };
$("#m-cancel").onclick = closeModal;
$("#m-ok").onclick = () => { const cb = modalCb; closeModal(); if (cb) cb(); };
$("#m-input").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); $("#m-ok").click(); }
  if (e.key === "Escape") closeModal();
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("#btn-rerun").onclick = async () => {
  if (!lastRun || busy) return;
  busy = true;
  const btn = $("#btn-rerun"); btn.disabled = true;
  setCmd(lastRun.label); setState(lastRun.id, "running");
  out("$ " + lastRun.label);
  const t0 = performance.now();
  const r = await pywebview.api.run(lastRun.id, lastRun.args);
  out("$ " + lastRun.label + "\n\n" + (r.out || "(这个包没有输出)") + "\n[退出码] " + r.code);
  setState(lastRun.id, r.code === 0 ? "ok" : "fail",
           {code: r.code, ms: Math.round(performance.now() - t0)});
  btn.disabled = false; busy = false;
};
$("#btn-selfcheck").onclick = async () => {
  setTab("console"); setCmd("moss --selfcheck");
  setState("__host__", "running");
  out("$ moss --selfcheck");
  const t0 = performance.now();
  const r = await pywebview.api.run_host("--selfcheck");
  out("$ moss --selfcheck\n\n" + (r.out || "(没有输出)") + "\n[退出码] " + r.code);
  setState("__host__", r.code === 0 ? "ok" : "fail",
           {code: r.code, ms: Math.round(performance.now() - t0)});
};

paintStaticIcons();
window.addEventListener("pywebviewready", init);
</script>
