<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moss</title>
<style>
:root{
  --bg:#f5f5f7; --panel:#fff; --panel2:#fbfbfd; --line:#e2e2e8; --line2:#eeeef3;
  --fg:#1c1c1e; --dim:#6b6b73; --accent:#0a84ff; --accent-fg:#fff;
  --hover:#f0f0f4; --sel:#e8f1ff; --out-bg:#14161a; --out-fg:#d7dae0;
  --code-bg:#fbfbfd; --field-focus:rgba(10,132,255,.20);
  --mono: ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace;
  /* 语法配色照抄 exec（GitHub 那套浅/深色） */
  --syn-comment:#6e7781; --syn-keyword:#cf222e; --syn-string:#0a3069;
  --syn-number:#0550ae;  --syn-title:#8250df;   --syn-builtin:#953800;
  --syn-attr:#0550ae;    --syn-meta:#6e7781;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181d; --panel:#1d2026; --panel2:#22252c; --line:#2c3038; --line2:#262a31;
         --fg:#e8eaed; --dim:#9aa0aa; --hover:#262a31; --sel:#1f2c3d; --out-bg:#0f1114;
         --out-fg:#c9ced6; --code-bg:#1b1e24; --field-focus:rgba(10,132,255,.28);
         --syn-comment:#8b949e; --syn-keyword:#ff7b72; --syn-string:#a5d6ff;
         --syn-number:#79c0ff;  --syn-title:#d2a8ff;   --syn-builtin:#ffa657;
         --syn-attr:#79c0ff;    --syn-meta:#8b949e; }
}
*{box-sizing:border-box}
/* ★ 必须有这条兜底：`display:flex` 之类会压过浏览器默认的 `[hidden]{display:none}`，
   于是 `el.hidden = true` 看起来毫无反应（实测坑）。 */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--fg);background:var(--bg)}
svg.i{width:16px;height:16px;flex:none;display:block}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 8px;min-width:32px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer;font:inherit}
.iconbtn:hover{background:var(--hover)}
.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn.warn:hover{border-color:#d64545;color:#d64545}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
#q{width:230px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.meta{flex:1;color:var(--dim);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:right}
main{flex:1;display:flex;min-height:0}
aside{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#list{flex:1;overflow:auto;min-height:0}
#hist{flex:1;overflow:auto;min-height:0}
/* 左侧顶部那排：插件/历史 切换 + 新建 */
#sideswitch{display:flex;gap:4px;align-items:center;padding:7px 10px;flex:none;
  border-bottom:1px solid var(--line2)}
#sideswitch button{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:5px 10px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--dim);cursor:pointer;font:inherit;font-size:13px}
#sideswitch button:hover{background:var(--hover)}
#sideswitch button.on{background:var(--panel2);border-color:var(--line);color:var(--fg);font-weight:500}
#sideswitch #btn-newpkg{margin-left:auto;padding:4px 7px;min-width:28px;border-color:var(--line);
  background:var(--panel2)}
/* 历史行：**和包列表长得一样**（你要求的）—— 同一套内边距 / 图标尺寸 / hover / 选中态。
   只有第二行不同：包显示"说明"，历史显示"目录 · 时间"。 */
.hitem,.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);
  cursor:pointer;align-items:center}
.hitem:hover,.item:hover{background:var(--hover)}
.hitem.sel,.item.sel{background:var(--sel)}
.hitem .hico,.ico{width:24px;height:24px;flex:none;display:flex;align-items:center;
  justify-content:center;color:var(--dim)}
.hitem .hico svg,.hitem .hico img,.ico svg,.ico img{width:24px;height:24px}
.hitem .hico img,.ico img{object-fit:contain}
.hitem .hmain{min-width:0;flex:1}
.hitem .hname,.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* `.ds` = 列表第二行（普通字号、不是等宽）；`.sub` = 夹在句子里的等宽小字（`:md5` 这种）。
   ★ 原来 `.sub` 写了两遍（第二遍把 font-size 从 12 改成 11，还加了 mono）——
     同一层里重复声明等于自己压自己。合成一条。 */
.hitem .hsub,.ds{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.sub{color:var(--dim);font-family:var(--mono);font-size:11.5px}
/* ★ 给"整段的提示文字"用：**要能折行**。上面那个 `.sub` 带 nowrap + 省略号，
   拿来包一整句提示会把后半句悄悄吃掉（实测：命令行预览那句一窄就被截断）。 */
.hint{color:var(--dim);font-size:12px;line-height:1.6;margin-top:8px;word-break:break-all}
.hint .mono{font-size:11.5px}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:4px;align-items:center;padding:7px 12px;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel)}
.tab{padding:5px 13px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--dim);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--panel2);border-color:var(--line);color:var(--fg);font-weight:500}
#tabactions{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
#tabactions .iconbtn{padding:4px 10px}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
/* ★ 别写 `#pane-x{display:none}`：ID 选择器优先级高于 `.pane.on`，面板会永远 0×0 */
#pane-detail{overflow:auto;padding:18px 22px}
#pane-detail.on{display:block}
#pane-console.on{display:flex;flex-direction:column}
#pane-file.on{display:flex;flex-direction:column}
.outbar{display:flex;gap:6px;align-items:center;padding:6px 12px;flex:none;
  border-bottom:1px solid var(--line2);background:var(--panel);color:var(--dim);font-size:12px}
.outbar .iconbtn{padding:4px 6px;min-width:28px}
#out{flex:1;overflow:auto;margin:0;padding:12px 14px;background:var(--out-bg);
  color:var(--out-fg);font-family:var(--mono);font-size:13px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;user-select:text;cursor:text}
#out::selection{background:#3a5a8c;color:#fff}
/* 还没跑过时那块输出区是**一大片纯黑**，看着像个洞。给一句暗色提示。 */
#out:empty::before{content:"（还没有输出）在「详情」里点「运行」，输出会出现在这里。";
  color:#5d6773}
/* ---- 状态灯 ---- */
/* ---- 状态：**只有两种** —— 运行中（绿色停止图标）/ 没运行（灰色播放图标）----
   ★ 不再显示"故障红 / 警告黄"（2026-09-27 你定的：「要么就停止 要么就运行，
     请忽略那个错误啥的 —— 很多正确的退出、没有报错，也经常误报错误，看起来很碍眼」）。
     退出码本身还是照记（在「命令行」那行文字里），只是**不拿出来当状态报警**了。 */
.ic-run{color:#1f9d55}
/* 左侧列表行尾那颗"没在跑"的播放图标：平时很淡，鼠标移上去才亮 —— 不抢视线 */
.hstat .idle,.rowstat .idle{color:var(--dim);opacity:.45}
.hstat .idle:hover,.rowstat .idle:hover{opacity:1;color:var(--fg)}
/* 左侧列表行尾的状态图标。★ 历史行（`.hstat`）和包行（`.rowstat`）**共用同一套**：
   以前只写了 `.rowstat button`，历史那边就退化成浏览器默认按钮（灰框），
   看着跟包列表不是一家 —— 你指出的"历史这里运行的样式不对"就是这个。 */
.hstat,.rowstat{flex:none;display:flex;align-items:center;margin-left:6px}
.hstat button,.rowstat button{display:flex;align-items:center;justify-content:center;padding:3px;
  border:none;border-radius:6px;background:transparent;cursor:pointer}
.hstat button:hover,.rowstat button:hover{background:var(--hover)}
.item[data-state=running],.hitem[data-state=running]{box-shadow:inset 3px 0 0 #1f9d55}
/* ★ 这里原来挂着一句 `.status{…}` 后面跟着**两行没有选择器的裸声明**
   （`border:1.6px …` / `animation:spin …}`）—— 是删小圆点时没清干净的残留：
   裸声明在顶层是非法 CSS，整段被浏览器丢掉，`animation` 引用的 `@keyframes spin`
   也早就不存在了。删掉。 */
/* ★ 目标文件已经没了的历史条目：**整行灰掉**（你要求的）。
   为什么不干脆删掉：这条记录仍然有用（当初在哪个目录跑的、跑过什么），
   只是再也跑不了了 —— 所以是"灰"，而且行尾那颗播放图标也不给。
   不做删除线、不去色：它不是"已删除"，它是"失效"。 */
.hitem.dead{opacity:.45}
.hitem.dead .hname{color:var(--dim)}
/* 详情里"提醒一句"的横条（目标没了之类） */
.warnbox{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:8px 11px;
  border:1px solid #e0b34d;border-radius:9px;background:rgba(224,179,77,.12);
  color:var(--fg);font-size:12.5px;line-height:1.6}
.warnbox svg.i{color:#c8901a;margin-top:2px}
/* 文件页标题栏里那截"猜到的编码" */
.encnote{font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;flex:none}
.dim{color:var(--dim)}
/* ================= 文件管理：**属于某一个包**的一套界面 =================
   结构是"文件管理"这个大选项卡 -> 里面的子选项卡：
     ① 「文件」固定在最左、**不能关闭**（目录浏览，资源管理器那套操作）
     ② 每打开一个文件 = 新增一个子选项卡（可关闭、带未保存黄点）
   子选项卡是**文件管理内部的**，不和顶层的 详情/命令行/文件管理 平级。 */
#fm-bar{display:flex;gap:4px;align-items:flex-end;padding:6px 10px 0;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;overflow-y:hidden}
.fmtab{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px 8px 0 0;
  border:1px solid transparent;border-bottom:none;background:transparent;color:var(--dim);
  cursor:pointer;font-size:13px;white-space:nowrap;max-width:240px}
.fmtab:hover{background:var(--hover)}
.fmtab.on{background:var(--bg);border-color:var(--line);color:var(--fg);font-weight:500}
.fmtab .fname{overflow:hidden;text-overflow:ellipsis}
.fmtab .x{margin-left:2px;color:var(--dim);border-radius:4px;padding:0 3px;line-height:1}
.fmtab .x:hover{background:#d64545;color:#fff}
.fmtab .fdot{width:7px;height:7px;border-radius:50%;background:#dfa100;flex:none}
.fmwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.fmpage{flex:1;min-height:0;display:none;flex-direction:column}
.fmpage.on{display:flex}
.fbnav{display:flex;gap:4px;align-items:center;padding:6px 10px;flex:none;
  border-bottom:1px solid var(--line2);background:var(--panel)}
/* 「回到默认目录」和后面那组导航空开一点，免得看着像同一组的第一个 */
.fbnav .b-home{margin-right:6px}
/* 面包屑：`abs/` 那种长路径（此电脑 › D: › python › wwwroot › ZeEn）会超出一行 ——
   原来只写 overflow:hidden，等于把**最后的当前目录悄悄裁掉**。改成可横向滚，
   滚动条本身不用显示（能拖/能滚就行）。 */
.crumbs{flex:1;display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;
  overflow-y:hidden;scrollbar-width:none;
  padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  font-size:12.5px;white-space:nowrap}
.crumbs::-webkit-scrollbar{height:0}
.crumbs span.seg{padding:1px 5px;border-radius:5px;cursor:pointer}
.crumbs span.seg:hover{background:var(--hover)}
.crumbs span.sep{color:var(--dim)}
.crumbs span.here{color:var(--dim);cursor:default}
.fbtools{display:flex;gap:4px;align-items:center;padding:5px 10px;flex:none;flex-wrap:wrap;
  border-bottom:1px solid var(--line2);background:var(--panel)}
.fbtools .iconbtn{padding:4px 6px;min-width:28px}
.fbtools .gap{width:8px}
.layers{display:flex;gap:4px;align-items:center;flex:none}
.layers .iconbtn{padding:3px 9px;min-width:0;font-size:12px}
.layers .iconbtn.on{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.fbwrap{flex:1;overflow:auto;min-height:0}
table.fb{width:100%;border-collapse:collapse;font-size:13px;user-select:none}
table.fb th{position:sticky;top:0;z-index:1;text-align:left;font-weight:500;color:var(--dim);
  background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;cursor:pointer;
  white-space:nowrap}
table.fb th .arrow{color:var(--accent);margin-left:4px}
table.fb td{padding:4px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
table.fb td.nmcell{display:flex;align-items:center;gap:8px;max-width:420px}
table.fb tr.row:hover{background:var(--hover)}
table.fb tr.row.sel{background:var(--sel)}
table.fb td.num{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
table.fb td.dim{color:var(--dim)}
.fbstatus{padding:5px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--line2);
  background:var(--panel);flex:none;display:flex;gap:12px;align-items:center}
/* ---- 编辑器（子选项卡里的那页）---- */
.editor{position:relative;flex:1;min-height:0;margin:10px 12px 12px;overflow:hidden;
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.editor > pre,.editor > textarea{
  position:absolute;inset:0;margin:0;border:0;padding:10px 12px;
  font:13px/1.55 var(--mono);letter-spacing:0;tab-size:4;white-space:pre;
  overflow:auto;overflow-wrap:normal;word-break:normal}
.editor > pre{pointer-events:none;color:var(--fg);background:transparent}
.editor > textarea{background:transparent;color:transparent;caret-color:var(--fg);
  resize:none;outline:none;user-select:text}
.editor > textarea::selection{background:rgba(10,132,255,.30)}
.hljs-comment,.hljs-quote{color:var(--syn-comment);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,
.hljs-doctag,.hljs-type,.hljs-name,.hljs-tag{color:var(--syn-keyword)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,
.hljs-meta .hljs-string{color:var(--syn-string)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-variable,
.hljs-template-variable,.hljs-link,.hljs-selector-attr,
.hljs-selector-pseudo{color:var(--syn-number)}
.hljs-title,.hljs-title.class_,.hljs-title.function_{color:var(--syn-title)}
.hljs-built_in,.hljs-builtin-name{color:var(--syn-builtin)}
.hljs-attr,.hljs-property,.hljs-params,.hljs-selector-class,
.hljs-selector-id{color:var(--syn-attr)}
.hljs-meta,.hljs-deletion{color:var(--syn-meta)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:600}
.note{padding:6px 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line2);
  background:var(--panel2);display:flex;align-items:center;gap:7px}
.dirtydot{width:7px;height:7px;border-radius:50%;background:#dfa100;flex:none}
/* ---- 右键菜单 ---- */
#ctxmenu{position:fixed;z-index:70;min-width:200px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:5px;
  box-shadow:0 14px 40px rgba(0,0,0,.28)}
#ctxmenu .mi{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--fg)}
#ctxmenu .mi:hover{background:var(--hover)}
#ctxmenu .mi.dis{opacity:.4;cursor:default}
#ctxmenu .mi.dis:hover{background:transparent}
#ctxmenu .sep{height:1px;background:var(--line2);margin:4px 6px}
/* ---- 详情（包 / 历史共用一套骨架）----
   ★ 两条排版原则：**限宽** + **分块**。
     之前是"一大片文字从上铺到底、每块都拉满整行"：窗口一宽，参数表铺到 1000px、
     输入框 620px、"卸载"的说明和按钮之间空出一大片 —— 看着就是你说的「乱糟糟」。
     现在：内容最多 780px 宽；每个小节是一张**卡片**（底色 + 描边 + 圆角），
     小节标题缩成卡片里的小标签；表格去掉外圈、只留行分隔线。 */
#pane-detail{overflow:auto;padding:0}
/* ★ 限宽 + 居中：右侧面板通常比 820 宽得多，靠左贴边会让内容挤在左边、右边空一大片
   （那还是"乱"）。居中之后左右留白对称，看着是「有意排版」而不是「没排」。 */
.dwrap{max-width:820px;margin:0 auto;padding:18px 24px 40px}
h1{font-size:20px;margin:0 0 4px;line-height:1.3}
.hd{display:flex;gap:14px;align-items:flex-start;padding-bottom:14px;
  border-bottom:1px solid var(--line2)}
.bigico{width:42px;height:42px;flex:none;color:var(--dim)}
.bigico svg,.bigico img{width:42px;height:42px}
/* 标题底下那行小字（历史是完整路径；包是版本·类型·层）。**要能折行** ——
   别套列表那套 `nowrap` + 省略号，长路径会被悄悄截掉。 */
.lead{color:var(--dim);font-size:12.5px;line-height:1.6;word-break:break-all;margin-top:4px}
.hd p{margin:12px 0 0;line-height:1.6;word-break:break-word}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);font-size:12px;color:var(--dim);margin:0 6px 6px 0}
/* ★ chip 里放图标时**必须把它拉回行内**：全局那条 `svg.i{display:block}` 会让
   图标自己占一行，后面的文字掉到第二行 —— 历史详情里那个「📁 / 地址」就是这么断的
   （你看到的"图标和后面的地址有不正确的换行"）。 */
.chip svg.i{display:inline-block;vertical-align:-3px;margin-right:5px}
.chip.click{cursor:pointer;font-family:var(--mono)}
.chip.click:hover{border-color:var(--accent);color:var(--accent)}
/* 小节 = 一张卡片 */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-top:12px}
.sec > h2{font-size:12px;color:var(--dim);margin:0 0 9px;font-weight:600}
.sec.danger{border-color:#e6b8b8}
table.p{width:100%;border-collapse:collapse;font-size:13px}
table.p th,table.p td{text-align:left;padding:6px 8px;vertical-align:top}
table.p tbody tr + tr th,table.p tbody tr + tr td{border-top:1px solid var(--line2)}
table.p th{color:var(--dim);font-weight:500}
table.p thead th{border-bottom:1px solid var(--line2);font-size:12px}
/* 参数表：名称/类型/必填 三列定宽，剩下的都给「说明」—— 不定宽的话说明会被挤到
   最右边、中间空一大段（以前就是这个样子）。 */
table.p.ptab th:nth-child(1),table.p.ptab td:nth-child(1){width:150px}
table.p.ptab th:nth-child(2),table.p.ptab td:nth-child(2){width:70px}
table.p.ptab th:nth-child(3),table.p.ptab td:nth-child(3){width:54px}
code,.mono{font-family:var(--mono);font-size:12.5px}
/* 卡片里"左边说明、右边动作"那一行：按钮靠右，说明不再无限撑开 */
.row-split{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row-split .hint{margin-top:0;flex:1 1 auto;min-width:0}
.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ★ 两个详情各有一个参数框：包详情是 `#args`，历史详情是 `#hargs`。
   原来只写了 `#args` ⇒ 历史那边的输入框是**浏览器默认样式**（细边、字被挤），
   一眼就跟旁边不是一套东西 —— 你指出的「参数那里缺少样式」就是这个。 */
#args,#hargs{flex:1;min-width:180px;max-width:620px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:12.5px;
  outline:none;transition:border-color .12s,box-shadow .12s}
#args:focus,#hargs:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
#args::placeholder,#hargs::placeholder{color:var(--dim)}
.empty{color:var(--dim);text-align:center;margin-top:70px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
  align-items:center;justify-content:center;z-index:80}
#modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;min-width:340px;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.card h3{margin:0 0 10px;font-size:15px}
.card p{margin:0 0 12px;color:var(--dim);font-size:13px;line-height:1.6;word-break:break-all}
.card input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);outline:none}
.card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.card .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.card .btns button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer;font:inherit}
.card .btns button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card .btns button.danger{background:#d64545;border-color:#d64545;color:#fff}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;align-items:center;z-index:90;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.22);
  max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.bad{border-color:#d64545;color:#d64545}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>moss</div>
  <input id="q" placeholder="搜索包名 / 说明 / 标签…">
  <div class="meta" id="meta"></div>
  <button id="btn-selfcheck" class="iconbtn" title="自检（moss --selfcheck）"></button>
  <button id="btn-refresh" class="iconbtn" title="刷新包列表"></button>
</header>

<main>
  <aside>
    <!-- 左侧顶部：插件 / 历史 切换（你要求的），右边是"新建包" -->
    <div id="sideswitch">
      <button id="sw-pkg" class="on" title="已安装的包"></button>
      <button id="sw-hist" title="最近跑过的路径调用（点一下重跑）"></button>
      <button id="btn-newpkg" class="iconbtn" title="新建一个包（moss --new）"></button>
    </div>
    <div id="list"></div>
    <div id="hist" hidden></div>
  </aside>
  <div id="right">
    <div id="tabs">
      <button class="tab active" data-tab="detail">详情</button>
      <button class="tab" data-tab="console">命令行</button>
      <button class="tab" data-tab="file">文件管理</button>
      <!-- ★ 运行/停止 + 显示/隐藏，钉在选项卡这一行的最右边：不用先点开「详情」。
           状态**只有两种**：运行中 = 绿色停止图标，没在跑 = 普通播放图标（不再有红/黄）。 -->
      <div id="tabactions">
        <button class="iconbtn" id="btn-run" disabled></button>
        <button class="iconbtn" id="btn-vis" disabled></button>
      </div>
    </div>

    <section class="pane on" id="pane-detail"><div class="empty">左边选一个包</div></section>

    <section class="pane" id="pane-console">
      <div class="outbar">
        <span id="outinfo">还没跑过</span>
        <span style="flex:1"></span>
        <button id="btn-copy" class="iconbtn" title="复制全部输出"></button>
        <button id="btn-rerun" class="iconbtn" title="再跑一次刚才那条命令"></button>
        <button id="btn-clear" class="iconbtn" title="清空输出"></button>
      </div>
      <pre id="out">就绪。选一个包，填参数，点「运行」。</pre>
    </section>

    <section class="pane" id="pane-file">
      <div id="fm-bar"></div>
      <div class="fmwrap" id="fm-body"></div>
    </section>
  </div>
</main>

<div id="ctxmenu" hidden></div>
<div id="modal"><div class="card">
  <h3 id="m-title">标题</h3>
  <p id="m-text"></p>
  <input id="m-input" autocomplete="off" spellcheck="false">
  <div class="btns">
    <button id="m-cancel">取消</button>
    <button id="m-ok" class="primary">确定</button>
  </div>
</div></div>
<div id="toasts"></div>

<script src="vendor/highlight.min.js"></script>
<script src="vendor/powershell.min.js"></script>
<script src="vendor/dos.min.js"></script>
<script src="vendor/lucide.js"></script>
<script>
/* ============================================================================
   moss 界面：详情 / 命令行 / **文件管理**
   文件管理是**每个包自己的一套**（上下文按包 id 分），里面的子选项卡：
       「文件」固定不可关（目录浏览，资源管理器那套操作）
       + 每打开一个文件一个子选项卡（可关、带未保存黄点）
   高亮与编辑器结构照抄 exec；图标用 Lucide。
   ========================================================================== */

let DATA = null, cur = null, tab = "detail";
/* ★ 右边那三个选项卡的"当前对象"有两种：**包**（`cur`）和**一条历史**（`curH`）。
   两者互斥 —— 选了一个就把另一个清掉，左边的高亮跟着走。
   为什么不合成一个对象：包有一堆历史没有的字段（版本/层/参数表/AI 开关/卸载），
   历史有的是包没有的（目标绝对路径 / 当初的 cwd / 那次的结果）；
   合成一个就得到处判空，不如分成两份、用一个 `selObj()` 取"现在是谁"。 */
let curH = null;
function isHist(o){ return !!o && !o.id && !!o.target; }   // 包有 id，历史有 target
function selObj(){ return curH || cur; }
let lastRun = null;
const $ = s => document.querySelector(s);

/* ---------------------------------------------------------------- 后缀 → 图标/颜色/语言 */
const EXT = {
  py:{i:"file-code",c:"#3572A5",l:"python"}, pyw:{i:"file-code",c:"#3572A5",l:"python"},
  js:{i:"file-code",c:"#c9a227",l:"javascript"}, mjs:{i:"file-code",c:"#c9a227",l:"javascript"},
  ts:{i:"file-code",c:"#2b7489",l:"typescript"}, go:{i:"file-code",c:"#00ADD8",l:"go"},
  rs:{i:"file-code",c:"#dea584",l:"rust"}, c:{i:"file-code",c:"#7a7a7a",l:"c"},
  h:{i:"file-code",c:"#7a7a7a",l:"c"}, cpp:{i:"file-code",c:"#f34b7d",l:"cpp"},
  java:{i:"file-code",c:"#b07219",l:"java"}, cs:{i:"file-code",c:"#178600",l:"csharp"},
  php:{i:"file-code",c:"#7a86b8",l:"php"}, rb:{i:"file-code",c:"#cc342d",l:"ruby"},
  lua:{i:"file-code",c:"#000080",l:"lua"}, sql:{i:"database",c:"#e38c00",l:"sql"},
  html:{i:"globe",c:"#e34c26",l:"xml"}, htm:{i:"globe",c:"#e34c26",l:"xml"},
  xml:{i:"code",c:"#8a8a8a",l:"xml"}, svg:{i:"palette",c:"#ffb13b",l:"xml"},
  css:{i:"palette",c:"#563d7c",l:"css"}, scss:{i:"palette",c:"#c6538c",l:"scss"},
  less:{i:"palette",c:"#1d365d",l:"less"},
  json:{i:"braces",c:"#c9a227",l:"json"}, jsonc:{i:"braces",c:"#c9a227",l:"json"},
  md:{i:"book-open",c:"#6e7781",l:"markdown"}, markdown:{i:"book-open",c:"#6e7781",l:"markdown"},
  txt:{i:"file-text",c:"#6e7781",l:"plaintext"}, log:{i:"file-text",c:"#6e7781",l:"plaintext"},
  bat:{i:"terminal",c:"#8a8a8a",l:"dos"}, cmd:{i:"terminal",c:"#8a8a8a",l:"dos"},
  ps1:{i:"terminal",c:"#2f6fb5",l:"powershell"}, psm1:{i:"terminal",c:"#2f6fb5",l:"powershell"},
  sh:{i:"terminal",c:"#4f9d3a",l:"bash"}, bash:{i:"terminal",c:"#4f9d3a",l:"bash"},
  toml:{i:"settings",c:"#9c4221",l:"ini"}, ini:{i:"settings",c:"#9c4221",l:"ini"},
  cfg:{i:"settings",c:"#9c4221",l:"ini"}, conf:{i:"settings",c:"#9c4221",l:"ini"},
  yml:{i:"settings",c:"#cb171e",l:"yaml"}, yaml:{i:"settings",c:"#cb171e",l:"yaml"},
  png:{i:"file-image",c:"#a074c4"}, jpg:{i:"file-image",c:"#a074c4"},
  jpeg:{i:"file-image",c:"#a074c4"}, gif:{i:"file-image",c:"#a074c4"},
  webp:{i:"file-image",c:"#a074c4"}, bmp:{i:"file-image",c:"#a074c4"},
  ico:{i:"file-image",c:"#a074c4"},
  exe:{i:"binary",c:"#8a8a8a"}, dll:{i:"binary",c:"#8a8a8a"}, pyd:{i:"binary",c:"#8a8a8a"},
  zip:{i:"file-archive",c:"#e0a800"}, "7z":{i:"file-archive",c:"#e0a800"},
  rar:{i:"file-archive",c:"#e0a800"}, gz:{i:"file-archive",c:"#e0a800"},
  mp3:{i:"file-audio",c:"#1f9d55"}, wav:{i:"file-audio",c:"#1f9d55"},
  mp4:{i:"file-video",c:"#d64545"}, mkv:{i:"file-video",c:"#d64545"},
  csv:{i:"file-spreadsheet",c:"#1f9d55"}, xlsx:{i:"file-spreadsheet",c:"#1f9d55"},
  key:{i:"file-key",c:"#c9a227"}, pem:{i:"file-key",c:"#c9a227"},
  license:{i:"copyright",c:"#6e7781"},
};
const NO_EXT = {
  LICENSE:{i:"copyright",c:"#6e7781",l:"plaintext"},
  "pkg.json":{i:"braces",c:"#c9a227",l:"json"},
  ".gitignore":{i:"file-cog",c:"#8a8a8a",l:"plaintext"},
  ".gitattributes":{i:"file-cog",c:"#8a8a8a",l:"plaintext"},
};
function extOf(entry){
  const name = (entry.name || "").toLowerCase();
  if (NO_EXT[name]) return Object.assign({ext:""}, NO_EXT[name]);
  return Object.assign({ext: entry.ext || ""}, EXT[entry.ext] || {i:"file", c:"#8a8a8a"});
}
function fileIconHTML(entry, open){
  if (entry.dir) return '<span style="color:#e0a800;display:flex">' +
    ico(open ? "folder-open" : "folder", "i") + '</span>';
  const e = extOf(entry);
  return '<span style="color:' + e.c + ';display:flex">' + ico(e.i, "i") + '</span>';
}
function typeLabel(entry){
  if (entry.dir) return "文件夹";
  const e = entry.ext || "";
  return e ? (e.toUpperCase() + " 文件") : "文件";
}
function humanSize(n){
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function fmtTime(sec){
  if (!sec) return "";
  const d = new Date(sec * 1000), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes());
}
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
}
const esc = escapeHtml;

/* ---------------------------------------------------------------- 状态（只有两种）
   ★ 状态**只有"在跑 / 没在跑"两种**，而且唯一来源是**宿主**那份 (`PST`)：
     它会答"这个包有没有活着的进程"（按进程环境里的 MOSS_PKG_ID + 命令行认），
     不管是谁拉起来的。界面上不再自己维护一套"上次跑成什么样"——
     那套原来只用来染红/黄，而退出码误报太多（你要求忽略），已经删掉。
     需要退出码时它就在「命令行」那行文字里（"退出码 1"），不拿出来报警。 */
function paintStates(){
  paintRowStats();
  paintHistStats();
  paintActions(selObj());
}

/* ---------------------------------------------------------------- 面板 */
function setTab(name){
  tab = name;
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === name));
  ["detail", "console", "file"].forEach(t =>
    $("#pane-" + t).classList.toggle("on", t === name));
  hideCtx();
  // 回到详情时对一下"在不在跑 / 有没有窗口"（历史条目没有包状态，不用问）
  if (name === "detail" && cur) refreshPkgState(cur);
  if (name === "console") paintConsole();
}
function stripAnsi(s){
  return String(s == null ? "" : s)
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "")
    .replace(/[\x1b][()][A-Za-z0-9]/g, "")
    .replace(/[\r\f]/g, "");
}

/* ================================================================ 命令行：**一个包一份**
   ★ 原来只有一块 <pre>，谁跑就往里写，于是"在 fanyi 这里看到的命令行和 img 那里是同一份"
     （你发现的）。现在按 key 分缓冲区：
         key = 包 id（`moss :img` 的输出就落在 `img` 那份里）
         key = "__host__"（自检这种宿主自己的输出）
     切包只切"看哪一份"，别人的输出不会串进来；同时**允许多个包一起跑**
     （宿主本来就支持，是我前端原来只留了一份 RUN 把它限成了单线程）。 */
const CONSOLE = {};             // key -> {text, info}
let consoleKey = null;          // 当前显示的是哪一份

// 宿主机那一份的初始说明（顺便把"每个包一份"这件事写在界面上）
const HOST_SEED = "每个包有**自己的一份**命令行，互不串台 —— 在左边选谁就显示谁。\n" +
  "· 右上角「运行」= 跑这个包，输出落进它自己那份（可以同时跑好几个）\n" +
  "· 运行中再点同一个按钮 = 停止；左侧列表行尾那颗绿色停止图标也能停\n" +
  "· 「自检」的输出单独算一份（就是现在这份）";

function consoleBuf(key){
  const k = key || "__host__";
  if (!CONSOLE[k]) CONSOLE[k] = {text: k === "__host__" ? HOST_SEED : "", info: "还没跑过"};
  return CONSOLE[k];
}
function consoleTitle(key){
  if (!key) return "moss";
  if (key === "__host__") return "moss 自检";
  // 历史键 = "hist:" + 目标 + (" " + 参数)，标题只取目标那段文件名
  if (key.startsWith("hist:")) return "历史 · " + key.slice(5).split(" ")[0].split(/[\\/]/).pop();
  const p = DATA && DATA.packages.find(x => x.id === key);
  return p ? (p.name + "（:" + key + "）") : key;
}
function paintConsole(){
  const key = consoleKey || "__host__";
  const b = consoleBuf(key);
  const el = $("#out");
  el.textContent = b.text;
  el.scrollTop = el.scrollHeight;
  $("#outinfo").textContent = consoleTitle(key) + " · " + (b.info || "");
}
function setConsole(key, text, info){
  const b = consoleBuf(key);
  b.text = stripAnsi(text);
  if (info !== undefined && info !== null) b.info = info;
  if ((consoleKey || "__host__") === (key || "__host__")) paintConsole();
}
function out(text, info){ setConsole(consoleKey || "__host__", text, info); }
async function copyOut(){
  const text = $("#out").textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ ok = false; }
  if (!ok){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
  }
  $("#outinfo").textContent = ok ? ("已复制 " + text.length + " 个字符")
                                 : "复制失败（可以手动选中后 Ctrl+C）";
}

/* ---------------------------------------------------------------- 运行 / 停止
   跑包不再是"一个阻塞调用"（那样跑起来就停不了，长驻的东西会把界面卡住）。
   走宿主的 `run_start` / `run_poll` / `run_stop`：200ms 轮询一次，
   输出**流式**刷进「命令行」，随时能按停止（连子孙进程一起杀）。

   ★ "这个包在不在跑"**不能只看本地状态**：包可能是从终端开的、或者它的父进程
   fork 出界面后自己退了、或者 moss 界面重启过。所以按钮状态一律问宿主
   （它按进程环境里的 `MOSS_PKG_ID` 认，不管是谁拉起来的）。
   本地的 `RUNS` 只用来决定"这个包的输出还能不能流式看"。 */
const RUNS = {};                // 包 id -> {rid, cmd, timer, stopped}（**可以同时好几个**）
const PST = {};                 // 包 id -> {running, pids, windows, visible, titles}
let pstTimer = null;

async function refreshPkgState(p){
  if (!p){ paintActions(null); return; }
  try{
    const r = await pywebview.api.pkg_states([p.id]);
    if (r && r.ok && r.states && r.states[p.id]) PST[p.id] = r.states[p.id];
  }catch(e){}
  paintActions(p);
  paintRowStats();
}

/* 一次把所有包的状态都问回来：左侧列表要给每一行显示状态，
   一个包一次调用的话每轮得重复扫窗口 N 遍（宿主那边已经做成批量接口）。 */
async function refreshAllStates(){
  if (!DATA) return;
  try{
    const r = await pywebview.api.pkg_states(DATA.packages.map(x => x.id));
    if (r && r.ok) Object.assign(PST, r.states || {});
  }catch(e){}
  paintRowStats();
  paintHistStats();
  paintActions(selObj());
}

/* ---------------------------------------------------------------- 状态：只有两种
   运行中 = 绿色停止图标（点它停）；没在跑 = 淡灰播放图标（点它跑）。
   **不再有红/黄**（退出码误报太多，你要求忽略）。 */
function rowStateOf(id){
  const st = PST[id] || {};
  return st.running ? "running" : "idle";
}

function paintRowStats(){
  document.querySelectorAll(".item").forEach(el => {
    const id = el.dataset.id;
    const box = el.querySelector(".rowstat");
    if (!box) return;
    const running = rowStateOf(id) === "running";
    box.innerHTML = running
      ? '<button class="ic-run" title="正在运行 —— 点这里停掉它">' + ico("square", "i") + '</button>'
      : '<button class="idle" title="运行这个包（:﻿' + esc(id) + '）">' + ico("play", "i") + '</button>';
    const b = box.querySelector("button");
    if (b) b.onclick = (ev) => {
      ev.stopPropagation();                       // 点图标不要连带选中那一行
      if (running) stopFromList(id); else runFromList(id);
    };
  });
}

/* 列表里直接跑：参数留空（就是"平常那样跑它"），不动左边的选中 */
async function runFromList(id){
  const p = DATA.packages.find(x => x.id === id);
  if (!p) return;
  if (RUNS[id]) return;
  const st = PST[id] || {};
  if (st.running){ toast(":" + id + " 已经在跑了"); return; }
  startRun(p, "");
}

/* 列表里直接停掉：是我们起的就走 run_stop（好把输出收尾），否则按进程停 */
async function stopFromList(id){
  let r;
  if (RUNS[id]){
    r = await pywebview.api.run_stop(RUNS[id].rid);
    RUNS[id].stopped = true;
  } else {
    r = await pywebview.api.pkg_stop(id);
    paintRowStats();
  }
  toast(r.msg, !r.ok);
  setTimeout(refreshAllStates, 400);
}

/* 状态灯 + 运行/停止 + 显示/隐藏：**一个控件**（灯就在按钮里）。
   钉在选项卡那一行的最右边，所以不用先点开「详情」也能操作。 */
function paintActions(p){
  const b = $("#btn-run"), v = $("#btn-vis");
  if (!b || !v) return;
  /* 历史条目：只有「运行 / 停止」，而且状态**只认我们自己起的那一次**（宿主那边
     一次"路径调用"没有包 id，认不出是不是别处起的）。「显示/隐藏」对它禁用 ——
     路径调用没有"包自己的窗口"这回事（那个按钮管的是 GUI 包的窗口，`U-16`）。 */
  if (isHist(p)){
    const running = !!RUNS[histKey(p)];
    const gone = p.exists === false;
    // 目标文件没了的：不给"运行"—— 点了只会得到"目标已经不在了"，不如直接不给点
    b.disabled = gone && !running;
    b.innerHTML = ico(running ? "square" : "play", running ? "i ic-run" : "i") +
                  '<span>' + (running ? "停止" : "运行") + '</span>';
    b.title = gone ? "这个文件已经不在了，跑不了"
                   : (running ? "停掉这次调用（连同它的子进程）"
                              : "在它当初的目录里再跑一次（输出进「命令行」）");
    b.classList.toggle("warn", running);
    v.disabled = true;
    v.innerHTML = ico("eye", "i") + '<span>显示</span>';
    v.title = "这是一次路径调用，没有「包自己的窗口」";
    return;
  }
  const st = (p && PST[p.id]) || {running: false, windows: 0, visible: false};
  const mine = !!(p && RUNS[p.id]);
  const running = mine || !!st.running;
  b.disabled = !p;
  // ★ 颜色只在"运行中"时给（绿色停止图标）；不再按"上次是否非 0"染红/黄 —— 误报太多
  b.innerHTML = ico(running ? "square" : "play", running ? "i ic-run" : "i") +
                '<span>' + (running ? "停止" : "运行") + '</span>';
  b.title = !p ? "先在左边选一个包或一条历史"
               : (running ? "停掉它（连同它拉起的子进程）"
                          : "运行这个包，输出进「命令行」");
  b.classList.toggle("warn", running);
  v.disabled = !p || !st.windows;
  v.innerHTML = ico(st.visible ? "eye-off" : "eye", "i") +
                '<span>' + (st.visible ? "隐藏" : "显示") + '</span>';
  v.title = !p ? "先在左边选一个包或一条历史"
               : (!st.windows
                  ? "这个包现在没有开着的窗口（先「运行」或「打开界面」）"
                  : (st.visible ? "隐藏它的窗口（不关掉，随时能再显示出来）"
                                : "把它的窗口显示出来并叫到前面"));
}

async function clickRun(p){
  /* 历史条目：跑 / 停都按 `histKey` 走（那才是它的命令行缓冲区键）。 */
  if (isHist(p)){
    const key = histKey(p);
    if (RUNS[key]){ await stopRun(key); return; }
    rerunHist(p, argsInput() ? argsInput().value : undefined);
    return;
  }
  if (RUNS[p.id]){ await stopRun(p.id); return; }
  const st = PST[p.id] || {};
  if (st.running){                       // 别处启动的：直接停掉它的进程
    const r = await pywebview.api.pkg_stop(p.id);
    toast(r.msg, !r.ok);
    paintRowStats();
    setTimeout(() => refreshPkgState(p), 400);
    return;
  }
  startRun(p, argsInput() ? argsInput().value : "");
}

/* 详情里那个「参数」输入框：包详情叫 `#args`、历史详情叫 `#hargs`
   （两套详情互斥，同一时刻只会存在一个，所以这里谁在就用谁）。 */
function argsInput(){ return $("#args") || $("#hargs"); }

async function startRun(p, args){
  if (RUNS[p.id]) return;                // ★ 只拦"同一个包重复起"，不再拦别的包
  const cmd = "moss :" + p.id + ((args || "").trim() ? " " + args.trim() : "");
  lastRun = {id: p.id, args: args, label: cmd};
  consoleKey = p.id;                     // 输出落进"这个包自己的"那份
  setConsole(p.id, "$ " + cmd, "运行中");
  const r = await pywebview.api.run_start(p.id, args || "");
  if (!r.ok){
    setConsole(p.id, "$ " + cmd + "\n\n启动失败：" + (r.msg || ""), "启动失败");
    toast("✗ " + (r.msg || "启动失败"), true);
    return;
  }
  RUNS[p.id] = {rid: r.run_id, cmd: cmd, timer: null, stopped: false,
                switched: false, tabAtStart: tab};   // 记下"起跑时用户在看哪一页"
  refreshPkgState(p);                    // 让按钮立刻变成「停止」
  pollRun(p.id);
}

/* 这批输出里**除宿主横幅之外**有没有东西？
   ★ 宿主自己总会打 `[执行]/[目录]/时间` 那几行，所以"有输出"不能只看非空 ——
     不然每个包一跑就会跳去命令行（GUI 包明明没有别的内容）。 */
function hasRealOutput(text){
  return String(text || "").split(/\r?\n/).map(l => l.trim()).some(l =>
    l && !/^\[(执行|目录|PID|运行总长|结果)\]/.test(l) &&
    !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(l));
}

/* ★ "有输出才切过去"（你定的规则，第 72 版我先做成了"永不切换"，是我理解偏了）：
   第一次出现**真输出**时切到「命令行」；一直没输出（纯 GUI 的包）就留在原地。
   只在"用户自己没挪窝"时切 —— 万一他已经去文件管理了，别把他拽回来。 */
function maybeAutoSwitch(id, run, outText){
  if (run.switched || !hasRealOutput(outText)) return;
  run.switched = true;
  if (tab === run.tabAtStart){
    consoleKey = id;
    setTab("console");
  }
}

function pollRun(id){
  const run = RUNS[id];
  if (!run) return;
  run.timer = setTimeout(async () => {
    if (!RUNS[id]) return;
    const r = await pywebview.api.run_poll(run.rid);
    if (!r.ok){ finishRun(id, -1, ""); return; }
    setConsole(id, "$ " + run.cmd + "\n\n" + (r.out || "（还没有输出）"), "运行中");
    maybeAutoSwitch(id, run, r.out);
    if (r.running) pollRun(id);
    else finishRun(id, r.code, r.out);
  }, 200);
}

function finishRun(id, code, text){
  const run = RUNS[id];
  if (!run) return;
  clearTimeout(run.timer);
  delete RUNS[id];
  const stopped = !!run.stopped;
  maybeAutoSwitch(id, run, text);        // 跑得太快、第一轮就结束时也要按规则切一次
  setConsole(id, "$ " + run.cmd + "\n\n" + (text || "(这个包没有输出)") + "\n" +
             runTail(code, text, stopped),
             // ★ 只说事实（退出码是多少），不判"故障" —— 非 0 在很多包里是正常现象
             stopped ? "已停止" : ("退出码 " + code));
  // 我们自己按的停止不算"故障"（红）—— 是"已停止"（黄）
  paintRowStats();
  // 详情正开着"这次跑的那个对象"就重画一遍（包 或 历史条目 —— 收尾信息在详情里也显示）
  if ((cur && cur.id === id) || (curH && histKey(curH) === id)) renderDetail();
  paintActions(selObj());
  paintHistStats();
  // ★ 退出码回来了不等于"它没在跑" —— 有的包 fork 出界面自己就退了。
  //   所以状态以宿主那份为准（600ms 后再问一次）。
  setTimeout(refreshAllStates, 600);
  if (side === "hist") loadHist().then(() => { renderHist(); });
}

/* 收尾那一行怎么措辞。
   ★ 为什么要专门做：GUI 包被**我们自己按停止**时，进程是被强杀的，退出码必然是 1 ——
     直接写"[退出码] 1"会让人以为它报错了（你实测反馈过："我正常关闭的，感觉也没报错呀"）。
     另外"非 0 但一句话都没输出"这种情况也点明，省得盯着屏幕找不存在的报错。 */
function runTail(code, text, stopped){
  if (stopped) return "[已停止]（这次是点了停止 —— 不是故障）";
  const body = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(l =>
    l && !/^\[(执行|目录|PID|运行总长|结果)\]/.test(l) &&
    !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(l)).join("");
  if (code !== 0 && !body) return "[退出码] " + code + "（它没有输出任何错误信息）";
  return "[退出码] " + code;
}

async function stopRun(id){
  const run = RUNS[id];
  if (!run) return;
  const r = await pywebview.api.run_stop(run.rid);
  toast(r.msg, !r.ok);
  run.stopped = true;                    // 让 finishRun 别把它记成"故障"
  setTimeout(refreshAllStates, 400);
}

/* ---------------------------------------------------------------- 显示 / 隐藏
   管的是**这个包自己的界面窗口**（GUI 包跑起来那扇窗）：藏起来 ≠ 关掉，
   还能再叫出来。窗口归属由宿主认（进程树 ∪ 进程环境里的 MOSS_PKG_ID），
   所以从终端开的也认得出来。 */
async function toggleVis(p){
  if (isHist(p)) return;                  // 路径调用没有"包自己的窗口"（按钮也是禁用的）
  const st = PST[p.id] || {windows: 0, visible: false};
  const r = st.visible ? await pywebview.api.pkg_hide(p.id)
                       : await pywebview.api.pkg_show(p.id);
  toast(r.msg, !r.ok);
  setTimeout(() => refreshPkgState(p), 400);
}

/* 详情页开着的时候，每 2.5 秒对一次状态（包可能是从别处启动/关掉的）
   ★ 现在左侧列表也要显示状态，所以**一次把所有包都问回来**、不管在哪个选项卡。 */
function pkgPollStart(){
  if (pstTimer) return;
  pstTimer = setInterval(refreshAllStates, 2500);
}

/* ---------------------------------------------------------------- 包列表 */
let side = "pkg";               // pkg | hist（左侧顶部那个切换）

function setSide(which){
  side = which;
  $("#sw-pkg").classList.toggle("on", which === "pkg");
  $("#sw-hist").classList.toggle("on", which === "hist");
  $("#list").hidden = which !== "pkg";
  $("#hist").hidden = which !== "hist";
  $("#q").placeholder = which === "pkg" ? "搜索包名 / 说明 / 标签…"
                                        : "搜索历史（名字 / 参数 / 目录）…";
  if (which === "hist") loadHist().then(renderHist); else renderList();
}

/* ---------------------------------------------------------------- 历史（路径调用）
   数据来自 `user_data/history/*.jsonl`（宿主那侧读好、去过重）。
   ★ 点一下 = **选中它**（不再是直接重跑）—— 和包列表一样：右边出「详情 / 命令行 /
     文件管理」三个选项卡，只有点「运行」（或详情里那个参数框回车）才真的跑，
     而且**在它当初的目录里跑**。行尾那颗播放图标仍然是"点一下就重跑"。
   目标目录里若有 `icon.xxx` 就用它当图标（你要求的）；没有就按目标文件的
   **后缀**画一个（跟文件管理器里同一个图标），不是一个千篇一律的返回箭头。 */
let HIST = [];

async function loadHist(){
  try{
    const r = await pywebview.api.hist_list(60);
    HIST = (r && r.ok && r.items) || [];
  }catch(e){ HIST = []; }
  // 选中的那条会被重新读成**新对象** —— 按 key 找回来，别让详情里看的是旧的
  if (curH){
    const k = histKey(curH);
    curH = HIST.find(x => histKey(x) === k) || curH;
  }
}

// 键要带参数：同一个文件用不同参数跑过，是**两条**历史，不能共用一份控制台
function histKey(it){ return "hist:" + it.target + (it.args ? " " + it.args : ""); }
function histIconHTML(it, cls){
  const c = cls || "hico";
  if (it.icon_svg){ const s = safeSvg(it.icon_svg); if (s) return '<span class="' + c + '">' + s + '</span>'; }
  if (it.icon) return '<span class="' + c + '"><img src="' + it.icon + '" alt=""></span>';
  // 没有 icon.xxx：按目标文件的类型画（和文件管理里那套完全同一个图标）
  const nm = it.name || it.target || "";
  const e = extOf({name: nm, ext: (nm.split(".").pop() || "").toLowerCase()});
  return '<span class="' + c + '" style="color:' + e.c + '">' + ico(e.i, "i") + '</span>';
}

/* 一条历史的目标目录，写成页面用的 rel：优先落在 user_data / system 两个根里，
   落到外面就是 `abs/<绝对路径>`（宿主认这个前缀，见 `system/ui/main.py` 的 ABS_ROOT）。
   ★ 根那一段**大小写不敏感**地比（Windows 路径本来就无所谓大小写）——
     不然盘符写小写就会掉进 `abs/`，面包屑上看着像"跑到外面去了"。 */
function dirRel(dir){
  const norm = s => String(s || "").replace(/\\/g, "/").replace(/\/+$/, "");
  const d = norm(dir);
  if (!d) return null;
  const dl = d.toLowerCase();
  for (const [key, base] of [["user", norm(DATA.user_data)],
                             ["system", norm(DATA.home) + "/system"]]){
    const bl = base.toLowerCase();
    if (dl === bl) return key;
    if (dl.startsWith(bl + "/")) return key + d.slice(base.length);
  }
  return "abs/" + d;
}
function histDir(it){
  const d = it.cwd || (it.target ? it.target.replace(/[\\/][^\\/]*$/, "") : "");
  return dirRel(d);
}

function renderHist(){
  const box = $("#hist");
  const f = $("#q").value.trim().toLowerCase();
  const rows = HIST.filter(it => !f ||
    [it.name, it.target, it.args, it.cwd].join(" ").toLowerCase().includes(f));
  if (!rows.length){
    box.innerHTML = '<div class="empty">' +
      (HIST.length ? "没有匹配的历史" :
       "还没有历史。<br>历史只记<b>路径调用</b>（<span class=\"mono\">moss zeen</span> 这种）——<br>包调用不进历史。") +
      '</div>';
    return;
  }
  box.innerHTML = "";
  const selKey = curH ? histKey(curH) : null;
  for (const it of rows){
    const d = document.createElement("div");
    d.className = "hitem";
    d.dataset.key = histKey(it);
    d.dataset.state = RUNS[d.dataset.key] ? "running" : "idle";
    if (d.dataset.key === selKey) d.classList.add("sel");
    // ★ 目标文件已经没了的，整行**灰掉**（你要求的）：它已经跑不了了，
    //   但记录还留着（当初在哪儿、跑过什么仍然有用），所以是灰不是删。
    const gone = it.exists === false;
    if (gone){
      d.classList.add("dead");
      d.title = "这个文件已经不在了：" + (it.target || "");
    }
    const when = (it.ts || "").replace("T", " ").slice(5, 16);
    d.innerHTML = histIconHTML(it) +
      '<div class="hmain">' +
        '<div class="hname">' + esc(it.name) +
          (it.args ? ' <span class="sub">' + esc(it.args) + '</span>' : "") + '</div>' +
        '<div class="hsub">' + esc(it.cwd || "") + '　·　' + esc(when) + '</div>' +
      '</div>' +
      '<span class="hstat"></span>';
    d.onclick = () => selectHist(it);          // 选中，不跑
    box.appendChild(d);
  }
  paintHistStats();
}

function paintHistStats(){
  document.querySelectorAll(".hitem").forEach(el => {
    const key = el.dataset.key;
    const box = el.querySelector(".hstat");
    if (!box) return;
    const running = !!RUNS[key];
    el.dataset.state = running ? "running" : "idle";
    const it = HIST.find(x => histKey(x) === key);
    const gone = it && it.exists === false;
    // 文件没了的：不放"运行"按钮 —— 点了也只会报"目标已经不在了"，不如不给点
    if (gone && !running){
      box.innerHTML = "";
      return;
    }
    box.innerHTML = running
      ? '<button class="ic-run" title="正在跑 —— 点这里停掉它">' + ico("square", "i") + '</button>'
      : '<button class="idle" title="不选中，直接重跑这次调用">' + ico("play", "i") + '</button>';
    const b = box.querySelector("button");
    if (b) b.onclick = (ev) => {
      ev.stopPropagation();                    // 点图标不要连带选中那一行
      if (running) stopRun(key); else rerunHistByKey(key);
    };
  });
}

function rerunHistByKey(key, args){
  const it = HIST.find(x => histKey(x) === key);
  if (it) rerunHist(it, args);
}

/* 选中一条历史：右边三个选项卡跟着换成"这一条"的。 */
function selectHist(it){
  curH = it; cur = null;
  consoleKey = histKey(it);
  renderList(); renderHist(); renderDetail(); paintConsole();
  setTab("detail");
  fmSelect(histKey(it), /*keepTab*/ true);     // 文件管理换成"这条调用所在的目录"
}

async function rerunHist(it, args){
  const key = histKey(it);
  if (RUNS[key]) return;
  const a = args === undefined ? (it.args || "") : args;
  lastRun = {key: key, args: a, label: "moss /" + it.name};
  consoleKey = key;
  setConsole(key, "$ moss /" + it.name + (a ? " " + a : ""), "运行中");
  // ★ 宿主会把**它真正要跑的命令和当前目录**回报回来（`rerun_argv` 那条规则：
  //   绝对路径 moss 的解析器不认，得翻成"手敲形式"）。所以这里用 `r.cmd` 覆盖一遍，
  //   界面上显示的就是真的那条命令，不是界面自己猜的。
  const r = await pywebview.api.path_start(it.target, it.cwd || "", a);
  if (!r.ok){
    setConsole(key, "$ moss /" + it.name + "\n\n启动失败：" + (r.msg || ""), "启动失败");
    toast("✗ " + (r.msg || "启动失败"), true);
    return;
  }
  const cmd = r.cmd || ("moss /" + it.name);
  setConsole(key, "$ " + cmd + (r.cwd ? "\n# 当前目录：" + r.cwd : ""), "运行中");
  RUNS[key] = {rid: r.run_id, cmd: cmd, timer: null, stopped: false,
               switched: false, tabAtStart: tab};
  paintHistStats();
  paintActions(selObj());
  pollRun(key);
}

/* 「再跑一次」按 key 也认（历史那条会走它） */
function rerunLast(){
  if (!lastRun) return;
  if (lastRun.key) return rerunHistByKey(lastRun.key, lastRun.args);
  const p = DATA.packages.find(x => x.id === lastRun.id);
  if (!p){ toast("找不到 :" + lastRun.id + " 这个包了", true); return; }
  if (RUNS[p.id]) return;
  startRun(p, lastRun.args);
}

function renderList(){
  const f = $("#q").value.trim().toLowerCase();
  const box = $("#list");
  box.innerHTML = "";
  const rows = DATA.packages.filter(p => !f ||
    [p.id, p.name, p.desc, (p.tags||[]).join(" "), (p.aliases||[]).join(" ")]
      .join(" ").toLowerCase().includes(f));
  if (!rows.length){ box.innerHTML = '<div class="empty">没有匹配的包</div>'; return; }
  for (const p of rows){
    const d = document.createElement("div");
    d.className = "item" + (cur && cur.id === p.id ? " sel" : "");
    d.dataset.id = p.id;
    d.dataset.state = rowStateOf(p.id);      // 宿主口径：在跑 / 没在跑
    d.innerHTML = iconHTML(p, "ico") +
      '<div style="min-width:0;flex:1">' +
        '<div class="nm">' + esc(p.name) + ' <span class="sub">:' + esc(p.id) + '</span></div>' +
        '<div class="ds">' + esc(p.desc) + '</div></div>' +
      '<span class="rowstat"></span>';
    d.onclick = () => select(p.id);
    box.appendChild(d);
  }
  paintRowStats();
}
function safeSvg(text){
  try{
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    if (doc.querySelector("parsererror")) return "";
    doc.querySelectorAll("script,foreignObject,iframe").forEach(n => n.remove());
    doc.querySelectorAll("*").forEach(n => {
      [...n.attributes].forEach(a => {
        if (/^on/i.test(a.name) || /^(href|xlink:href)$/i.test(a.name)) n.removeAttribute(a.name);
      });
    });
    const svg = doc.documentElement;
    svg.removeAttribute("width"); svg.removeAttribute("height");
    return svg.outerHTML;
  }catch(e){ return ""; }
}
function iconHTML(p, cls){
  if (p.icon_svg){ const s = safeSvg(p.icon_svg); if (s) return '<span class="' + cls + '">' + s + '</span>'; }
  if (p.icon) return '<span class="' + cls + '"><img src="' + p.icon + '" alt=""></span>';
  return '<span class="' + cls + '"></span>';
}
function pkgRel(p){
  const norm = s => String(s || "").replace(/\\/g, "/").replace(/\/+$/, "");
  const d = norm(p.dir), userd = norm(DATA.user_data), sysroot = norm(DATA.home) + "/system";
  if (d === userd || d.startsWith(userd + "/")) return "user" + d.slice(userd.length);
  if (d === sysroot || d.startsWith(sysroot + "/")) return "system" + d.slice(sysroot.length);
  return null;
}
function select(id){
  cur = DATA.packages.find(p => p.id === id) || null;
  curH = null;                                // 选了包就把"历史那条"放下（两者互斥）
  consoleKey = cur ? cur.id : "__host__";     // 命令行跟着换成"这个包自己的那份"
  renderList(); renderHist(); renderDetail(); paintConsole(); setTab("detail");
  // 换了包 → 文件管理跟着换到"这个包的那一套"（每个包一份上下文，互不干扰）
  if (cur) fmSelect(cur.id, /*keepTab*/ true);
}
function renderDetail(){
  const box = $("#pane-detail");
  const who = selObj();
  if (!who){ box.innerHTML = '<div class="empty">左边选一个包，或者一条历史</div>'; return; }
  if (isHist(who)) return renderDetailHist(who, box);
  const p = cur, params = p.params || [];
  let html = '<div class="dwrap"><div class="hd">' + iconHTML(p, "bigico") +
      '<div style="min-width:0"><h1>' + esc(p.name) + '</h1>' +
      '<div class="lead">:' + esc(p.id) + ' · v' + esc(p.version || "?") + ' · ' + esc(p.kind) +
        ' · ' + esc(p.layer) + ' 层' +
        (p.shadowed ? " · 遮住了 " + esc(p.shadowed) + " 层的同名包" : "") + '</div>' +
      '</div></div>' +
    // ★ 这里**不要再建 #btn-run / #btn-vis**：它们已经钉在选项卡那一行上了。
    //   上次挪位置时把这段留下了 —— 结果是同一对 id 在页面里出现两次，
    //   `$("#btn-run")` 只会命中先出现的那个，详情里这两个永远空着（你看到的"两个空元素"）。
    '<p class="lead" style="margin:14px 0 10px">' + esc(p.desc) + '</p><div>' +
      (p.aliases||[]).map(a => '<span class="chip">:' + esc(a) + '</span>').join("") +
      (p.tags||[]).map(t => '<span class="chip">' + esc(t) + '</span>').join("") +
      (p.ai_expose ? '<span class="chip">AI 可调用 · 风险 ' + esc(p.ai_risk || "?") + '</span>' : "") +
    '</div>';
  if (params.length){
    html += '<div class="sec"><h2>参数</h2><table class="p ptab"><thead>' +

      params.map(pa => '<tr><td class="mono">' + esc(pa.name) +
        (pa.rest ? ' <span class="chip">rest</span>' : "") + '</td><td class="mono">' +
        esc(pa.type || "string") + '</td><td>' + (pa.required ? "是" : "否") + '</td><td>' +
        esc(pa.desc || "") + (pa.placeholder ? '<div class="sub">例：' + esc(pa.placeholder) + '</div>' : "") +

  if ((p.examples || []).length){

      '</div></div>';
  }
  html += '<div class="sec"><h2>跑一下</h2><div class="row-inline">' +
      '<input id="args" placeholder="参数（可留空；回车 = 运行）">' +
      '<button class="iconbtn" id="btn-openui" title="打开这个包自己的界面（后台运行，不等它）">' +
        ico("app-window", "i") + '<span>打开界面</span></button></div>' +
      '<div class="hint">命令预览：<span class="mono" id="preview"></span>' +
      '　·　右上角是「运行 / 停止」</div></div>' +
    // ★ 卸载放在最后单独一块（危险操作不跟"跑一下"混在一起）
    '<div class="sec danger"><h2>卸载</h2><div class="row-split">' +
      '<span class="hint">真删：包本体 + 它的数据（不进回收站）</span>' +

  //   还留在下面，正好把这一行覆盖掉 —— 表现就是"停止按钮是灰的、点了没反应"。
  paintActions(p);

    // 不切选项卡：带界面的包本来就没有命令行输出（你指出的），停在详情更合理
    paintRowStats();
    setTimeout(() => refreshPkgState(p), 1500);
    setTimeout(() => refreshPkgState(p), 3500);
