<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moss</title>

<link rel="icon" type="image/x-icon" href="/favicon.ico">

<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/files.css">
<link rel="stylesheet" href="css/ai.css">
<link rel="stylesheet" href="css/settings.css">

<link rel="stylesheet" href="css/detail.css">

<link rel="stylesheet" href="vendor/xterm.css">
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>moss</div>
  <input id="q" placeholder="搜索包名 / 说明 / 标签…">
  <div class="meta" id="meta"></div>
  <button id="btn-selfcheck" class="iconbtn" title="自检（moss --selfcheck）"></button>
</header>

<main>
  <aside>

    <div id="sideswitch">

      <button id="btn-aside-mini" class="iconbtn" title="收起 / 展开左侧栏（收起后只留图标）"></button>
      <button id="sw-pkg" class="on" title="已安装的包"></button>
      <button id="sw-hist" title="最近跑过的路径调用（点一下重跑）"></button>

    </div>

    <div id="dragbar" hidden></div>

    <div class="listbar" id="bar-list">
      <div class="dd">
        <button class="dd-t" data-dd="filt" title="筛选：全部 / 系统 / 用户"></button>
        <div class="dd-menu">
          <button class="dd-i" data-g="filt" data-v="all" title="全部（系统 + 用户）"></button>
          <button class="dd-i" data-g="filt" data-v="system" title="只看系统包"></button>
          <button class="dd-i" data-g="filt" data-v="user" title="只看用户包"></button>
        </div>
      </div>
      <div class="dd">
        <button class="dd-t" data-dd="sort" title="排序方式"></button>
        <div class="dd-menu">
          <button class="dd-i" data-g="sort" data-v="name" title="按名字排"></button>
          <button class="dd-i" data-g="sort" data-v="born" title="按加入时间排（包目录最后改动的时间）"></button>
          <button class="dd-i" data-g="sort" data-v="run" title="按最后运行排（这个界面自己记的，跑过才有）"></button>
          <button class="dd-i" data-g="sort" data-v="custom" title="自定义顺序（在列表里按住把手拖动排列）"></button>
        </div>
      </div>
      <span class="lb-sep"></span>
      <button id="btn-refresh" class="lb" title="刷新：重新读一遍插件列表和历史"></button>
      <button id="btn-newpkg" class="lb lb-primary" title="新建一个包（moss --new）"></button>
    </div>
    <div class="listbar" id="bar-hist" hidden>
      <div class="dd">
        <button class="dd-t" data-dd="hfilt" title="筛选：全部 / 路径 / 包"></button>
        <div class="dd-menu">
          <button class="dd-i" data-g="hfilt" data-v="all" title="全部"></button>
          <button class="dd-i" data-g="hfilt" data-v="path" title="只看路径调用"></button>
          <button class="dd-i" data-g="hfilt" data-v="pkg" title="只看包调用"></button>
        </div>
      </div>
      <div class="dd">
        <button class="dd-t" data-dd="hsort" title="排序方式"></button>
        <div class="dd-menu">
          <button class="dd-i" data-g="hsort" data-v="time" title="按时间排（新的在前）"></button>
          <button class="dd-i" data-g="hsort" data-v="name" title="按名字排"></button>
          <button class="dd-i" data-g="hsort" data-v="kind" title="按类型排"></button>
        </div>
      </div>
      <span class="lb-sep"></span>
      <button id="btn-refresh-h" class="lb" title="刷新：重新读一遍插件列表和历史"></button>
      <button id="btn-openfile" class="lb"
              title="打开一个可执行文件并运行（等于手敲 moss &lt;文件&gt;：工作目录是它所在的文件夹，也会记进历史）"></button>
    </div>
    <div id="list"></div>
    <div id="hist" hidden></div>

    <div class="grip" id="grip-aside" title="拖我调宽（双击复原）"></div>
  </aside>
  <div id="right">
    <div id="tabs">
      <button class="tab active" data-tab="detail">详情</button>
      <button class="tab" data-tab="console">命令行</button>
      <button class="tab" data-tab="file">文件管理</button>
      <button class="tab" data-tab="ai">AI</button>
      <button class="tab" data-tab="embed" hidden>界面</button>

      <div id="tabactions">
        <button class="iconbtn" id="btn-vis" disabled hidden></button>

        <button class="iconbtn" id="btn-embed-reload" hidden
                title="重新加载这个包的界面"></button>
        <button class="iconbtn" id="btn-embed-window" hidden
                title="把这一页弹成独立窗口（那边点最小化＝收回，点关闭＝结束）"></button>
        <button class="iconbtn" id="btn-run" disabled></button>
      </div>
    </div>

    <section class="pane on" id="pane-detail"><div class="empty">左边选一个包</div></section>

    <section class="pane" id="pane-console"></section>

    <section class="pane" id="pane-file">
      <div id="fm-bar"></div>
      <div class="fmwrap" id="fm-body"></div>
    </section>

    <section class="pane" id="pane-ai"></section>

    <section class="pane" id="pane-embed"></section>

    <div id="dropzone"></div>
  </div>
</main>

<footer id="statusbar">
  <span id="status-text">就绪</span>
  <span class="sp"></span>
  <button id="btn-settings" class="iconbtn" title="设置（就是 user_data/config.toml）"></button>
</footer>

<div id="ctxmenu" hidden></div>
<div id="modal"><div class="card">
  <div class="set-head"><h3 id="m-title">标题</h3><span style="flex:1"></span>
    <button class="set-x" id="m-x" title="关闭（Esc）" aria-label="关闭"></button></div>
  <p id="m-text"></p>
  <input id="m-input" autocomplete="off" spellcheck="false">

  <textarea id="m-textarea" rows="8" spellcheck="false" hidden></textarea>

  <div id="m-extra" hidden></div>
  <div class="btns">
    <button id="m-cancel">取消</button>

    <button id="m-ok2" class="warn" hidden></button>
    <button id="m-ok" class="primary">确定</button>
  </div>
</div></div>
<div id="toasts"></div>

<div id="settings-host"></div>

<script>
(function(){
  window.__errors = window.__errors || [];
  var pending = [];
  function flush(){
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.ui_log)) return;
    while (pending.length){
      try{ window.pywebview.api.ui_log(pending.shift()); }catch(e){ return; }
    }
  }
  window.addEventListener("pywebviewready", function(){ setTimeout(flush, 60); });
  window.__mossTell = function(msg){
    window.__errors.push(msg);
    try{
      var bar = document.getElementById("status-text");
      if (bar){ bar.textContent = "⚠ " + msg; bar.className = "bad"; }
    }catch(e){}
    pending.push(msg);
    flush();
  };
  window.addEventListener("error", function(e){
    var t = e.target;
    if (t && t.tagName && (t.tagName === "SCRIPT" || t.tagName === "LINK" || t.tagName === "IMG")){
      window.__mossTell("[加载失败] " + t.tagName + " " + (t.src || t.href) + "   ← 页面 " + location.href);
      return;
    }
    window.__mossTell("[页内报错] " + ((e && e.message) || e)
      + (e && e.filename ? ("   @ " + e.filename + ":" + e.lineno) : ""));
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    var r = e && e.reason;
    window.__mossTell("[未处理的 Promise] " + ((r && (r.message || r)) || e));
  });

  window.addEventListener("keydown", function(e){
    if (e.ctrlKey && e.altKey && (e.key === "e" || e.key === "E")){
      window.__mossTell("[自测] 这是你按 Ctrl+Alt+E 触发的假错误（能看到它就说明报错这条路是通的）");
    }
  });
})();
</script>

<script src="vendor/powershell.min.js"></script>
<script src="vendor/dos.min.js"></script>
<script src="vendor/lucide.js"></script>

<script src="vendor/xterm.js"></script>

<script>

</script>

<script src="js/core.js"></script>

<script src="js/sound.js"></script>

<script src="js/autostart.js"></script>

<script src="js/parasite.js"></script>
<script src="js/panels.js"></script>
<script src="js/console.js"></script>
<script src="js/drop.js"></script>
<script src="js/embed.js"></script>
<script src="js/list.js"></script>
<script src="js/files.js"></script>
<script src="js/backup.js"></script>
<script src="js/modal.js"></script>
<script src="js/settings.js"></script>
<script src="js/compare.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
