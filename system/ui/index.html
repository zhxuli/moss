<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moss</title>
<style>
:root{
  /* 配色按参考稿（苹果官网那套灰阶）：正文 #1d1d1f / 次级 #515154 / 说明 #86868b /
     更淡 #a1a1a6。强调色 #0071e3。 */
  --bg:#f5f5f7; --panel:#fff; --panel2:#fbfbfd; --line:#f0f0f0; --line2:#e8e8ed;
  /* ★ 控件描边分两档：按钮用 --ctl（细一点够看），**输入框用 --ctl-in（更深）**。
     参考稿那支 #d2d2d7 在好屏上是"精致"，在差屏上就是"看不出这儿能打字" ——
     输入框的描边是它唯一的可交互暗示，必须够深（对着白底约 3:1）。 */
  --ctl:#c6c6cc; --ctl-in:#9a9aa2;
  --fg:#1d1d1f; --fg2:#515154; --dim:#86868b; --dim2:#a1a1a6;
  --ph:#8e8e96;                       /* 输入框占位文字，比 --dim2 再实一点 */
  --tile:#f5f5f7; --tag:#e8e8ed;
  --accent:#0071e3; --accent-fg:#fff;
  --hover:#f5f5f7; --sel:#e8f1ff; --out-bg:#14161a; --out-fg:#d7dae0;
  --code-bg:#fbfbfd; --field-focus:rgba(0,113,227,.14); --drop-bg:rgba(255,255,255,.94);
  --mono: ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace;
  --fill:rgba(120,120,128,.10); --fill2:rgba(120,120,128,.18);
  --group:#fff; --hair:rgba(60,60,67,.10);
  /* 语法配色照抄 exec（GitHub 那套浅/深色） */
  --syn-comment:#6e7781; --syn-keyword:#cf222e; --syn-string:#0a3069;
  --syn-number:#0550ae;  --syn-title:#8250df;   --syn-builtin:#953800;
  --syn-attr:#0550ae;    --syn-meta:#6e7781;
}
/* 深色：**跟随系统**（界面上的深浅切换不做 —— 见 `U-26` ❌） */
@media (prefers-color-scheme: dark){
  :root{ --bg:#151517; --panel:#1c1c1e; --panel2:#232326; --line:#2c2c30; --line2:#2c2c30;
         --ctl:#4a4a52; --ctl-in:#6e6e78;
         --fg:#f5f5f7; --fg2:#d1d1d6; --dim:#a1a1a6; --dim2:#7c7c82;
         --ph:#8e8e96;
         --tile:#2a2a2e; --tag:#3a3a3f;
         --accent:#0a84ff; --accent-fg:#fff;
         --hover:#2a2a2e; --sel:#1f2c3d; --out-bg:#0f1114;
         --out-fg:#c9ced6; --code-bg:#1b1e24; --field-focus:rgba(10,132,255,.30);
  --drop-bg:rgba(28,28,30,.94);
         --fill:rgba(120,120,128,.22); --fill2:rgba(120,120,128,.34);
         --group:#1c1c1e; --hair:rgba(255,255,255,.09);
         --syn-comment:#8b949e; --syn-keyword:#ff7b72; --syn-string:#a5d6ff;
         --syn-number:#79c0ff;  --syn-title:#d2a8ff;   --syn-builtin:#ffa657;
         --syn-attr:#79c0ff;    --syn-meta:#8b949e; }
}
@media (prefers-reduced-motion: reduce){
  /* 系统里关了动效就别缩放/位移，但**保留颜色类反馈**（那不影响前庭）。
     ★ 这条在第 82 版换配色令牌时被脚本连着删掉过一次（替换范围切多了），第 85 版补回来 ——
     **整块替换 CSS 时，结束锚点要用后面那个真实存在的规则**。 */
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .iconbtn:active,.tab:active,.btn:active,.chip:active{transform:none !important}
}
*{box-sizing:border-box}
/* ★ 必须有这条兜底：`display:flex` 之类会压过浏览器默认的 `[hidden]{display:none}`，
   于是 `el.hidden = true` 看起来毫无反应（实测坑）。 */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--fg);background:var(--bg)}
svg.i{width:16px;height:16px;flex:none;display:block}
/* 按钮：**填充，不描边**。满屏 1px 描边是"网页后台"的味道；
/* 工具栏按钮：和详情里的 `.btn` **同一套语言** —— 白底 + 1px 细描边，指上去浮一层灰，
   按下缩一点。整套界面只有一种按钮长相，不做"填充块 / 描边块"两种。 */
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 10px;min-width:32px;border-radius:8px;
  background:var(--panel);border:1px solid var(--ctl);color:var(--fg);
  cursor:pointer;font:inherit;font-size:13px;
  transition:background .15s ease-out,transform .10s ease-out,color .15s ease-out}
.iconbtn:hover{background:var(--hover)}
.iconbtn:active{transform:scale(.98)}
.iconbtn:disabled{opacity:.4;cursor:default;transform:none}
.iconbtn.warn{color:#ef4444}
.iconbtn.warn:hover{background:color-mix(in srgb, #ef4444 10%, var(--panel))}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--hair);background:var(--panel);flex:none}
.brand{font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
/* 搜索框也走"填充式"：平时没边，聚焦给一圈柔和 accent */
#q{width:230px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--ctl-in);background:var(--panel);color:var(--fg);outline:none;
  transition:border-color .2s ease,box-shadow .2s ease}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
#q::placeholder{color:var(--ph)}
.meta{flex:1;color:var(--dim2);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:right;letter-spacing:.01em}
main{flex:1;display:flex;min-height:0}
aside{width:300px;flex:none;border-right:1px solid var(--hair);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#list{flex:1;overflow:auto;min-height:0}
#hist{flex:1;overflow:auto;min-height:0}
/* 左侧顶部那排：插件/历史 切换 + 新建 */
#sideswitch{display:flex;gap:4px;align-items:center;padding:7px 10px;flex:none;
  border-bottom:1px solid var(--line2)}
#sideswitch button{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:5px 10px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--dim);cursor:pointer;font:inherit;font-size:13px}
#sideswitch button:hover{background:var(--hover)}
#sideswitch button.on{background:var(--panel2);border-color:var(--line);color:var(--fg);font-weight:500}
/* 右边那个「新建包」：靠 margin-left:auto 顶到最右。**不再自己改底色和描边** ——
   它就是个普通按钮，和别处同一套长相（原来这里写死了 --panel2/--line，
   是"填充块"时代的残留，和现在的白底细描边不一致）。 */
#sideswitch #btn-newpkg{margin-left:auto;padding:4px 7px;min-width:28px}
/* 历史行：**和包列表长得一样** —— 同一套内边距 / 图标尺寸 / hover / 选中态。
   只有第二行不同：包显示"说明"，历史显示"目录 · 时间"。 */
.hitem,.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);
  cursor:pointer;align-items:center}
.hitem:hover,.item:hover{background:var(--hover)}
.hitem.sel,.item.sel{background:var(--sel)}
.hitem .hico,.ico{width:24px;height:24px;flex:none;display:flex;align-items:center;
  justify-content:center;color:var(--dim)}
.hitem .hico svg,.hitem .hico img,.ico svg,.ico img{width:24px;height:24px}
.hitem .hico img,.ico img{object-fit:contain}
.hitem .hmain{min-width:0;flex:1}
.hitem .hname,.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* `.ds` = 列表第二行（普通字号、不是等宽）；`.sub` = 夹在句子里的等宽小字（`:md5` 这种）。
   ★ 原来 `.sub` 写了两遍（第二遍把 font-size 从 12 改成 11，还加了 mono）——
     同一层里重复声明等于自己压自己。合成一条。 */
.hitem .hsub,.ds{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.sub{color:var(--dim);font-family:var(--mono);font-size:11.5px}
/* ★ 给"整段的提示文字"用：**要能折行**。上面那个 `.sub` 带 nowrap + 省略号，
   拿来包一整句提示会把后半句悄悄吃掉（实测：命令行预览那句一窄就被截断）。 */
.hint{color:var(--dim);font-size:12px;line-height:1.6;margin-top:8px;word-break:break-all}
.hint .mono{font-size:11.5px}
#right{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#tabs{display:flex;gap:2px;align-items:center;padding:7px 12px;flex:none;
  border-bottom:1px solid var(--hair);background:var(--panel)}
/* 选项卡 = 苹果的"分段控件"：选中的那一段是一块**填充**，不是画个框 */
.tab{padding:5px 12px;border-radius:8px;border:0;background:transparent;
  color:var(--dim);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;
  transition:background .12s ease-out,color .12s ease-out,transform .10s ease-out}
.tab:hover{background:var(--fill);color:var(--fg)}
.tab:active{transform:scale(.98)}
.tab.active{background:var(--fill);color:var(--fg);font-weight:500}
#tabactions{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
#tabactions .iconbtn{padding:4px 11px}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
/* ---- 拖进来的接收区（`V-35` / `V-39`）----
   拖着东西进窗口时：左边只列"收得下它"的包（`#dragbar` 那条就是提示），划过哪个包就
   选中哪个；右边详情页浮出**投放框**，在框上松手才跑。
   ★ 浮层 `pointer-events:none`：它盖着整块，要是能接事件，dragenter/dragleave 会被它
     自己反复触发，高亮就会闪；框上那个 `.dz-box` 再单独 `pointer-events:auto`，
     这样"鼠标在哪个框上"才问得出来（以后一个包有多条命令时要靠它分）。 */
#dragbar{padding:7px 10px;font-size:12px;color:var(--fg2);background:var(--panel2);
  border-bottom:1px solid var(--line2);display:flex;gap:7px;align-items:flex-start;
  line-height:1.5}
#dragbar b{color:var(--fg);font-weight:600}
#dragbar svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent)}
#dropzone{position:absolute;left:14px;right:14px;top:48px;bottom:14px;z-index:70;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  pointer-events:none;text-align:center;padding:20px}
#dropzone.on{display:flex}
.dz-box{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;
  min-width:min(560px,80%);padding:26px 30px;border:2px dashed var(--accent);border-radius:16px;
  background:var(--drop-bg);color:var(--accent);box-shadow:0 4px 24px rgba(0,0,0,.06);
  transition:transform .10s ease-out,box-shadow .12s ease-out}
#dropzone.over .dz-box{transform:scale(1.02);box-shadow:0 8px 30px rgba(0,113,227,.18)}
.dz-box .dz-big{font-size:17px;font-weight:600}
.dz-box .dz-sub{font-size:12.5px;color:var(--fg2);max-width:34em;line-height:1.6}
.dz-box .dz-icon svg{width:40px;height:40px}
#pane-detail.hot,#pane-detail.dover{box-shadow:inset 0 0 0 2px var(--accent)}
body.dragging{cursor:copy}
body.dragging .item{border-style:dashed}          /* 拖动时可选的那些包，边框变虚线 */
#btn-run.hot{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);
  box-shadow:0 0 0 3px var(--field-focus)}
/* ★ 别写 `#pane-x{display:none}`：ID 选择器优先级高于 `.pane.on`，面板会永远 0×0 */
#pane-detail.on{display:block}
#pane-console.on{display:flex;flex-direction:column}
#pane-file.on{display:flex;flex-direction:column}
/* 第四个选项卡（包的界面，`V-48`）：顶上一小条工具行 + 下面整块 iframe。
   ★ iframe **不随切换卸载** —— 切走只是这一页 `.on` 掉了，里面照旧在跑。 */
#pane-embed.on{display:flex;flex-direction:column}
#embed-bar{display:flex;gap:8px;align-items:center;padding:6px 12px;flex:none;
  border-bottom:1px solid var(--hair);background:var(--panel);font-size:12px;color:var(--dim)}
#embed-bar .iconbtn{padding:4px 8px}
#embed-info{color:var(--dim)}
#embed-wrap{flex:1;min-height:0;background:var(--panel)}
#embed-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.outbar{display:flex;gap:6px;align-items:center;padding:6px 12px;flex:none;
  border-bottom:1px solid var(--hair);background:var(--panel);color:var(--dim);font-size:12px}
.outbar .iconbtn{padding:4px 6px;min-width:28px}
#out{flex:1;overflow:auto;margin:0;padding:12px 14px;background:var(--out-bg);
  color:var(--out-fg);font-family:var(--mono);font-size:13px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;user-select:text;cursor:text}
#out::selection{background:#3a5a8c;color:#fff}
/* 命令行下面那行输入（`V-43`）：包在 `input()` 等你回答时，敲这里。
   底色跟输出区一致，看着像"终端的最下面一行"；没在跑时整条压暗 + 禁用。 */
#inbar{display:flex;gap:8px;align-items:center;padding:7px 12px;flex:none;
  background:var(--out-bg);border-top:1px solid rgba(255,255,255,.10)}
#inbar .ps1{color:#7fb3ff;font-family:var(--mono);font-size:14px;flex:none;line-height:1}
#inbar input{flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--out-fg);font-family:var(--mono);font-size:13px;padding:3px 0}
#inbar input::placeholder{color:#6b7480}
#inbar input:disabled{cursor:not-allowed}
#inbar.off{opacity:.62}
#inbar .btn{padding:4px 12px;font-size:12.5px}
/* 还没跑过时那块输出区是**一大片纯黑**，看着像个洞。给一句暗色提示。 */
#out:empty::before{content:"（还没有输出）在「详情」里点「运行」，输出会出现在这里。";
  color:#5d6773}
/* ---- 状态灯 ---- */
/* ---- 状态：**只有两种** —— 运行中（绿色停止图标）/ 没运行（灰色播放图标）----
   ★ 不再显示"故障红 / 警告黄"：退出码误报太多 —— 很多正常的退出没有报错，
     也经常被判成错误，那种颜色只会制造噪音（`U-18`）。
     退出码本身还是照记（在「命令行」那行文字里），只是**不拿出来当状态报警**了。 */
.ic-run{color:#1f9d55}
/* 左侧列表行尾那颗"没在跑"的播放图标：平时很淡，鼠标移上去才亮 —— 不抢视线 */
.hstat .idle,.rowstat .idle{color:var(--dim);opacity:.45}
.hstat .idle:hover,.rowstat .idle:hover{opacity:1;color:var(--fg)}
/* 左侧列表行尾的状态图标。★ 历史行（`.hstat`）和包行（`.rowstat`）**共用同一套**：
   以前只写了 `.rowstat button`，历史那边就退化成浏览器默认按钮（灰框），
   看着跟包列表不是一家 —— 就是这条漏了。 */
.hstat,.rowstat{flex:none;display:flex;align-items:center;margin-left:6px}
.hstat button,.rowstat button{display:flex;align-items:center;justify-content:center;padding:3px;
  border:none;border-radius:6px;background:transparent;cursor:pointer}
.hstat button:hover,.rowstat button:hover{background:var(--hover)}
.item[data-state=running],.hitem[data-state=running]{box-shadow:inset 3px 0 0 #1f9d55}
/* ★ 这里原来挂着一句 `.status{…}` 后面跟着**两行没有选择器的裸声明**
   （`border:1.6px …` / `animation:spin …}`）—— 是删小圆点时没清干净的残留：
   裸声明在顶层是非法 CSS，整段被浏览器丢掉，`animation` 引用的 `@keyframes spin`
   也早就不存在了。删掉。 */
/* ★ 目标文件已经没了的历史条目：**整行灰掉**。
   为什么不干脆删掉：这条记录仍然有用（当初在哪个目录跑的、跑过什么），
   只是再也跑不了了 —— 所以是"灰"，而且行尾那颗播放图标也不给。
   不做删除线、不去色：它不是"已删除"，它是"失效"。 */
.hitem.dead{opacity:.45}
.hitem.dead .hname{color:var(--dim)}
/* 文件页标题栏里那截"猜到的编码" */
.encnote{font-family:var(--mono);font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;flex:none}
.dim{color:var(--dim)}
/* ================= 文件管理：**属于某一个包**的一套界面 =================
   结构是"文件管理"这个大选项卡 -> 里面的子选项卡：
     ① 「文件」固定在最左、**不能关闭**（目录浏览，资源管理器那套操作）
     ② 每打开一个文件 = 新增一个子选项卡（可关闭、带未保存黄点）
   子选项卡是**文件管理内部的**，不和顶层的 详情/命令行/文件管理 平级。 */
#fm-bar{display:flex;gap:4px;align-items:flex-end;padding:6px 10px 0;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;overflow-y:hidden}
.fmtab{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px 8px 0 0;
  border:1px solid transparent;border-bottom:none;background:transparent;color:var(--dim);
  cursor:pointer;font-size:13px;white-space:nowrap;max-width:240px}
.fmtab:hover{background:var(--hover)}
.fmtab.on{background:var(--bg);border-color:var(--line);color:var(--fg);font-weight:500}
.fmtab .fname{overflow:hidden;text-overflow:ellipsis}
.fmtab .x{margin-left:2px;color:var(--dim);border-radius:4px;padding:0 3px;line-height:1}
.fmtab .x:hover{background:#d64545;color:#fff}
.fmtab .fdot{width:7px;height:7px;border-radius:50%;background:#dfa100;flex:none}
.fmwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.fmpage{flex:1;min-height:0;display:none;flex-direction:column}
.fmpage.on{display:flex}
.fbnav{display:flex;gap:4px;align-items:center;padding:6px 10px;flex:none;
  border-bottom:1px solid var(--line2);background:var(--panel)}
/* 「回到默认目录」和后面那组导航空开一点，免得看着像同一组的第一个 */
.fbnav .b-home{margin-right:6px}
/* 面包屑：`abs/` 那种长路径（此电脑 › D: › python › wwwroot › ZeEn）会超出一行 ——
   原来只写 overflow:hidden，等于把**最后的当前目录悄悄裁掉**。改成可横向滚，
   滚动条本身不用显示（能拖/能滚就行）。 */
.crumbs{flex:1;display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;
  overflow-y:hidden;scrollbar-width:none;
  padding:3px 8px;border:1px solid var(--ctl);border-radius:8px;background:var(--panel);
  font-size:12.5px;white-space:nowrap}
.crumbs::-webkit-scrollbar{height:0}
.crumbs span.seg{padding:1px 5px;border-radius:5px;cursor:pointer}
.crumbs span.seg:hover{background:var(--hover)}
.crumbs span.sep{color:var(--dim)}
.crumbs span.here{color:var(--dim);cursor:default}
.fbtools{display:flex;gap:4px;align-items:center;padding:5px 10px;flex:none;flex-wrap:wrap;
  border-bottom:1px solid var(--line2);background:var(--panel)}
.fbtools .iconbtn{padding:4px 6px;min-width:28px}
.fbtools .gap{width:8px}
.layers{display:flex;gap:4px;align-items:center;flex:none}
.layers .iconbtn{padding:3px 9px;min-width:0;font-size:12px}
.layers .iconbtn.on{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.fbwrap{flex:1;overflow:auto;min-height:0}
table.fb{width:100%;border-collapse:collapse;font-size:13px;user-select:none}
table.fb th{position:sticky;top:0;z-index:1;text-align:left;font-weight:500;color:var(--dim);
  background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;cursor:pointer;
  white-space:nowrap}
table.fb th .arrow{color:var(--accent);margin-left:4px}
table.fb td{padding:4px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
table.fb td.nmcell{display:flex;align-items:center;gap:8px;max-width:420px}
table.fb tr.row:hover{background:var(--hover)}
table.fb tr.row.sel{background:var(--sel)}
table.fb td.num{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
table.fb td.dim{color:var(--dim)}
.fbstatus{padding:5px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--line2);
  background:var(--panel);flex:none;display:flex;gap:12px;align-items:center}
/* ---- 编辑器（子选项卡里的那页）---- */
.editor{position:relative;flex:1;min-height:0;margin:10px 12px 12px;overflow:hidden;
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.editor > pre,.editor > textarea{
  position:absolute;inset:0;margin:0;border:0;padding:10px 12px;
  font:13px/1.55 var(--mono);letter-spacing:0;tab-size:4;white-space:pre;
  overflow:auto;overflow-wrap:normal;word-break:normal}
/* ★ 高亮那层里的 `<code>` 必须**继承编辑器的字体**：全局那条给 code / .mono 的规则
   命中的是 `code` 元素，而 `.editor > pre` 那条只管到 `pre`、管不到里面的 `code`。
   于是高亮层 12.5px、输入层（textarea）13px：字宽差 4%、行高差 0.78px ⇒
   **越往右、越往下越偏**，就是"光标偏移"。父选择器写不了，只能在这里把子元素拉回来。
   实测（改之前）：pre=13px/20.15  code=12.5px/19.375  ta=13px/20.15。 */
.editor > pre code{font:inherit;letter-spacing:inherit;tab-size:inherit}
.editor > pre{pointer-events:none;color:var(--fg);background:transparent}
.editor > textarea{background:transparent;color:transparent;caret-color:var(--fg);
  resize:none;outline:none;user-select:text}
.editor > textarea::selection{background:rgba(10,132,255,.30)}
.hljs-comment,.hljs-quote{color:var(--syn-comment);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,
.hljs-doctag,.hljs-type,.hljs-name,.hljs-tag{color:var(--syn-keyword)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,
.hljs-meta .hljs-string{color:var(--syn-string)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-variable,
.hljs-template-variable,.hljs-link,.hljs-selector-attr,
.hljs-selector-pseudo{color:var(--syn-number)}
.hljs-title,.hljs-title.class_,.hljs-title.function_{color:var(--syn-title)}
.hljs-built_in,.hljs-builtin-name{color:var(--syn-builtin)}
.hljs-attr,.hljs-property,.hljs-params,.hljs-selector-class,
.hljs-selector-id{color:var(--syn-attr)}
.hljs-meta,.hljs-deletion{color:var(--syn-meta)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:600}
.note{padding:6px 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line2);
  background:var(--panel2);display:flex;align-items:center;gap:7px}
.dirtydot{width:7px;height:7px;border-radius:50%;background:#dfa100;flex:none}
/* ---- 右键菜单 ---- */
#ctxmenu{position:fixed;z-index:70;min-width:200px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:5px;
  box-shadow:0 14px 40px rgba(0,0,0,.28)}
#ctxmenu .mi{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--fg)}
#ctxmenu .mi:hover{background:var(--hover)}
#ctxmenu .mi.dis{opacity:.4;cursor:default}
#ctxmenu .mi.dis:hover{background:transparent}
#ctxmenu .sep{height:1px;background:var(--line2);margin:4px 6px}
/* ---- 详情（包 / 历史共用一套骨架）----
   视觉语言照参考稿（浅灰小节卡 / 白底细描边控件 / 淡红危险区 / 那套灰阶），
   但**留白收紧了**：照搬参考稿的 40px 外padding + 24px 内padding + 20px 块间距，
   一屏就装不下了，得翻页。这一版：
   · 头部改**左右结构** —— 左：图标在上、名字在下；右：id 那一行在上、介绍在下。
     比原来"居中三行"矮掉一大截（原来图标/名字/id/介绍各占一行）；
   · **去掉小节标题**（属性 / 跑一下 / 这条记录 / 卸载）—— 每块都顶着一行标题，
     合计就是小半屏；而这些块的内容本身已经说明了自己是什么（"别名 / 标签"这些
     行标签、输入框 + 运行按钮、红色的删除按钮），去掉不影响使用；
   · 外边距 40 → 24、块内边距 22/24 → 16/20、块间距 20 → 14、属性行距 16 → 11。 */
#pane-detail{overflow:auto;padding:0}
/* 内容坐在一张白卡上：浅灰的图标块和浅灰的小节卡都要靠它当对照面 */
.dwrap{max-width:760px;margin:20px auto;padding:24px 28px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;
  box-shadow:0 4px 24px rgba(0,0,0,.03)}

/* ---------- 头部：**3 行网格** ----------
   ┌──────────┬──────────────────────────────┐
   │          │ 说明（最多两行）               │  行 1-2
   │  [图标]   │                              │
   │  名字     │ :md5 · v1.0.0 · task · 层     │  行 3
   └──────────┴──────────────────────────────┘
   为什么用 grid 而不是两个 flex 列：用户要的是"右侧三行 = 左侧两行图标 + 一行名字"，
   也就是**左右的行要真的对齐**。grid 的行高由两列共同决定，天然等高；
   两个各自堆叠的 flex 列只能靠调数值凑，一改字号就歪。
   · 图标与名字在左列里**居中对齐**（列宽 = 两者较宽的那个，各自居中 ⇒ 互相对齐）；
   · 名字**永不换行**（`nowrap` + 省略号）—— 名字一折行最难看；太长就省略，
     左列封顶 200px，不至于把右边挤没；
   · 说明**最多两行**（`-webkit-line-clamp:2`）。 */
.dhead{display:grid;grid-template-columns:max-content minmax(0,1fr);
  column-gap:18px;row-gap:8px;margin-bottom:16px}
.dicon{grid-area:1 / 1 / 3 / 2;align-self:center;justify-self:center;
  display:flex;align-items:center;justify-content:center;width:44px;height:44px;
  background:var(--tile);border-radius:12px;color:var(--fg2)}
.dicon svg,.dicon img{width:22px;height:22px}
h1.dtitle{grid-area:3 / 1 / 4 / 2;align-self:baseline;text-align:center;font-size:21px;
  font-weight:600;line-height:1.25;letter-spacing:.2px;margin:0;max-width:200px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddesc{grid-area:1 / 2 / 3 / 3;align-self:center;margin:0;font-size:13.5px;
  line-height:1.6;color:var(--fg2);word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmeta{grid-area:3 / 2 / 4 / 3;align-self:baseline;font-size:12.5px;color:var(--dim);
  font-family:var(--mono);line-height:1.5;word-break:break-all}

/* ---------- 小节卡 ---------- */
.dsec{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;margin-bottom:14px}
.dsec:last-child{margin-bottom:0}
.dsec.danger{background:color-mix(in srgb, #ef4444 5%, var(--panel2));
  border-color:color-mix(in srgb, #ef4444 22%, var(--line));
  display:flex;justify-content:space-between;align-items:center;gap:16px}
.danger-text{font-size:13px;color:var(--dim);line-height:1.6;word-break:break-word}

/* ---------- "标签 : 值" 的行 ---------- */
.props{display:flex;flex-direction:column}
.prop{display:flex;align-items:flex-start;gap:16px;padding-bottom:11px;
  border-bottom:1px solid var(--line)}
.prop:last-child{padding-bottom:0;border-bottom:none}
.prop + .prop{padding-top:11px}
.prop-k{width:96px;flex:none;font-size:13.5px;color:var(--dim);line-height:1.5;padding-top:1px}
.prop-v{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--fg);line-height:1.5;
  word-break:break-all}
.prop-v .soft{font-weight:400;color:var(--dim)}
.prop-v .pdesc{font-weight:400;color:var(--dim);font-size:12.5px;line-height:1.6;margin-top:3px}
.prop-v .pex{font-weight:400;color:var(--dim2);font-size:12px;line-height:1.6;margin-top:3px;
  font-family:var(--mono)}
.tag{display:inline-block;background:var(--tag);color:var(--fg2);padding:2px 8px;
  border-radius:6px;font-size:12px;margin:0 6px 4px 0}

/* ---------- 可点的例子 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tag);color:var(--fg2);border:0;border-radius:6px;padding:3px 9px;
  font-size:12px;font-family:var(--mono);cursor:pointer;
  transition:background .15s ease-out,transform .1s ease-out}
.chip:hover{background:var(--fill2)}
.chip:active{transform:scale(.97)}

/* ---------- 控件：白底 + 细描边 ---------- */
.runrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#args,#hargs{flex:1;min-width:200px;padding:8px 14px;background:var(--panel);
  border:1px solid var(--ctl-in);border-radius:8px;font-size:13.5px;color:var(--fg);
  font-family:var(--mono);outline:none;
  transition:border-color .2s ease,box-shadow .2s ease}
#args::placeholder,#hargs::placeholder{color:var(--ph)}
#args:focus,#hargs:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
#args:disabled,#hargs:disabled{opacity:.5;cursor:default}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;
  border-radius:8px;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;
  background:var(--panel);border:1px solid var(--ctl);color:var(--fg);
  transition:background .15s ease-out,transform .1s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.danger{background:color-mix(in srgb, #ef4444 7%, var(--panel));
  border-color:color-mix(in srgb, #ef4444 28%, var(--ctl));color:#ef4444}
.btn.danger:hover{background:color-mix(in srgb, #ef4444 13%, var(--panel))}

.runhint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.7;word-break:break-all}
.runhint .mono{font-family:var(--mono);background:var(--tag);color:var(--fg2);
  padding:2px 6px;border-radius:4px;font-size:11.5px}

.row-split{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row-split .hint{margin-top:0;flex:1 1 auto;min-width:0}
.hint{color:var(--dim2);font-size:12px;line-height:1.6;margin-top:8px;word-break:break-all}
.hint .mono{font-size:11.5px}
/* ---------- 提示条（详情里"提醒一句"那种横条）---------- */
.warnbox{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:10px 14px;
  border-radius:10px;background:color-mix(in srgb, #e0a800 14%, var(--group));
  border:1px solid color-mix(in srgb, #f59e0b 26%, var(--line));
  font-size:12.5px;line-height:1.6;color:var(--fg)}
.warnbox svg.i{color:#b8860b;margin-top:2px;flex:none}
code,.mono{font-family:var(--mono);font-size:12.5px}
table.p{width:100%;border-collapse:collapse;font-size:13px}
table.p th,table.p td{text-align:left;padding:6px 8px;vertical-align:top}
table.p tbody tr + tr th,table.p tbody tr + tr td{border-top:1px solid var(--line2)}
table.p th{color:var(--dim);font-weight:500}
.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ★ 两个详情各有一个参数框：包详情是 `#args`，历史详情是 `#hargs`。
   原来只写了 `#args` ⇒ 历史那边的输入框是**浏览器默认样式**（细边、字被挤），
   一眼就跟旁边不是一套东西 —— 以前就是漏了这一条。 */
#args,#hargs{flex:1;min-width:180px;max-width:620px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:12.5px;
  outline:none;transition:border-color .12s,box-shadow .12s}
#args:focus,#hargs:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
#args::placeholder,#hargs::placeholder{color:var(--dim)}
.empty{color:var(--dim);text-align:center;margin-top:70px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
  align-items:center;justify-content:center;z-index:80}
#modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;min-width:340px;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.card h3{margin:0 0 10px;font-size:15px}
.card p{margin:0 0 12px;color:var(--dim);font-size:13px;line-height:1.6;word-break:break-all}
.card input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);outline:none}
.card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.card .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.card .btns button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer;font:inherit}
.card .btns button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card .btns button.danger{background:#d64545;border-color:#d64545;color:#fff}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;align-items:center;z-index:90;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.22);
  max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.bad{border-color:#d64545;color:#d64545}

/* ---------------------------------------------------------------- 底部状态栏（`V-61` ✅）
   左边是**最近一条状态提示**（toast 说了什么，它就留什么），右边一颗齿轮开「设置」。
   ★ 只放这一行字：状态栏最容易变成"什么信息都往里塞"的垃圾场，而现在真正需要
     一直看得见的信息还没有 —— 与其猜，不如空着。 */
#statusbar{flex:none;display:flex;align-items:center;gap:8px;height:26px;
  padding:0 6px 0 12px;border-top:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:12px;user-select:none}
#status-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status-text.bad{color:#d64545}
#statusbar .sp{flex:1}
/* ★ 你说「不要边框」：状态栏里那颗齿轮**只留图标本身** —— 去掉描边和底色。
   `.iconbtn` 那套「白底 + 1px 描边」是工具栏的语言，钉在状态栏上像个贴上去的方块。
   悬停 / 按下还是给反馈（一层淡底 + 缩一点），不然会让人怀疑它到底能不能点。 */
#statusbar .iconbtn{width:22px;height:22px;padding:0;min-width:0;border:0;
  background:transparent;color:var(--dim)}
#statusbar .iconbtn:hover{background:var(--hover);color:var(--fg)}
#statusbar .iconbtn svg{width:14px;height:14px}

/* ---------------------------------------------------------------- 「设置」面板（`V-60` ✅ / `V-63` ✅ / `V-66`）
   内容全部来自宿主（`moss --settings` / `--settings-check`），界面不自己列设置项、
   也不自己实现校验规则 —— 就不会出现"面板里有、文件里没有""两处规则不一致"这种事。

   ★ 结构（`V-63` + `V-66`）：
       .card       圆角 + overflow:hidden（**自己不滚**，滚动条压不到圆角）
       ├ .set-head 标题 + 配置文件 + ×
       ├ .set-main flex
       │   ├ .set-nav  左侧分类（点一下切一组，一次只看一组 —— 不再是一长条）
       │   └ .set-body 右侧内容（**唯一滚动层**，没有圆角）
       └ .set-foot 状态 + 取消 / 保存
   ★ 说明放进 `?` 图标的 hover 提示里（不是整格 hover）：面板上只有标签和控件。 */
#settings{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;
  align-items:center;justify-content:center;z-index:85}
#settings.on{display:flex}
.card.wide{width:min(760px,94vw);height:min(560px,86vh);max-width:none;padding:0;
  border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.set-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 18px;
  border-bottom:1px solid var(--hair);flex:none}
.set-head h3{margin:0;font-size:15px;flex:none}
.set-sub{flex:1;min-width:0;color:var(--dim);font-size:11.5px;font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.set-x{width:26px;height:26px;flex:none;border:0;border-radius:8px;background:transparent;
  color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  padding:0;transition:background .15s ease-out,color .15s ease-out}
.set-x:hover{background:var(--hover);color:var(--fg)}
.set-x svg{width:15px;height:15px}
.set-main{flex:1;min-height:0;display:flex}

/* 左侧分类 */
.set-nav{width:152px;flex:none;background:var(--panel2);border-right:1px solid var(--hair);
  padding:8px;display:flex;flex-direction:column;gap:2px}
.set-navitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  font:inherit;font-size:12.5px;color:var(--fg2);background:transparent;border:0;
  cursor:pointer;text-align:left;transition:background .15s ease-out,color .15s ease-out}
.set-navitem:hover{background:var(--hover)}
.set-navitem.on{background:var(--sel);color:var(--accent);font-weight:600}
.set-navitem svg{width:14px;height:14px;flex:none;opacity:.75}
.set-navitem.on svg{opacity:1}
.set-navitem .set-dot{width:6px;height:6px;border-radius:50%;background:#d64545;margin-left:auto;
  flex:none;display:none}
.set-navitem.has-bad .set-dot{display:block}
.set-navitem.has-warn .set-dot{background:#e0a02a;display:block}
.set-navspacer{flex:1}

/* 右侧内容：一次只显示一组 */
.set-body{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:16px 20px 10px}
.set-pane{display:none}
.set-pane.on{display:block}
.set-ptitle{font-size:13.5px;font-weight:600;margin:0}
.set-pdesc{font-size:12px;color:var(--dim);line-height:1.65;margin:4px 0 14px}
/* 开关类：一行一个（本来就该一行一个 —— 左边名字、右边开关） */
.set-list{display:flex;flex-direction:column}
.set-item{display:flex;align-items:center;gap:10px;padding:9px 2px;
  border-top:1px solid var(--hair)}
.set-item:first-child{border-top:0}
.set-item:hover{background:var(--panel2)}
/* 输入类：两列 */
.set-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.set-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.set-lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2);
  min-width:0;cursor:default}
.set-lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-item .set-lbl{flex:1}
.set-info{width:14px;height:14px;flex:none;color:var(--dim2);opacity:.55;
  display:inline-flex;align-items:center;justify-content:center;cursor:help;
  transition:opacity .15s,color .15s}
.set-lbl:hover .set-info,.set-info:hover{opacity:1;color:var(--accent)}
.set-info svg{width:13px;height:13px}
.set-prob{display:none;font-size:11.5px;line-height:1.55;margin-top:2px}
.set-item.bad,.set-field.bad{background:rgba(214,69,69,.07);border-radius:8px}
.set-item.bad .set-lbl span,.set-field.bad .set-lbl span{color:#d64545}
.set-item.bad .set-prob,.set-field.bad .set-prob{display:block;color:#d64545}
.set-item.warn,.set-field.warn{background:rgba(255,159,10,.08);border-radius:8px}
.set-item.warn .set-prob,.set-field.warn .set-prob{display:block;color:#a86400}
.set-field.bad,.set-field.warn{padding:6px 8px;margin:-6px -8px}
.set-item.bad,.set-item.warn{padding-left:8px;padding-right:8px}

/* ★ 控件（`V-63` 的教训：这几条**必须带 `#settings ` 前缀** —— 全局那条
   `.card input{width:100%}`（确认框用的）是"一个类 + 一个元素"，优先级高过单类选择器） */
#settings .inp{width:100%;height:32px;padding:0 11px;border-radius:8px;
  border:1px solid var(--ctl-in);background:var(--panel2);color:var(--fg);
  font-family:var(--mono);font-size:12.5px;outline:none;
  transition:border-color .12s,box-shadow .12s}
#settings .inp::placeholder{color:var(--ph);font-family:inherit}
#settings .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
/* 开关 */
.sw{width:38px;height:22px;border-radius:99px;border:1px solid var(--ctl);background:var(--panel2);
  position:relative;cursor:pointer;flex:none;padding:0;transition:background .16s,border-color .16s}
.sw::after{content:"";position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform .16s cubic-bezier(.4,0,.2,1)}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.sw:focus-visible{outline:none;box-shadow:0 0 0 3px var(--field-focus)}
/* 步进器 */
#settings .step{display:inline-flex;align-items:center;border:1px solid var(--ctl-in);
  border-radius:8px;overflow:hidden;background:var(--panel2);height:32px;flex:none}
#settings .step button{width:30px;height:100%;border:0;background:transparent;color:var(--fg2);
  cursor:pointer;font-size:15px;line-height:1;padding:0;transition:background .12s,color .12s}
#settings .step button:hover:not(:disabled){background:var(--hover);color:var(--fg)}
#settings .step button:disabled{opacity:.3;cursor:default}
#settings .step .num{width:44px;height:100%;text-align:center;font-family:var(--mono);
  font-size:13px;border:0;border-left:1px solid var(--hair);border-right:1px solid var(--hair);
  background:transparent;color:var(--fg);outline:none}
/* 冲突/提醒时控件也变色 */
.set-item.bad .sw,.set-field.bad .inp,.set-field.bad .step{border-color:#d64545;
  box-shadow:0 0 0 3px rgba(214,69,69,.14)}
.set-item.warn .sw,.set-field.warn .inp,.set-field.warn .step{border-color:#e0a02a;
  box-shadow:0 0 0 3px rgba(224,160,42,.16)}
/* 快捷命令那页底下的预览行（照那个稿子：一行把四条命令都摆出来） */
.set-live{margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--tile);
  font-family:var(--mono);font-size:12px;color:var(--fg2);line-height:1.8;word-break:break-all}
.set-live b{color:var(--fg);font-weight:600}
.set-live.bad{background:rgba(214,69,69,.08);color:#d64545}

/* 脚：状态 + 按钮 */
.set-foot{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;
  border-top:1px solid var(--hair);flex:none;background:var(--panel2)}
.set-state{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0}
.set-state.moved{color:var(--accent)}
.set-state.bad{color:#d64545}
.set-foot .btn{padding:7px 15px;border-radius:8px;border:1px solid var(--ctl);
  background:var(--panel);color:var(--fg);cursor:pointer;font:inherit;font-size:13px}
.set-foot .btn:hover{background:var(--hover)}
.set-foot .btn.primary{background:var(--accent);border-color:var(--accent);
  color:var(--accent-fg)}
.set-foot .btn.primary:hover{filter:brightness(1.06)}
.set-foot .btn:disabled{opacity:.45;cursor:default;filter:none}
.set-foot .btn-quiet{padding:7px 12px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--dim);cursor:pointer;font:inherit;font-size:13px}
.set-foot .btn-quiet:hover{background:var(--hover);color:var(--fg)}

/* hover 提示（`V-66`：从 `?` 图标 / 标签触发）。挂 body 上 + fixed 定位 —— 
   放滚动层里会被裁掉。 */
#tip{position:fixed;z-index:95;max-width:320px;padding:9px 12px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 12px 34px rgba(0,0,0,.26);font-size:12px;line-height:1.65;color:var(--fg2);
  pointer-events:none}
#tip b{display:block;font-size:12.5px;color:var(--fg);margin-bottom:3px}
#tip .tip-now{font-family:var(--mono);font-size:11.5px;color:var(--dim2);margin-top:5px}
#tip .tip-prob{margin-top:5px}
#tip .tip-prob.bad{color:#d64545}
#tip .tip-prob.warn{color:#a86400}
</style>

<body>
<header>
  <div class="brand"><span class="dot"></span>moss</div>
  <input id="q" placeholder="搜索包名 / 说明 / 标签…">
  <div class="meta" id="meta"></div>
  <button id="btn-selfcheck" class="iconbtn" title="自检（moss --selfcheck）"></button>
  <button id="btn-refresh" class="iconbtn" title="刷新包列表"></button>
</header>

<main>
  <aside>
    <!-- 左侧顶部：插件 / 历史 切换，右边是"新建包" -->
    <div id="sideswitch">
      <button id="sw-pkg" class="on" title="已安装的包"></button>
      <button id="sw-hist" title="最近跑过的路径调用（点一下重跑）"></button>
      <button id="btn-newpkg" class="iconbtn" title="新建一个包（moss --new）"></button>
    </div>
    <!-- 拖动中的一条提示（`V-39`）：只列收得下它的包 -->
    <div id="dragbar" hidden></div>
    <div id="list"></div>
    <div id="hist" hidden></div>
  </aside>
  <div id="right">
    <div id="tabs">
      <button class="tab active" data-tab="detail">详情</button>
      <button class="tab" data-tab="console">命令行</button>
      <button class="tab" data-tab="file">文件管理</button>
      <button class="tab" data-tab="embed" hidden>界面</button>
      <!-- ★ 运行/停止 + 显示/隐藏，钉在选项卡这一行的最右边：不用先点开「详情」。
           状态**只有两种**：运行中 = 绿色停止图标，没在跑 = 普通播放图标（不再有红/黄）。 -->
      <div id="tabactions">
        <button class="iconbtn" id="btn-run" disabled></button>
        <button class="iconbtn" id="btn-vis" disabled></button>
      </div>
    </div>

    <section class="pane on" id="pane-detail"><div class="empty">左边选一个包</div></section>

    <!-- 命令行那一页（`V-83` 起是 **Vue 组件**：`js/console.js` 的 `MossConsole`）。
         输出区 / 输入行 / 顶上那三颗按钮（复制·重跑·清空）的标记都在组件的模板里，
         这里只留挂载点 —— 和 `#list` / `#hist` / `#pane-detail` / `#pane-file` 一样。 -->
    <section class="pane" id="pane-console"></section>

    <section class="pane" id="pane-file">
      <div id="fm-bar"></div>
      <div class="fmwrap" id="fm-body"></div>
    </section>

    <!-- 第四个选项卡：包自己的界面（`V-48` ✅；`V-84` 起这一页也是 **Vue 组件**：
         `js/embed.js` 的 `MossEmbed`）—— 顶上那一小条 + 下面那块 `#embed-wrap` 的标记
         都在组件模板里，这里只留挂载点。
         ★ iframe 不进模板：一帧 = 一个包自己的后端进程，**切走不卸载**（你要的那条），
           所以帧仍然是"谁需要谁 append 进 `#embed-wrap`"。 -->
    <section class="pane" id="pane-embed"></section>

    <!-- 拖进来的"接收区"（`V-35` / `V-39`）：只在拖动中、而且当前这个包收得下的时候出现。
         里面按 `pkg.json` 的 `drop` 声明画投放框（今天一个包最多一个"运行"框）。 -->
    <div id="dropzone"></div>
  </div>
</main>

<!-- 底部状态栏（`V-61` ✅）：左边"最近一条状态提示"，右边那颗齿轮开「设置」。 -->
<footer id="statusbar">
  <span id="status-text">就绪</span>
  <span class="sp"></span>
  <button id="btn-settings" class="iconbtn" title="设置（就是 user_data/config.toml）"></button>
</footer>

<div id="ctxmenu" hidden></div>
<div id="modal"><div class="card">
  <div class="set-head"><h3 id="m-title">标题</h3><span style="flex:1"></span>
    <button class="set-x" id="m-x" title="关闭（Esc）" aria-label="关闭"></button></div>
  <p id="m-text"></p>
  <input id="m-input" autocomplete="off" spellcheck="false">
  <div class="btns">
    <button id="m-cancel">取消</button>
    <button id="m-ok" class="primary">确定</button>
  </div>
</div></div>
<div id="toasts"></div>
<!-- 设置面板的挂载点（`V-67`）：面板本身是 `js/settings.js` 里那个 Vue 组件 -->
<div id="settings-host"></div>




<!-- 出了问题要**看得见**（`V-76`）：这段是**内联**的，排在所有外部脚本之前。
     ★ 为什么非要内联：`js/*.js` 自己没加载上时，写在 js 里的错误处理根本跑不到（鸡生蛋）。
     它管两件事：资源加载失败（哪个 URL 没下来）、以及页内报错 —— 都写到右下角状态栏（红字）
     和 user_data/state/_ui_drop.log。 -->
<script>
(function(){
  window.__errors = window.__errors || [];
  var pending = [];
  function flush(){
    if (!(window.pywebview && window.pywebview.api && window.pywebview.api.ui_log)) return;
    while (pending.length){
      try{ window.pywebview.api.ui_log(pending.shift()); }catch(e){ return; }
    }
  }
  window.addEventListener("pywebviewready", function(){ setTimeout(flush, 60); });
  window.__mossTell = function(msg){
    window.__errors.push(msg);
    try{
      var bar = document.getElementById("status-text");
      if (bar){ bar.textContent = "⚠ " + msg; bar.className = "bad"; }
    }catch(e){}
    pending.push(msg);
    flush();
  };
  window.addEventListener("error", function(e){
    var t = e.target;
    if (t && t.tagName && (t.tagName === "SCRIPT" || t.tagName === "LINK" || t.tagName === "IMG")){
      window.__mossTell("[加载失败] " + t.tagName + " " + (t.src || t.href) + "   ← 页面 " + location.href);
      return;
    }
    window.__mossTell("[页内报错] " + ((e && e.message) || e)
      + (e && e.filename ? ("   @ " + e.filename + ":" + e.lineno) : ""));
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    var r = e && e.reason;
    window.__mossTell("[未处理的 Promise] " + ((r && (r.message || r)) || e));
  });
  // 自测开关：Ctrl+Alt+E 故意扔一个错 —— 用来确认"红字 + 日志"这条路是通的
  window.addEventListener("keydown", function(e){
    if (e.ctrlKey && e.altKey && (e.key === "e" || e.key === "E")){
      window.__mossTell("[自测] 这是你按 Ctrl+Alt+E 触发的假错误（能看到它就说明报错这条路是通的）");
    }
  });
})();
</script>

<!-- ★ 预览工具（tools/界面预览.py）把"假后端"插在下面这个 <script> 之前 ——
     锚点是 `<script>` 换行 + `/* =====`。它必须排在所有 js/ 脚本前面：
     假 pywebview 得先就位，页面初始化时才叫得动。 -->
<script>
/* ============================================================================
   moss 界面（宿主界面）—— `V-67` 起拆成了模块，顺序就是下面这些 <script src>：

     js/core.js      状态与工具（$ / ico / 数据类型 / 全局状态）
     js/panels.js    状态栏 + 选项卡切换
     js/console.js   命令行 + 运行 + 包状态
     js/drop.js      拖文件进来
     js/embed.js     包自己的界面（内嵌那一帧）
     js/list.js      包列表 + 历史 + 详情
     js/files.js     文件管理（资源管理器 + 编辑器）
     js/modal.js     模态框 / toast / 状态栏
     js/settings.js  ★ 设置面板（**Vue 3 组件**，自己带模板和状态）
     js/app.js       启动 + 新建/卸载包

   ★ 为什么是"经典脚本 + 顺序加载"而不是 ES module：这个页面是 pywebview 从
     `file://` 打开的，Chromium 对 `file://` 下的 module 直接按 CORS 拦掉
     （`origin: null`）—— 想用 `import` 就得把整个界面改走本地 http（那是另一件事）。
     经典脚本没有这个限制，而且 `const/let` 在顶层仍然是**跨文件共享**的脚本作用域，
     和原来"一个大 <script>"的语义一样。
   ============================================================================ */
</script>
<script src="js/core.js"></script>
<script src="js/panels.js"></script>
<script src="js/console.js"></script>
<script src="js/drop.js"></script>
<script src="js/embed.js"></script>
<script src="js/list.js"></script>
<script src="js/files.js"></script>
<script src="js/modal.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
