<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moss</title>
<style>
:root{
  --bg:#f5f5f7; --panel:#fff; --panel2:#fbfbfd; --line:#e2e2e8; --line2:#eeeef3;
  --fg:#1c1c1e; --dim:#6b6b73; --accent:#0a84ff; --accent-fg:#fff;
  --hover:#f0f0f4; --sel:#e8f1ff; --out-bg:#14161a; --out-fg:#d7dae0;
  --code-bg:#fbfbfd; --field-focus:rgba(10,132,255,.20);
  --mono: ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace;
  /* 语法配色照抄 exec（GitHub 那套浅/深色），不引第三方主题 */
  --syn-comment:#6e7781; --syn-keyword:#cf222e; --syn-string:#0a3069;
  --syn-number:#0550ae;  --syn-title:#8250df;   --syn-builtin:#953800;
  --syn-attr:#0550ae;    --syn-meta:#6e7781;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181d; --panel:#1d2026; --panel2:#22252c; --line:#2c3038; --line2:#262a31;
         --fg:#e8eaed; --dim:#9aa0aa; --hover:#262a31; --sel:#1f2c3d; --out-bg:#0f1114;
         --out-fg:#c9ced6; --code-bg:#1b1e24; --field-focus:rgba(10,132,255,.28);
         --syn-comment:#8b949e; --syn-keyword:#ff7b72; --syn-string:#a5d6ff;
         --syn-number:#79c0ff;  --syn-title:#d2a8ff;   --syn-builtin:#ffa657;
         --syn-attr:#79c0ff;    --syn-meta:#8b949e; }
}
*{box-sizing:border-box}
/* ★ 必须有一条兜底：`#treewrap{display:flex}` 这类规则会**压过**浏览器默认的
   `[hidden]{display:none}`，于是 `el.hidden = true` 看起来毫无反应（实测坑）。 */
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--fg);background:var(--bg)}
/* ---- 图标：Lucide（ISC），统一 16px / 1.5 描边 / 跟随 currentColor ---- */
svg.i{width:16px;height:16px;flex:none;display:block}
svg.i.lg{width:20px;height:20px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 8px;min-width:32px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer}
.iconbtn:hover{background:var(--hover)}
.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn.warn:hover{border-color:#d64545;color:#d64545}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
#q{width:250px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.meta{flex:1;color:var(--dim);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:right}
button{font:inherit}
main{flex:1;display:flex;min-height:0}
/* ---- 左栏：包 / 文件 两副面孔，高度占满 ---- */
aside{width:320px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#sideswitch{display:flex;gap:4px;padding:7px 10px;border-bottom:1px solid var(--line2);flex:none}
#sideswitch button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:5px 8px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--dim);cursor:pointer;font-size:13px}
#sideswitch button:hover{background:var(--hover)}
#sideswitch button.on{background:var(--panel2);border-color:var(--line);color:var(--fg);font-weight:500}
#list{flex:1;overflow:auto;min-height:0}
#treewrap{flex:1;display:flex;flex-direction:column;min-height:0}
#treebar{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line2);flex:none;flex-wrap:wrap}
#treebar .iconbtn{padding:4px 6px;min-width:28px}
#tree{flex:1;overflow:auto;min-height:0;padding-bottom:8px}
.row{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;
  white-space:nowrap;font-size:13px;position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .tw{width:14px;flex:none;color:var(--dim);display:flex;align-items:center}
.row .nm{overflow:hidden;text-overflow:ellipsis}
.row .ext{color:var(--dim);font-size:11px;margin-left:auto;padding-left:8px}
.row.ro{opacity:.85}
.row .lock{color:var(--dim);margin-left:4px}
.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);
  cursor:pointer;align-items:center}
.item:hover{background:var(--hover)}
.item.sel{background:var(--sel)}
.ico{width:24px;height:24px;flex:none;display:flex;align-items:center;
  justify-content:center;color:var(--dim)}
.ico svg,.ico img{width:24px;height:24px}
.ico img{object-fit:contain}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds,.sub{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-family:var(--mono);font-size:11px}
/* ---- 右栏 ---- */
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:4px;align-items:center;padding:7px 12px;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel)}
.tab{padding:5px 13px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--dim);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--panel2);border-color:var(--line);color:var(--fg);font-weight:500}
#tabcmd{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
/* ★ 别在这里写 `#pane-console{display:none}`：ID 选择器优先级高于 `.pane.on`，
   那样即使加了 .on，面板也永远是 0×0（实测踩到）。显隐只由 .pane/.pane.on 决定。 */
#pane-detail{overflow:auto;padding:18px 22px}
#pane-detail.on{display:block}
#pane-console.on{display:flex;flex-direction:column}
#pane-editor.on{display:flex;flex-direction:column}
.outbar{display:flex;gap:6px;align-items:center;padding:6px 12px;flex:none;
  border-bottom:1px solid var(--line2);background:var(--panel);color:var(--dim);font-size:12px}
.outbar .iconbtn{padding:4px 6px;min-width:28px}
#out{flex:1;overflow:auto;margin:0;padding:12px 14px;background:var(--out-bg);
  color:var(--out-fg);font-family:var(--mono);font-size:13px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
  user-select:text;-webkit-user-select:text;cursor:text}
#out::selection{background:#3a5a8c;color:#fff}
/* ---- 状态灯 ---- */
.lamp{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;
  box-sizing:border-box;background:transparent;border:1.5px solid #bfc0c9;vertical-align:middle}
.lamp[data-state=running]{border-color:transparent;background:#1f9d55;
  animation:lamp-pulse 1.15s ease-in-out infinite}
.lamp[data-state=ok]{border-color:transparent;background:#8e8e93;
  box-shadow:0 0 0 2px rgba(142,142,147,.16)}
.lamp[data-state=fail]{border-color:transparent;background:#d64545;box-shadow:0 0 7px rgba(214,69,69,.6)}
.lamp[data-state=warn]{border-color:transparent;background:#dfa100;box-shadow:0 0 7px rgba(223,161,0,.6)}
.lamp.big{width:11px;height:11px}
.lamp.tiny{width:7px;height:7px}
@keyframes lamp-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(31,157,85,.55);opacity:1}
  50%{box-shadow:0 0 0 5px rgba(31,157,85,0);opacity:.55}
}
.item[data-state=running]{box-shadow:inset 3px 0 0 #1f9d55}
.item .lamp{margin-left:6px}
.status{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--dim);margin-top:9px}
.spin{width:11px;height:11px;border-radius:50%;flex:none;display:none;
  border:1.6px solid rgba(127,127,127,.35);border-top-color:#1f9d55;
  animation:spin .7s linear infinite}
.spin.on{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- 编辑器：高亮层 + 透明 textarea 叠在一起（抄 exec 的做法）----
   两层字号/行高/字距/内边距/制表位**必须完全一致**，否则光标和字形会错位。 */
.editor{position:relative;flex:1;min-height:0;margin:10px 12px 12px;overflow:hidden;
  background:var(--code-bg);border:1px solid var(--line);border-radius:8px}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.editor > pre,.editor > textarea{
  position:absolute;inset:0;margin:0;border:0;padding:10px 12px;
  font:13px/1.55 var(--mono);letter-spacing:0;tab-size:4;white-space:pre;
  overflow:auto;overflow-wrap:normal;word-break:normal}
.editor > pre{pointer-events:none;color:var(--fg);background:transparent}
.editor > textarea{background:transparent;color:transparent;caret-color:var(--fg);
  resize:none;outline:none;user-select:text}
.editor > textarea::selection{background:rgba(10,132,255,.30)}
.editor > textarea[readonly]{caret-color:transparent}
/* 语法高亮：用应用自己的 token（照抄 exec 的 GitHub 配色） */
.hljs-comment,.hljs-quote{color:var(--syn-comment);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,
.hljs-doctag,.hljs-type,.hljs-name,.hljs-tag{color:var(--syn-keyword)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,
.hljs-meta .hljs-string{color:var(--syn-string)}
.hljs-number,.hljs-symbol,.hljs-bullet,.hljs-variable,
.hljs-template-variable,.hljs-link,.hljs-selector-attr,
.hljs-selector-pseudo{color:var(--syn-number)}
.hljs-title,.hljs-title.class_,.hljs-title.function_{color:var(--syn-title)}
.hljs-built_in,.hljs-builtin-name{color:var(--syn-builtin)}
.hljs-attr,.hljs-property,.hljs-params,.hljs-selector-class,
.hljs-selector-id{color:var(--syn-attr)}
.hljs-meta,.hljs-deletion{color:var(--syn-meta)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:600}
/* ---- 详情 ---- */
h1{font-size:19px;margin:0 0 4px}
.hd{display:flex;gap:14px;align-items:flex-start}
.bigico{width:44px;height:44px;flex:none;color:var(--dim)}
.bigico svg,.bigico img{width:44px;height:44px}
.chip{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);font-size:12px;color:var(--dim);margin:0 6px 6px 0}
.chip.click{cursor:pointer;font-family:var(--mono)}
.chip.click:hover{border-color:var(--accent);color:var(--accent)}
table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{color:var(--dim);font-weight:500}
code,.mono{font-family:var(--mono);font-size:12.5px}
.sec{margin-top:16px}
.sec h2{font-size:11.5px;letter-spacing:.06em;color:var(--dim);margin:0 0 6px;
  font-weight:600;text-transform:uppercase}
.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#args{flex:1;min-width:180px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);outline:none}
#args:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.empty{color:var(--dim);text-align:center;margin-top:70px;font-size:13px}
.note{padding:6px 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line2);
  background:var(--panel2);display:flex;align-items:center;gap:7px}
.note[hidden]{display:none}
.dirtydot{width:7px;height:7px;border-radius:50%;background:#dfa100;flex:none}
.dirtydot[hidden]{display:none}
/* ---- 小模态框（新建 / 重命名 / 确认删除）----
   不用 window.prompt：WebView2 里 prompt 是被禁掉的（返回 null、界面没反应）。 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
  align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;min-width:340px;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.card h3{margin:0 0 10px;font-size:15px}
.card p{margin:0 0 12px;color:var(--dim);font-size:13px;line-height:1.6;word-break:break-all}
.card input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);outline:none}
.card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--field-focus)}
.card .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.card .btns button{padding:6px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer}
.card .btns button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card .btns button.danger{background:#d64545;border-color:#d64545;color:#fff}
/* ---- 轻提示：不抢焦点、不换页（文件操作的结果在这里说一声就够）---- */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.22);
  max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.bad{border-color:#d64545;color:#d64545}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>moss</div>
  <input id="q" placeholder="搜索包名 / 说明 / 标签…">
  <div class="meta" id="meta"></div>
  <button id="btn-selfcheck" class="iconbtn" title="自检（moss --selfcheck）"></button>
  <button id="btn-refresh" class="iconbtn" title="刷新包列表"></button>
  <button id="btn-quit" class="iconbtn" title="退出"></button>
</header>

<main>
  <aside>
    <div id="sideswitch">
      <button id="sw-pkg" class="on" title="已安装的包"></button>
      <button id="sw-file" title="浏览 system/ 与 user_data/（可编辑）"></button>
    </div>
    <div id="list"></div>
    <div id="treewrap" hidden>
      <div id="treebar"></div>
      <div id="tree"></div>
    </div>
  </aside>

  <div id="right">
    <div id="tabs">
      <button class="tab active" data-tab="detail">详情</button>
      <button class="tab" data-tab="console">命令行<span class="lamp tiny" id="tablamp" data-state="idle"></span></button>
      <button class="tab" data-tab="editor">编辑器<span class="lamp tiny" id="editlamp" data-state="idle"></span></button>
      <span id="tabcmd"></span>
    </div>

    <section class="pane on" id="pane-detail"><div class="empty">左边选一个包</div></section>

    <section class="pane" id="pane-console">
      <div class="outbar">
        <span class="lamp" id="outlamp" data-state="idle"></span>
        <span class="spin" id="outspin"></span>
        <span id="outinfo">还没跑过</span>
        <span style="flex:1"></span>
        <button id="btn-copy" class="iconbtn" title="复制全部输出"></button>
        <button id="btn-rerun" class="iconbtn" title="再跑一次刚才那条命令"></button>
        <button id="btn-clear" class="iconbtn" title="清空输出"></button>
      </div>
      <pre id="out">就绪。选一个包，填参数，点「运行」。</pre>
    </section>

    <section class="pane" id="pane-editor">
      <div class="outbar">
        <span id="edpath" class="mono">没打开文件</span>
        <span class="dirtydot" id="eddirty" hidden title="有未保存的改动"></span>
        <span style="flex:1"></span>
        <button id="btn-save" class="iconbtn" title="保存（Ctrl+S）"></button>
        <button id="btn-revert" class="iconbtn" title="放弃改动，重新读一遍"></button>
        <button id="btn-reveal2" class="iconbtn" title="在资源管理器里显示"></button>
      </div>
      <div class="note" id="ednote" hidden></div>
      <div class="editor">
        <pre aria-hidden="true"><code id="hl" class="hljs"></code></pre>
        <textarea id="code" spellcheck="false" wrap="off"></textarea>
      </div>
    </section>
  </div>
</main>

<div id="modal"><div class="card">
  <h3 id="m-title">标题</h3>
  <p id="m-text"></p>
  <input id="m-input" autocomplete="off" spellcheck="false">
  <div class="btns">
    <button id="m-cancel">取消</button>
    <button id="m-ok" class="primary">确定</button>
  </div>
</div></div>
<div id="toasts"></div>

<script src="vendor/highlight.min.js"></script>
<script src="vendor/powershell.min.js"></script>
<script src="vendor/dos.min.js"></script>
<script src="vendor/lucide.js"></script>
<script>
/* ============================================================================
   moss 界面。三块：包列表（跑包）+ 文件树（浏览/编辑）+ 编辑器（代码高亮）。
   高亮层与编辑器抄 exec 的做法（highlight.js + pre/textarea 叠加）。
   ========================================================================== */

let DATA = null, cur = null, busy = false, tab = "detail";
let lastRun = null;                     // {id, args, label}
let side = "pkg";                       // pkg | file

const $ = s => document.querySelector(s);

/* ---------------------------------------------------------------- 图标 */
/* ---------- 后缀 → 图标 + 颜色 + 高亮语言（Lucide 的名子，颜色照各语言习惯 ---------- */
const EXT = {
  py:{i:"file-code",c:"#3572A5",l:"python"}, pyw:{i:"file-code",c:"#3572A5",l:"python"},
  js:{i:"file-code",c:"#c9a227",l:"javascript"}, mjs:{i:"file-code",c:"#c9a227",l:"javascript"},
  ts:{i:"file-code",c:"#2b7489",l:"typescript"}, go:{i:"file-code",c:"#00ADD8",l:"go"},
  rs:{i:"file-code",c:"#dea584",l:"rust"}, c:{i:"file-code",c:"#7a7a7a",l:"c"},
  h:{i:"file-code",c:"#7a7a7a",l:"c"}, cpp:{i:"file-code",c:"#f34b7d",l:"cpp"},
  java:{i:"file-code",c:"#b07219",l:"java"}, cs:{i:"file-code",c:"#178600",l:"csharp"},
  php:{i:"file-code",c:"#7a86b8",l:"php"}, rb:{i:"file-code",c:"#cc342d",l:"ruby"},
  lua:{i:"file-code",c:"#000080",l:"lua"}, sql:{i:"database",c:"#e38c00",l:"sql"},
  html:{i:"globe",c:"#e34c26",l:"xml"}, htm:{i:"globe",c:"#e34c26",l:"xml"},
  xml:{i:"code",c:"#8a8a8a",l:"xml"}, svg:{i:"palette",c:"#ffb13b",l:"xml"},
  css:{i:"palette",c:"#563d7c",l:"css"}, scss:{i:"palette",c:"#c6538c",l:"scss"},
  less:{i:"palette",c:"#1d365d",l:"less"},
  json:{i:"braces",c:"#c9a227",l:"json"}, jsonc:{i:"braces",c:"#c9a227",l:"json"},
  md:{i:"book-open",c:"#6e7781",l:"markdown"}, markdown:{i:"book-open",c:"#6e7781",l:"markdown"},
  txt:{i:"file-text",c:"#6e7781",l:"plaintext"}, log:{i:"file-text",c:"#6e7781",l:"plaintext"},
  bat:{i:"terminal",c:"#8a8a8a",l:"dos"}, cmd:{i:"terminal",c:"#8a8a8a",l:"dos"},
  ps1:{i:"terminal",c:"#2f6fb5",l:"powershell"}, psm1:{i:"terminal",c:"#2f6fb5",l:"powershell"},
  sh:{i:"terminal",c:"#4f9d3a",l:"bash"}, bash:{i:"terminal",c:"#4f9d3a",l:"bash"},
  toml:{i:"settings",c:"#9c4221",l:"ini"}, ini:{i:"settings",c:"#9c4221",l:"ini"},
  cfg:{i:"settings",c:"#9c4221",l:"ini"}, conf:{i:"settings",c:"#9c4221",l:"ini"},
  yml:{i:"settings",c:"#cb171e",l:"yaml"}, yaml:{i:"settings",c:"#cb171e",l:"yaml"},
  png:{i:"file-image",c:"#a074c4"}, jpg:{i:"file-image",c:"#a074c4"},
  jpeg:{i:"file-image",c:"#a074c4"}, gif:{i:"file-image",c:"#a074c4"},
  webp:{i:"file-image",c:"#a074c4"}, bmp:{i:"file-image",c:"#a074c4"},
  ico:{i:"file-image",c:"#a074c4"},
  exe:{i:"binary",c:"#8a8a8a"}, dll:{i:"binary",c:"#8a8a8a"}, pyd:{i:"binary",c:"#8a8a8a"},
  zip:{i:"file-archive",c:"#e0a800"}, "7z":{i:"file-archive",c:"#e0a800"},
  rar:{i:"file-archive",c:"#e0a800"}, gz:{i:"file-archive",c:"#e0a800"},
  mp3:{i:"file-audio",c:"#1f9d55"}, wav:{i:"file-audio",c:"#1f9d55"},
  mp4:{i:"file-video",c:"#d64545"}, mkv:{i:"file-video",c:"#d64545"},
  csv:{i:"file-spreadsheet",c:"#1f9d55"}, xlsx:{i:"file-spreadsheet",c:"#1f9d55"},
  key:{i:"file-key",c:"#c9a227"}, pem:{i:"file-key",c:"#c9a227"},
  license:{i:"copyright",c:"#6e7781"},
};
const NO_EXT = {
  LICENSE:{i:"copyright",c:"#6e7781",l:"plaintext"},
  "pkg.json":{i:"file-json",c:"#c9a227",l:"json"},
  ".gitignore":{i:"file-cog",c:"#8a8a8a",l:"plaintext"},
  ".gitattributes":{i:"file-cog",c:"#8a8a8a",l:"plaintext"},
};

function extOf(entry){
  const name = (entry.name || "").toLowerCase();
  if (NO_EXT[name]) return Object.assign({ext:""}, NO_EXT[name]);
  return Object.assign({ext:entry.ext || ""}, EXT[entry.ext] || {i:"file", c:"#8a8a8a"});
}

function fileIcon(entry, open){
  if (entry.dir) return ico(open ? "folder-open" : "folder", "i");
  const e = extOf(entry);
  return '<span style="color:' + e.c + ';display:flex">' + ico(e.i, "i") + '</span>';
}

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
}

function humanSize(n){
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

/* ---------------------------------------------------------------- 状态灯 */
const STATE = {};
let consoleWho = null;

function stateOf(id){ return STATE[id] || {state:"idle"}; }

function setState(id, st, extra){
  STATE[id] = Object.assign({state:st, ts:Date.now()}, extra || {});
  consoleWho = id;
  paintStates();
}

function stateLabel(s){
  if (s.state === "running") return "运行中";
  if (s.state === "ok") return "已完成 · 退出码 " + (s.code === undefined ? 0 : s.code) +
      (s.ms ? " · " + (s.ms / 1000).toFixed(2) + " 秒" : "");
  if (s.state === "fail") return "故障 · 退出码 " + (s.code === undefined ? "?" : s.code) +
      (s.ms ? " · " + (s.ms / 1000).toFixed(2) + " 秒" : "");
  if (s.state === "warn") return s.note || "有情况（结果未知）";
  return "还没跑过";
}

function paintStates(){
  document.querySelectorAll(".item").forEach(el => {
    const st = stateOf(el.dataset.id).state;
    el.dataset.state = st;
    const lamp = el.querySelector(".lamp");
    if (lamp) lamp.dataset.state = st;
  });
  const s = consoleWho ? stateOf(consoleWho) : {state:"idle"};
  [$("#tablamp"), $("#outlamp")].forEach(l => { if (l) l.dataset.state = s.state; });
  const sp = $("#outspin");
  if (sp) sp.classList.toggle("on", s.state === "running");
  const info = $("#outinfo");
  if (info && consoleWho) info.textContent = stateLabel(s);
  const pill = $("#statuspill");
  if (pill && cur){
    const cs = stateOf(cur.id);
    pill.querySelector(".lamp").dataset.state = cs.state;
    const t = $("#statustext");
    if (t) t.textContent = stateLabel(cs);
  }
}

function clearConsoleState(){
  consoleWho = null;
  const sp = $("#outspin");
  if (sp) sp.classList.remove("on");
  [$("#tablamp"), $("#outlamp")].forEach(l => { if (l) l.dataset.state = "idle"; });
  const info = $("#outinfo");
  if (info) info.textContent = "还没跑过";
}

/* ---------------------------------------------------------------- 面板 / 选项卡 */
function setTab(name){
  tab = name;
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === name));
  ["detail", "console", "editor"].forEach(t =>
    $("#pane-" + t).classList.toggle("on", t === name));
}

function setSide(which){
  side = which;
  $("#sw-pkg").classList.toggle("on", which === "pkg");
  $("#sw-file").classList.toggle("on", which === "file");
  $("#list").hidden = which !== "pkg";
  $("#treewrap").hidden = which !== "file";
  $("#q").placeholder = which === "pkg" ? "搜索包名 / 说明 / 标签…" : "在已展开的目录里按名字过滤…";
  if (which === "file") renderTree(); else renderList();
}

/* ---------------------------------------------------------------- 输出区 */
function stripAnsi(s){
  return String(s == null ? "" : s)
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "")
    .replace(/\x1b[()][A-Za-z0-9]/g, "")
    .replace(/[\r\f]/g, "");
}

function out(text, info){
  const el = $("#out");
  el.textContent = stripAnsi(text);
  el.scrollTop = el.scrollHeight;
  if (info !== undefined && info !== null){
    const i = $("#outinfo");
    if (i) i.textContent = info;
  }
}

async function copyOut(){
  const text = $("#out").textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ ok = false; }
  if (!ok){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
  }
  $("#outinfo").textContent = ok ? ("已复制 " + text.length + " 个字符")
                                 : "复制失败（可以手动选中后 Ctrl+C）";
}

function setCmd(text){ $("#tabcmd").textContent = text || ""; }

/* ---------------------------------------------------------------- 包列表 */

function safeSvg(text){
  try{
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    if (doc.querySelector("parsererror")) return "";
    doc.querySelectorAll("script,foreignObject,iframe,use[href^='http']").forEach(n => n.remove());
    doc.querySelectorAll("*").forEach(n => {
      [...n.attributes].forEach(a => {
        if (/^on/i.test(a.name) || /^(href|xlink:href)$/i.test(a.name)) n.removeAttribute(a.name);
      });
    });
    const svg = doc.documentElement;
    svg.removeAttribute("width"); svg.removeAttribute("height");
    return svg.outerHTML;
  }catch(e){ return ""; }
}

function iconHTML(p, cls){
  if (p.icon_svg){ const s = safeSvg(p.icon_svg); if (s) return '<span class="' + cls + '">' + s + '</span>'; }
  if (p.icon) return '<span class="' + cls + '"><img src="' + p.icon + '" alt=""></span>';
  return '<span class="' + cls + '"></span>';
}

function esc(s){ return escapeHtml(s); }

/* ---------------------------------------------------------------- 文件树 */
let ROOTS = [];
const TREE = { open: new Set(), cache: new Map(), sel: null };

async function treeInit(){
  const r = await pywebview.api.fs_roots();
  ROOTS = (r.roots || []).filter(x => x.exists);
  TREE.cache.clear(); TREE.open.clear();
  // 默认展开两层：根 + pkgs（不然进来是一片折叠）
  ROOTS.forEach(x => TREE.open.add(x.key));
  for (const x of ROOTS){ TREE.cache.set(x.key, await fsList(x.key)); }
  renderTree();
}

async function fsList(rel){
  const r = await pywebview.api.fs_list(rel);
  return (r && r.ok) ? r.entries : [];
}

function isWritable(rel){ return !!rel && rel.split("/")[0] === "user"; }

async function toggleDir(rel){
  if (TREE.open.has(rel)){ TREE.open.delete(rel); renderTree(); return; }
  TREE.open.add(rel);
  if (!TREE.cache.has(rel)) TREE.cache.set(rel, await fsList(rel));
  renderTree();
}

function renderTree(){
  const box = $("#tree");
  const q = side === "file" ? $("#q").value.trim().toLowerCase() : "";
  const lines = [];

  function walk(rel, entry, depth){
    const open = TREE.open.has(rel);
    const e = extOf(entry);
    const lock = !isWritable(rel) && depth === 0
      ? '<span class="lock" title="只读：出厂件，升级时会被整体替换">' + ico("file-lock", "i") + '</span>'
      : "";
    lines.push(
      '<div class="row' + (TREE.sel === rel ? " sel" : "") + '" data-rel="' + esc(rel) + '"' +
        ' data-dir="' + (entry.dir ? "1" : "0") + '" style="padding-left:' + (10 + depth * 14) + 'px">' +
        '<span class="tw">' + (entry.dir ? ico(open ? "chevron-down" : "chevron-right", "i") : "") + '</span>' +
        fileIcon(entry, open) +
        '<span class="nm">' + esc(entry.name) + '</span>' + lock +
        (entry.dir ? "" : '<span class="ext">' + (entry.size != null ? humanSize(entry.size) : "") + '</span>') +
      '</div>');

    if (entry.dir && open){
      const kids = TREE.cache.get(rel) || [];
      for (const k of kids){
        if (q && !k.dir && !k.name.toLowerCase().includes(q)) continue;
        walk(k.rel, k, depth + 1);
      }
      if (!kids.length){
        lines.push('<div class="empty" style="margin:10px 0;font-size:12px">（空目录）</div>');
      }
    }
  }

  for (const root of ROOTS){
    const rec = {name: root.label, dir: true, rel: root.key,
                 size: null, ext: ""};
    // 先画根本身，再画它的孩子（根永远展开，且不显示折叠箭头）
    const open = true;
    lines.push(
      '<div class="row' + (TREE.sel === root.key ? " sel" : "") + '" data-rel="' + esc(root.key) + '" data-dir="1">' +
        '<span class="tw">' + ico("chevron-down", "i") + '</span>' +
        '<span style="color:' + (root.writable ? "#0a84ff" : "#8a8a8a") + ';display:flex">' +
          ico("folder-tree", "i") + '</span>' +
        '<span class="nm" style="font-weight:500">' + esc(root.label) + '</span>' +
        (root.writable ? "" : '<span class="lock" title="只读：出厂件，升级时会被整体替换">' +
          ico("file-lock", "i") + '</span>') +
        '<span class="ext" title="' + esc(root.why) + '">' + (root.writable ? "可写" : "只读") + '</span>' +
      '</div>');
    for (const k of (TREE.cache.get(root.key) || [])){
      if (q && !k.dir && !k.name.toLowerCase().includes(q)) continue;
      walk(k.rel, k, 1);
    }
  }

  box.innerHTML = lines.join("");
  box.querySelectorAll(".row").forEach(el => {
    el.onclick = async () => {
      const rel = el.dataset.rel;
      TREE.sel = rel;
      renderTreeBar();
      if (el.dataset.dir === "1"){
        if (rel.split("/").length === 1) return;      // 根不给折叠
        await toggleDir(rel);
      } else {
        await openFile(rel);
      }
      renderTree();
    };
  });
}

function selectedEntry(){
  if (!TREE.sel) return null;
  const key = TREE.sel.split("/")[0];
  if (TREE.sel.split("/").length === 1) return {name: key, dir: true, rel: TREE.sel};
  const parent = TREE.sel.split("/").slice(0, -1).join("/");
  return (TREE.cache.get(parent) || []).find(x => x.rel === TREE.sel) || null;
}

function renderTreeBar(){
  const bar = $("#treebar");
  const ent = selectedEntry();
  const writable = isWritable(TREE.sel);
  const dirTarget = ent && ent.dir ? TREE.sel
                  : (TREE.sel ? TREE.sel.split("/").slice(0, -1).join("/") : "user");
  const btns = [
    ["file-plus", "新建文件", "newfile", writable, dirTarget],
    ["folder-plus", "新建文件夹", "newdir", writable, dirTarget],
    ["pencil", "重命名", "rename", writable && !!ent, TREE.sel],
    ["trash-2", "删除（挪进回收站，可恢复）", "del", writable && !!ent, TREE.sel],
    ["refresh-cw", "重新读一遍这个目录", "reload", true, dirTarget],
    ["external-link", "在资源管理器里显示", "reveal", !!ent, TREE.sel],
  ];
  bar.innerHTML = btns.map(b =>
    '<button class="iconbtn' + (b[2] === "del" ? " warn" : "") + '" data-act="' + b[2] +
    '" data-target="' + esc(b[4] || "") + '" title="' + esc(b[1]) + '"' +
    (b[3] ? "" : " disabled") + '>' + ico(b[0], "i") + '</button>').join("") +
    '<span style="flex:1"></span>' +
    '<span class="mono" style="font-size:11px;color:var(--dim);align-self:center;' +
    'max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' +
    esc(TREE.sel || "") + '">' + esc((TREE.sel || "").replace(/^[^/]+\//, "")) + '</span>';

  bar.querySelectorAll("button").forEach(b => {
    b.onclick = () => treeAction(b.dataset.act, b.dataset.target);
  });
}

async function reloadTreeAt(rel){
  const dir = rel && rel.split("/").length > 1
    ? (selectedEntry() && selectedEntry().dir ? rel : rel.split("/").slice(0, -1).join("/"))
    : rel;
  if (dir && TREE.cache.has(dir)) TREE.cache.set(dir, await fsList(dir));
  renderTree(); renderTreeBar();
}

async function treeAction(act, target){
  if (act === "reload"){ await reloadTreeAt(target); return; }
  if (act === "reveal"){ const r = await pywebview.api.fs_reveal(target); toast(r.msg, !r.ok); return; }
  if (act === "newfile" || act === "newdir"){
    const isDir = act === "newdir";
    askText(isDir ? "新建文件夹" : "新建文件", isDir ? "新建文件夹" : "untitled.py",
      async (name) => {
        const r = isDir ? await pywebview.api.fs_mkdir(target, name)
                        : await pywebview.api.fs_touch(target, name);
        toast(r.msg, !r.ok);
        if (r.ok){
          if (!TREE.open.has(target)) TREE.open.add(target);
          TREE.cache.set(target, await fsList(target));
          TREE.sel = r.rel;
          renderTree(); renderTreeBar();
          if (!isDir) await openFile(r.rel);
        }
      });
    return;
  }
  if (act === "rename"){
    const ent = selectedEntry();
    askText("重命名", ent ? ent.name : "", async (name) => {
      const r = await pywebview.api.fs_rename(target, name);
      toast(r.msg, !r.ok);
      if (r.ok){
        const parent = r.rel.split("/").slice(0, -1).join("/");
        TREE.cache.set(parent, await fsList(parent));
        TREE.sel = r.rel;
        if (ED.rel === r.old){ ED.rel = r.rel; ED.path = r.rel; $("#edpath").textContent = r.rel; }
        renderTree(); renderTreeBar();
      }
    });
    return;
  }
  if (act === "del"){
    const ent = selectedEntry();
    askConfirm("删除", "把 “" + (ent ? ent.name : target) +
      "” 挪进 user_data/trash/（**不是真删**，后悔了能拿回来）。确定吗？", async () => {
        const r = await pywebview.api.fs_delete(target);
        toast(r.msg, !r.ok);
        if (r.ok){
          if (ED.rel === target || (ED.rel || "").startsWith(target + "/")) closeFile();
          const parent = target.split("/").slice(0, -1).join("/") || target.split("/")[0];
          TREE.cache.set(parent, await fsList(parent));
          TREE.sel = parent;
          renderTree(); renderTreeBar();
        }
      });
  }
}

async function revealInTree(rel){
  // 逐级展开到目标，并把光标定位过去
  const parts = rel.split("/");
  let acc = parts[0];
  TREE.open.add(acc);
  TREE.cache.set(acc, TREE.cache.get(acc) || await fsList(acc));
  for (let i = 1; i < parts.length; i++){
    acc = parts.slice(0, i + 1).join("/");
    TREE.open.add(acc);
    if (!TREE.cache.has(acc)) TREE.cache.set(acc, await fsList(acc));
  }
  TREE.sel = rel;
  setSide("file");
  renderTree(); renderTreeBar();
}

/* ---------------------------------------------------------------- 编辑器 */
const ED = {rel:null, path:null, lang:"plaintext", original:"", writable:false, loaded:false};

function setEditLamp(st){
  const l = $("#editlamp");
  if (l) l.dataset.state = st;
}

function markDirty(){
  const dirty = ED.loaded && $("#code").value !== ED.original;
  $("#eddirty").hidden = !dirty;
  if (ED.loaded) setEditLamp(dirty ? "warn" : "ok");
  $("#btn-save").disabled = !(dirty && ED.writable);
}

function highlightNow(){
  const text = $("#code").value;
  const target = $("#hl");
  // 大文件不逐键高亮：几十万字符每次输入都重排一遍，打字会卡（按纯文本显示）
  if (text.length > 300000){ target.textContent = text + "\n"; return; }
  if (window.hljs && ED.lang && hljs.getLanguage(ED.lang)){
    try{
      target.innerHTML = hljs.highlight(text, {language: ED.lang, ignoreIllegals: true}).value + "\n";
      return;
    }catch(e){ /* 退回纯文本 */ }
  }
  target.textContent = text + "\n";
}

let hlTimer = null;
function scheduleHighlight(){
  clearTimeout(hlTimer);
  hlTimer = setTimeout(highlightNow, 120);      // 打字时别每个字符都重算
}

function syncScroll(){
  const ta = $("#code"), pre = $("#hl").parentElement;
  if (!ta || !pre) return;
  pre.scrollTop = ta.scrollTop;
  pre.scrollLeft = ta.scrollLeft;
}

async function openFile(rel){
  const r = await pywebview.api.fs_read(rel);
  if (!r.ok){ toast("✗ " + r.msg, true); return; }
  const name = rel.split("/").pop();
  const entry = {name: name, ext: (name.split(".").pop() || "").toLowerCase()};
  const meta = extOf(entry);
  ED.rel = rel; ED.path = r.path || rel; ED.lang = meta.l || "plaintext";
  ED.original = r.text || ""; ED.writable = !!r.writable;
  ED.loaded = true;
  const code = $("#code");
  code.value = ED.original;
  code.readOnly = !(r.writable && !r.binary && !r.too_big);
  $("#edpath").textContent = rel + (r.writable ? "" : "　（只读）");
  const note = $("#ednote");
  let msg = "";
  if (r.binary) msg = ico("binary", "i") + " 二进制文件，只读打开";
  else if (r.too_big) msg = ico("alert-triangle", "i") + " " + r.msg;
  else if (!r.writable) msg = ico("file-lock", "i") + " 出厂件（system/）—— 只读；想改先复制到 user_data/";
  note.innerHTML = msg;
  note.hidden = !msg;
  setTab("editor");
  highlightNow();
  syncScroll();
  markDirty();
}

function closeFile(){
  ED.rel = null; ED.loaded = false; ED.original = "";
  $("#code").value = "";
  $("#hl").textContent = "";
  $("#edpath").textContent = "没打开文件";
  $("#ednote").hidden = true;
  $("#eddirty").hidden = true;
  setEditLamp("idle");
  $("#btn-save").disabled = true;
}

async function saveFile(){
  if (!ED.loaded) return;
  if (!ED.writable){ toast("这是只读文件（system/）—— 想改就复制到 user_data/", true); return; }
  const r = await pywebview.api.fs_write(ED.rel, $("#code").value);
  toast(r.ok ? ("已保存 " + ED.rel) : ("✗ " + r.msg), !r.ok);
  if (r.ok){
    ED.original = $("#code").value;
    markDirty();
    const parent = ED.rel.split("/").slice(0, -1).join("/");
    TREE.cache.set(parent, await fsList(parent));
    renderTree();
  }
}

/* ---------------------------------------------------------------- 小模态框 */
let modalCb = null;

function askText(title, value, cb){
  $("#m-title").textContent = title;
  $("#m-text").textContent = "";
  const inp = $("#m-input");
  inp.hidden = false; inp.value = value || "";
  $("#m-ok").className = "primary";
  $("#modal").classList.add("on");
  setTimeout(() => { inp.focus(); inp.select(); }, 30);
  modalCb = () => cb(inp.value.trim());
}

function askConfirm(title, text, cb){
  $("#m-title").textContent = title;
  $("#m-text").textContent = text.replace(/\*\*/g, "");
  $("#m-input").hidden = true;
  $("#m-ok").className = "danger";
  $("#modal").classList.add("on");
  setTimeout(() => $("#m-ok").focus(), 30);
  modalCb = () => cb();
}

function closeModal(){ $("#modal").classList.remove("on"); modalCb = null; }

/* 轻提示：文件操作（保存/新建/改名/删除）的结果用这个说一声 ——
   ★ 不能像以前那样 `out()` + 切到「命令行」：存个文件就把人从编辑器拽走，
   而且那个 tab 里还留着上一次跑包的输出，混在一起。 */
function toast(text, bad){
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* ---------------------------------------------------------------- 启动 */
async function init(){
  DATA = await pywebview.api.state();
  $("#meta").textContent =
    DATA.packages.length + " 个包 · 启动方式：" + DATA.launch_kind + " · " + DATA.home;
  renderList();
  paintStates();
  renderTreeBar();
  await treeInit();
}

/* 静态按钮：把文字换成图标（图标库 Lucide，tooltip 走 title） */
function paintStaticIcons(){
  $("#btn-selfcheck").innerHTML = ico("activity", "i");
  $("#btn-refresh").innerHTML   = ico("refresh-cw", "i");
  $("#btn-quit").innerHTML      = ico("x", "i");
  $("#btn-copy").innerHTML      = ico("copy", "i");
  $("#btn-rerun").innerHTML     = ico("rotate-cw", "i");
  $("#btn-clear").innerHTML     = ico("eraser", "i");
  $("#btn-save").innerHTML      = ico("save", "i");
  $("#btn-revert").innerHTML    = ico("undo-2", "i");
  $("#btn-reveal2").innerHTML   = ico("external-link", "i");
  $("#sw-pkg").innerHTML        = ico("package", "i") + "<span>包</span>";
  $("#sw-file").innerHTML       = ico("folder-tree", "i") + "<span>文件</span>";
}

$("#q").addEventListener("input", () => { if (side === "file") renderTree(); else renderList(); });
$("#btn-refresh").onclick = init;
$("#btn-quit").onclick = () => pywebview.api.quit();
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#sw-pkg").onclick = () => setSide("pkg");
$("#sw-file").onclick = () => { setSide("file"); renderTreeBar(); };
$("#btn-copy").onclick = copyOut;
$("#btn-clear").onclick = () => { out(""); setCmd(""); clearConsoleState(); };
$("#btn-save").onclick = saveFile;
$("#btn-revert").onclick = () => { if (ED.rel) openFile(ED.rel); };
$("#btn-reveal2").onclick = () => { if (ED.rel) pywebview.api.fs_reveal(ED.rel); };
$("#m-cancel").onclick = closeModal;
$("#m-ok").onclick = () => { const cb = modalCb; closeModal(); if (cb) cb(); };
$("#m-input").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); $("#m-ok").click(); }
  if (e.key === "Escape"){ closeModal(); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

$("#code").addEventListener("input", () => {
  scheduleHighlight();
  markDirty();
});
$("#code").addEventListener("scroll", syncScroll);
$("#code").addEventListener("keydown", e => {
  if (e.key === "Tab"){                       // Tab 插四个空格（不然焦点跳走）
    e.preventDefault();
    const el = e.target, p = el.selectionStart;
    el.value = el.value.slice(0, p) + "    " + el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = p + 4;
    highlightNow(); markDirty();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); saveFile(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").classList.contains("on")) closeModal();
});

$("#btn-rerun").onclick = async () => {
  if (!lastRun || busy) return;
  busy = true;
  const btn = $("#btn-rerun"); btn.disabled = true;
  setCmd(lastRun.label);
  setState(lastRun.id, "running");
  out("$ " + lastRun.label);
  const t0 = performance.now();
  const r = await pywebview.api.run(lastRun.id, lastRun.args);
  out("$ " + lastRun.label + "\n\n" + (r.out || "(这个包没有输出)") + "\n[退出码] " + r.code);
  setState(lastRun.id, r.code === 0 ? "ok" : "fail",
           {code: r.code, ms: Math.round(performance.now() - t0)});
  btn.disabled = false;
  busy = false;
};

$("#btn-selfcheck").onclick = async () => {
  setTab("console"); setCmd("moss --selfcheck");
  setState("__host__", "running");
  out("$ moss --selfcheck");
  const t0 = performance.now();
  const r = await pywebview.api.run_host("--selfcheck");
  out("$ moss --selfcheck\n\n" + (r.out || "(没有输出)") + "\n[退出码] " + r.code);
  setState("__host__", r.code === 0 ? "ok" : "fail",
           {code: r.code, ms: Math.round(performance.now() - t0)});
};

paintStaticIcons();
window.addEventListener("pywebviewready", init);
</script>
