<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moss</title>
<style>
:root{
  --bg:#f5f5f7; --panel:#fff; --panel2:#fbfbfd; --line:#e2e2e8; --line2:#eeeef3;
  --fg:#1c1c1e; --dim:#6b6b73; --accent:#0a84ff; --accent-fg:#fff;
  --hover:#f0f0f4; --sel:#e8f1ff; --out-bg:#14161a; --out-fg:#d7dae0;
  --mono: ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181d; --panel:#1d2026; --panel2:#22252c; --line:#2c3038; --line2:#262a31;
         --fg:#e8eaed; --dim:#9aa0aa; --hover:#262a31; --sel:#1f2c3d; --out-bg:#0f1114; --out-fg:#c9ced6; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--fg);background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
#q{width:260px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);outline:none}
#q:focus{border-color:var(--accent)}
.meta{flex:1;color:var(--dim);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:right}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:disabled{opacity:.55;cursor:default}
main{flex:1;display:flex;min-height:0}
/* 左栏：包列表，**高度从头到脚占满** */
aside{width:300px;flex:none;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.item{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);
  cursor:pointer;align-items:center}
.item:hover{background:var(--hover)}
.item.sel{background:var(--sel)}
.ico{width:24px;height:24px;flex:none;display:flex;align-items:center;
  justify-content:center;color:var(--dim)}
.ico svg,.ico img{width:24px;height:24px}
.ico img{object-fit:contain}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds,.sub{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-family:var(--mono);font-size:11px}
/* 右栏：选项卡（详情 / 命令行），命令行独占整块右栏 */
#right{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:4px;align-items:center;padding:7px 12px;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel)}
.tab{padding:5px 13px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--dim);cursor:pointer;font-size:13px}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--panel2);border-color:var(--line);color:var(--fg);font-weight:500}
#tabcmd{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.pane{flex:1;min-height:0;display:none}
.pane.on{display:flex;flex-direction:column}
/* ★ 别在这里写 `#pane-console{display:none}`：ID 选择器的优先级**高于** `.pane.on`，
   那样即使加了 .on，命令行面板也永远是 0×0（实测踩到：切过去一片空白）。
   "显示哪个面板"只由 `.pane` / `.pane.on` 决定，这里只管各自的排版。 */
#pane-detail{overflow:auto;padding:18px 22px}
#pane-detail.on{display:block}
#pane-console.on{display:flex;flex-direction:column}
.outbar{display:flex;gap:8px;align-items:center;padding:7px 12px;flex:none;
  border-bottom:1px solid var(--line2);background:var(--panel);color:var(--dim);font-size:12px}
.outbar button{padding:4px 10px;font-size:12.5px}
#out{flex:1;overflow:auto;margin:0;padding:12px 14px;background:var(--out-bg);
  color:var(--out-fg);font-family:var(--mono);font-size:13px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
  user-select:text;-webkit-user-select:text;cursor:text}
#out::selection{background:#3a5a8c;color:#fff}
h1{font-size:19px;margin:0 0 4px}
.hd{display:flex;gap:14px;align-items:flex-start}
.bigico{width:44px;height:44px;flex:none;color:var(--dim)}
.bigico svg,.bigico img{width:44px;height:44px}
.chip{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);font-size:12px;color:var(--dim);margin:0 6px 6px 0}
.chip.click{cursor:pointer;font-family:var(--mono)}
.chip.click:hover{border-color:var(--accent);color:var(--accent)}
table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{color:var(--dim);font-weight:500}
code,.mono{font-family:var(--mono);font-size:12.5px}
.sec{margin-top:16px}
.sec h2{font-size:11.5px;letter-spacing:.06em;color:var(--dim);margin:0 0 6px;
  font-weight:600;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#args{flex:1;min-width:200px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font-family:var(--mono);outline:none}
#args:focus{border-color:var(--accent)}
.empty{color:var(--dim);text-align:center;margin-top:80px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>moss</div>
  <input id="q" placeholder="搜索包名 / 说明 / 标签…">
  <div class="meta" id="meta"></div>
  <button id="btn-selfcheck">自检</button>
  <button id="btn-refresh">刷新</button>
  <button id="btn-quit">退出</button>
</header>
<main>
  <aside id="list"></aside>
  <div id="right">
    <div id="tabs">
      <button class="tab active" data-tab="detail">详情</button>
      <button class="tab" data-tab="console">命令行</button>
      <span id="tabcmd"></span>
    </div>
    <section class="pane on" id="pane-detail"><div class="empty">左边选一个包</div></section>
    <section class="pane" id="pane-console">
      <div class="outbar">
        <button id="btn-copy">复制全部</button>
        <button id="btn-rerun">再跑一次</button>
        <button id="btn-clear">清空</button>
        <span id="outinfo">输出</span>
      </div>
      <pre id="out">就绪。选一个包，填参数，点「运行（看输出）」。</pre>
    </section>
  </div>
</main>

<script>
let DATA = null, cur = null, busy = false, tab = "detail";
let lastRun = null;          // {id, args} —— 「再跑一次」用

const $ = s => document.querySelector(s);

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* 包里的 svg 是**数据不是指令**（X-16）：剥掉 script / 事件属性再内联，
   这样它既能跟着主题变色（图标用的是 currentColor），又跑不了脚本。 */
function safeSvg(text){
  try{
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    if (doc.querySelector("parsererror")) return "";
    doc.querySelectorAll("script,foreignObject,iframe,use[href^='http']").forEach(n => n.remove());
    doc.querySelectorAll("*").forEach(n => {
      [...n.attributes].forEach(a => {
        if (/^on/i.test(a.name) || /^(href|xlink:href)$/i.test(a.name)) n.removeAttribute(a.name);
      });
    });
    const svg = doc.documentElement;
    svg.removeAttribute("width"); svg.removeAttribute("height");
    return svg.outerHTML;
  }catch(e){ return ""; }
}

function iconHTML(p, cls){
  if (p.icon_svg){ const s = safeSvg(p.icon_svg); if (s) return `<span class="${cls}">${s}</span>`; }
  if (p.icon) return `<span class="${cls}"><img src="${p.icon}" alt=""></span>`;
  return `<span class="${cls}"></span>`;
}

function stripAnsi(s){
  /* 宿主在管道里本来就不写颜色码了（core/out.py 的 stdout_is_terminal），这里再兜一层：
     万一某个包自己打了 ANSI，界面里也不该出现 `←[36;1m` 这种东西。 */
  return String(s == null ? "" : s)
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "")
    .replace(/\x1b[()][A-Za-z0-9]/g, "")
    .replace(/[\r\f]/g, "");
}

function setTab(name){
  tab = name;
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === name));
  $("#pane-detail").classList.toggle("on", name === "detail");
  $("#pane-console").classList.toggle("on", name === "console");
}

function setCmd(text){
  $("#tabcmd").textContent = text || "";
}

function out(text, info){
  const el = $("#out");
  el.textContent = stripAnsi(text);
  el.scrollTop = el.scrollHeight;
  $("#outinfo").textContent = info || "输出";
}

async function copyOut(){
  const text = $("#out").textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){ ok = false; }
  if (!ok){                       // WebView2 里 clipboard API 可能被挡，退回老办法
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
  }
  $("#outinfo").textContent = ok ? ("已复制 " + text.length + " 个字符") : "复制失败（可以手动选中后 Ctrl+C）";
}

function renderList(){
  const f = $("#q").value.trim().toLowerCase();
  const box = $("#list");
  box.innerHTML = "";
  const rows = DATA.packages.filter(p => {
    if (!f) return true;
    const hay = [p.id, p.name, p.desc, (p.tags||[]).join(" "), (p.aliases||[]).join(" ")]
      .join(" ").toLowerCase();
    return hay.includes(f);
  });
  if (!rows.length){
    box.innerHTML = '<div class="empty">没有匹配的包</div>';
    return;
  }
  for (const p of rows){
    const d = document.createElement("div");
    d.className = "item" + (cur && cur.id === p.id ? " sel" : "");
    d.innerHTML = iconHTML(p, "ico") +
      `<div style="min-width:0;flex:1">
         <div class="nm">${esc(p.name)} <span class="sub">:${esc(p.id)}</span></div>
         <div class="ds">${esc(p.desc)}</div>
       </div>`;
    d.onclick = () => select(p.id);
    box.appendChild(d);
  }
}

function select(id){
  cur = DATA.packages.find(p => p.id === id) || null;
  renderList();
  renderDetail();
  setTab("detail");
}

function renderDetail(){
  const box = $("#pane-detail");
  if (!cur){ box.innerHTML = '<div class="empty">左边选一个包</div>'; return; }
  const p = cur;
  const params = p.params || [];
  let html = `<div class="hd">${iconHTML(p, "bigico")}
      <div style="min-width:0">
        <h1>${esc(p.name)}</h1>
        <div class="sub">:${esc(p.id)}　v${esc(p.version || "?")}　${esc(p.kind)}　${esc(p.layer)} 层${p.shadowed ? "　（遮住了 " + esc(p.shadowed) + " 层的同名包）" : ""}</div>
      </div></div>
    <p style="margin:12px 0 4px">${esc(p.desc)}</p>
    <div>${(p.aliases||[]).map(a => `<span class="chip">:${esc(a)}</span>`).join("")}
      ${(p.tags||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("")}
      ${p.ai_expose ? `<span class="chip">AI 可调用 · 风险 ${esc(p.ai_risk || "?")}</span>` : ""}</div>`;

  if (params.length){
    html += `<div class="sec"><h2>参数</h2><table>
      <tr><th style="width:120px">名称</th><th style="width:70px">类型</th><th style="width:60px">必填</th><th>说明</th></tr>
      ${params.map(pa => `<tr>
        <td class="mono">${esc(pa.name)}${pa.rest ? ' <span class="chip">rest</span>' : ""}</td>
        <td class="mono">${esc(pa.type || "string")}</td>
        <td>${pa.required ? "是" : "否"}</td>
        <td>${esc(pa.desc || "")}${pa.placeholder ? `<div class="sub">例：${esc(pa.placeholder)}</div>` : ""}</td>
      </tr>`).join("")}
    </table></div>`;
  }

  if ((p.examples || []).length){
    html += `<div class="sec"><h2>例子（点一下填进参数框）</h2>
      <div>${p.examples.map(e => `<span class="chip click" data-args="${esc(e)}">${esc(e)}</span>`).join("")}</div></div>`;
  }

  html += `<div class="sec"><h2>跑一下</h2>
    <div class="row">
      <input id="args" placeholder="参数（可留空；留空 = 通常是开界面）">
      <button class="primary" id="btn-run">运行（看输出）</button>
      <button id="btn-openui">打开界面（后台）</button>
    </div>
    <div class="sub" style="margin-top:8px">命令预览：<span class="mono" id="preview"></span></div>
  </div>

  <div class="sec"><h2>位置</h2>
    <div class="row"><span class="mono" style="flex:1;word-break:break-all">${esc(p.dir)}</span>
      <button id="btn-dir">打开包目录</button></div>
  </div>`;

  box.innerHTML = html;

  const upd = () => {
    $("#preview").textContent = "moss :" + p.id + ($("#args").value.trim() ? " " + $("#args").value.trim() : "");
  };
  $("#args").addEventListener("input", upd);
  upd();

  box.querySelectorAll(".chip.click").forEach(c => {
    c.onclick = () => { $("#args").value = c.dataset.args || ""; upd(); };
  });

  $("#btn-run").onclick = async () => {
    if (busy) return;
    busy = true;
    const btn = $("#btn-run"); btn.disabled = true; btn.textContent = "运行中…";
    const args = $("#args").value;
    const cmd = $("#preview").textContent;
    lastRun = {id: p.id, args: args, label: cmd};
    setTab("console"); setCmd(cmd);
    out("$ " + cmd + "\n（跑着呢…）", "运行中");
    const r = await pywebview.api.run(p.id, args);
    out("$ " + cmd + "\n\n" + (r.out || "(这个包没有输出)") + "\n[退出码] " + r.code,
        "退出码 " + r.code + " · " + (r.out || "").length + " 字符");
    btn.disabled = false; btn.textContent = "运行（看输出）";
    busy = false;
  };
  $("#btn-openui").onclick = async () => {
    const r = await pywebview.api.open_ui(p.id, $("#args").value);
    setTab("console"); setCmd("moss :" + p.id);
    out(r.msg, "后台");
  };
  $("#btn-dir").onclick = () => pywebview.api.open_path(p.dir);
}

async function init(){
  DATA = await pywebview.api.state();
  $("#meta").textContent =
    `${DATA.packages.length} 个包 · 启动方式：${DATA.launch_kind} · ${DATA.home}`;
  renderList();
}

$("#q").addEventListener("input", renderList);
$("#btn-refresh").onclick = init;
$("#btn-quit").onclick = () => pywebview.api.quit();
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#btn-copy").onclick = copyOut;
$("#btn-clear").onclick = () => { out("", "输出"); setCmd(""); };
$("#btn-rerun").onclick = async () => {
  if (!lastRun || busy) return;
  busy = true; $("#outinfo").textContent = "运行中";
  out("$ " + lastRun.label + "\n（跑着呢…）", "运行中");
  const r = await pywebview.api.run(lastRun.id, lastRun.args);
  out("$ " + lastRun.label + "\n\n" + (r.out || "(这个包没有输出)") + "\n[退出码] " + r.code,
      "退出码 " + r.code);
  busy = false;
};
$("#btn-selfcheck").onclick = async () => {
  setTab("console"); setCmd("moss --selfcheck");
  out("$ moss --selfcheck\n（跑着呢…）", "运行中");
  const r = await pywebview.api.run_host("--selfcheck");
  out("$ moss --selfcheck\n\n" + (r.out || "(没有输出)") + "\n[退出码] " + r.code,
      "退出码 " + r.code);
};

window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
